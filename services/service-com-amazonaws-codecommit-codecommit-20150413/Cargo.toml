[package]
name = "service-com-amazonaws-codecommit-codecommit-20150413"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
# The STS session registry, so the identity this service records for a request is the
# principal the credential it was signed with was minted for (see
# `crate::state::caller_identity_arn`).
service-com-amazonaws-sts-awssecuritytokenservicev20110615 = { workspace = true }
# The IAM account: whose policies decide a git request. The git transport resolves the
# credential a git client presents to its principal through the registries that minted
# it — the account's access keys, its service-specific git credentials and its roles —
# and reads the identity-based documents in force on it through IAM's own accessors
# (`src/service/git_authorization.rs`).
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
# `iam_authorization`: the ONE evaluation of an IAM policy document against an action,
# a resource and a condition context, which is what decides `codecommit:GitPull` and
# per-reference `codecommit:GitPush`; `iam_role` and `caller_principal`: the shared
# readings of a principal ARN; `in_band_tls` and `data_plane_addressing`: the ONE
# reading of a listener's published `host:port` and of a connection whose encryption is
# negotiated in band, which the announced git address is served through.
service-common = { path = "../common" }
# The AWS SDK for EventBridge, driven over the in-process callback: the entry type a
# pull request's lifecycle change is published as, onto the account's default event bus
# (`src/state/pull_request_events.rs`). Only the generated client is needed — the
# emulator supplies the transport.
aws-sdk-eventbridge = { version = "1", default-features = false }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time"] }
bytes = { workspace = true }
http = { workspace = true }
# Speaks HTTP/1.1 on the raw connection the core hands the listener the announced clone
# URL names, which is what makes that URL an address a stock git client dials
# (`src/state/git_endpoint.rs`). `hyper-util` carries the tokio IO and timer adapters
# for it, `http-body-util` the bounded body reader and the one-shot body.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
# Decodes the HTTP Basic credentials a git client presents, whose user name is the
# credential id the principal behind the request is resolved from.
base64 = "0.22"
serde_json = { workspace = true }
tracing = { workspace = true }
# Content-addressed ids: the git object encoding of a blob/tree/commit, and the
# repositoryId, are hashed with this (both crates are already workspace deps, so
# this adds nothing to Cargo.lock).
sha2 = { workspace = true }
hex = { workspace = true }
# Git object names are SHA-1 digests: that is what the git wire format the
# smart-HTTP transport speaks defines an object name to be (see
# `src/state/git_object.rs`), so a client's ids and the emulator's agree.
sha1 = "0.10"
# zlib, which is how a packfile carries each object's bytes (and how a git
# client may gzip a request body).
flate2 = "1"
# The three-way content merge behind a line-level mergeability answer: a common
# ancestor and two sides merged the way git merges them (see
# `src/state/merge.rs`).
diffy = "0.4"

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# Dials the announced clone URL in this process, exactly as a git client handed that
# URL does: tokio's socket and byte-stream halves carry the HTTP exchange on it.
tokio = { workspace = true, features = ["io-util", "net", "sync", "time"] }
# Mounted BESIDE this one in `tests/all/`: EventBridge and Amazon SQS, which carry the
# pull-request lifecycle events a rule delivers to its target. DEV-ONLY for the event
# path — `src/` reaches EventBridge through the SDK client above.
service-com-amazonaws-eventbridge-awsevents = { workspace = true }
service-com-amazonaws-sqs-amazonsqs = { workspace = true }

[lints]
workspace = true
