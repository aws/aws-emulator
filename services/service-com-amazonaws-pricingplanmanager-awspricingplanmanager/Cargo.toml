[package]
name = "service-com-amazonaws-pricingplanmanager-awspricingplanmanager"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Hashes the opaque id in a minted subscription ARN.
sha2 = { workspace = true }
# Hex-codes that digest and the opaque ListSubscriptions `nextToken`.
hex = { workspace = true }
# `date_time_json`: the workspace's ONE rendering of a `restJson1` timestamp whose model
# declares the `date-time` form, which every timestamp member of this model does. `arn`
# reads the resource ARNs a subscription names: which vendor and resource type each one
# addresses, and whether its Region field is a label an endpoint can be reached at.
service-common = { path = "../common" }
# `CreateSubscription` gates the resources its `resourceArns` names on the state the
# owning service holds for them; for a CloudFront distribution that is the web ACL
# association the `GetDistribution` this client generates reports, driven over the
# in-process callback.
aws-sdk-cloudfront = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
hex = { workspace = true }

[lints]
workspace = true
