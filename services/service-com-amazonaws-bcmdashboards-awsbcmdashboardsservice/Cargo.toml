[package]
name = "service-com-amazonaws-bcmdashboards-awsbcmdashboardsservice"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true, features = ["time"] }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Hex codec for the opaque `ListDashboards` pagination cursor.
hex = { workspace = true }
# The AWS SDK for EventBridge, driven over the in-process callback
# (`OperationContext::callback`): an execution of a scheduled report delivers one
# notification onto the account's default event bus, which is the delivery the model
# grounds the report's health in (`state::deliver_execution_notification`). Only the
# generated client is needed — the emulator supplies the transport, so the SDK's own
# HTTPS stack and runtime are left out.
aws-sdk-eventbridge = { version = "1", default-features = false }
# `Service::override_refusal`: the wording AWS states a boundary constraint refusal
# with on the JSON protocols, which every service on one shares.
service-common = { path = "../common" }
# Calendar arithmetic for the ceiling the model states on a schedule period's `endTime`
# ("3 years from the current time"): three years is a calendar offset, not a fixed
# number of seconds.
chrono = { version = "0.4", default-features = false, features = ["std"] }
# The IAM store a scheduled report's `scheduledReportExecutionRoleArn` is resolved against:
# the report executes AS that role, so whether the account's IAM still lets this service
# assume it, and still lets it do the execution's work under it, is half of the report's
# health (`state::execution_role`).
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
# Evaluates the modelled `@pattern` of this service's constrained strings, which are
# written with the negative look-ahead the `regex` crate behind `@pattern` cannot compile
# (`state::ConstrainedText`).
fancy-regex = "0.16"

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
# EventBridge is mounted beside this service on one engine in the integration tests,
# because an execution of a scheduled report delivers its notification onto the
# account's default event bus: with no EventBridge mounted there is nothing to deliver
# to. It claims only requests scoped to its own signing name (`events`), so no
# bcm-dashboards request is routed any differently for its presence.
service-com-amazonaws-eventbridge-awsevents = { workspace = true }

[lints]
workspace = true
