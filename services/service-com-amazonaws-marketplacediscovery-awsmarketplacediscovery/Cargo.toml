[package]
name = "service-com-amazonaws-marketplacediscovery-awsmarketplacediscovery"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
# The shared request-claim rule for a SigV4 signing name several services share, and
# `iam_authorization` — the shared evaluation of IAM policy documents against an action on
# a resource, so every service that enforces authorization decides alike. `iam_role` reads
# which IAM entity a principal ARN names.
service-common = { path = "../common" }
# The STS store, for the identity an access key id speaks for: the principal
# `sts:GetCallerIdentity` answers for the credentials a request signed with.
service-com-amazonaws-sts-awssecuritytokenservicev20110615 = { workspace = true }
# The IAM store, for the identity-based policy documents in force on that principal.
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Name-based (v5) identifiers, for the opaque `categoryId` the catalog issues per taxonomy
# category: the same identifier on every boot, derived from no display text.
uuid = { version = "1", features = ["v5"] }
# HTML escaping, for the stored catalog values written into the buyer-facing pages this
# service serves at the addresses a SaaS fulfillment option publishes.
html-escape = "0.2"
# Hex, for the authenticator every address this service publishes for a client to fetch
# carries: one path segment of the value this process minted over the record the address
# names (`state::media_address`).
hex = { workspace = true }
# AES-256-GCM, SHA-256 and the system randomness behind the sealed pagination cursor every
# `@paginated` read of this service hands out (`state::page_cursor`).
ring = "0.17"

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
automod = { workspace = true }
sha2 = { workspace = true }

[lints]
workspace = true
