[package]
name = "service-com-amazonaws-customerprofiles-customerprofiles-20200815"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
# `service/modelled_refusal` and `service/unreadable_values`: the tree's shared statements
# of a constraint-violation message, of a value a modelled member cannot be read from, and
# of the collecting walk the violations of one request come out of.
service-common = { path = "../common" }
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# `ProfileId` is minted as a v4 UUID's 32-hex simple form, which is exactly the
# `^[a-f0-9]{32}$` the model requires.
uuid = { version = "1", features = ["v4"] }
# `ProfileObjectUniqueKey` is a digest over the ingested object's identity, so the same
# object ingested twice is one record; `hex` renders that digest.
sha2 = { workspace = true }
hex = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# `time` for a test that waits out a clock-owed transition without blocking the runtime.
tokio = { workspace = true, features = ["time"] }

[lints]
workspace = true
