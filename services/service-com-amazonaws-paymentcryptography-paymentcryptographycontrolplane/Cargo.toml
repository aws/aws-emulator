[package]
name = "service-com-amazonaws-paymentcryptography-paymentcryptographycontrolplane"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
# The one claim rule for a service whose SigV4 signing name is shared with another
# emulated service (here the Payment Cryptography data plane), the AWS wording of a
# boundary constraint refusal, and the renaming of the member an error body carries its
# text in.
service-common = { path = "../common" }
# AWS Multi-Party Approval's approval-team registry: an `MpaTeamArn` names a team MPA's
# own `CreateApprovalTeam` mints and nothing else, so `AssociateMpaTeam` resolves the
# team in that store through the shared engine rather than keeping a second registry
# here.
service-com-amazonaws-mpa-awsfluffycoreservice = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# The key check value a key reports is computed from that key's own stored
# material by the algorithm `KeyCheckValueAlgorithm` names, so the primitives are
# the real ones rather than a hand-rolled imitation:
# AES and Triple DES encrypt the zero block for the `ANSI_X9_24` KCV,
aes = "0.8"
des = "0.8"
# AES-CMAC over the zero block for the `CMAC` KCV,
cmac = "0.7"
# HMAC over a zero-length message with the key's own SHA-2 hash for the `HMAC` KCV.
# 0.12 — not the 0.13 the SigV4 stack resolves — because it is the release built on
# `digest` 0.10, the generation `sha2` 0.10, `cmac` 0.7 and `aes` 0.8 above share: one
# `digest` version has to serve all of them.
hmac = "0.12"
sha2 = { workspace = true }
# and SHA-1 over the key material for the `SHA_1` KCV.
sha1 = "0.10"
# CBC, the mode an X9.143 (TR-31) key block encrypts its payload in, driven by the
# `aes` and `des` ciphers above rather than by a chaining loop written here. 0.1 —
# not 0.2 — because it is the release built on `cipher` 0.4, the generation `aes` 0.8
# and `des` 0.8 above share.
cbc = "0.1"
# Renders a KCV as hex, and the opaque `NextToken` the list operations hand out.
hex = { workspace = true }
# The RSA-2048 key pair a TR-34 export token's signing key certificate names, and the
# RSASSA-PKCS1-v1_5 signature over each certificate: real keys and real signatures.
aws-lc-rs = "1"
# The DER X.509 certificates `GetParametersForExport` hands out are encoded by this
# crate rather than by anything hand-rolled here; the `pem` feature is its own PEM
# framing for them.
x509-cert = { version = "0.2", features = ["pem"] }

[build-dependencies]
emulator-core-build-support = { workspace = true }

# No `[dev-dependencies]`: every crate above is a production dependency of the key
# check value computation in `src/state.rs`, and the integration tests reach that
# computation through this crate's own public helpers rather than through a primitive
# of their own.

[lints]
workspace = true
