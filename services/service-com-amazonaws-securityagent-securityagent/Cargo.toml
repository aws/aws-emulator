[package]
name = "service-com-amazonaws-securityagent-securityagent"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
# `uuid_from_random_bytes`: the one rendering of 16 opaque bytes as the hyphenated uuid
# that is the body of every prefixed identifier this service mints (an agent space's
# `as-<uuid>`, a pack's `srp-<uuid>`, a target domain's id), so the uuid layout is not
# spelled out a second time here.
service-common = { path = "../common" }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Opaque list pagination cursors (the resume-at record key: an applicationId, a packId
# or a private connection name) and target domain verification tokens, hex-encoded.
hex = { workspace = true }
# SHA-256 behind each target domain's verification token, over the account mint's own
# never-reused draw, and behind the identifiers of the account's network (the default
# VPC and its subnets a service-managed private connection's resource gateway is placed
# in), derived exactly as every other service that places a resource in a subnet
# derives them — see `services/common/src/network.rs`.
sha2 = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# `time` for the suites that wait out a span the service's own clock owes — a target
# domain's ownership check settles that long after the call that starts it.
tokio = { workspace = true, features = ["time"] }

[lints]
workspace = true
