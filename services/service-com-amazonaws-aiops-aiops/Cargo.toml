[package]
name = "service-com-amazonaws-aiops-aiops"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Encodes/decodes the opaque `nextToken` ListInvestigationGroups hands out.
hex = { workspace = true }
# `iam_role`: the shared reading of a caller-supplied IAM role ARN and of what this
# account's IAM answers about it, for the `roleArn` an investigation group runs as;
# `iam_client` under it is the in-process hop that asks IAM.
service-common = { path = "../common" }
# Asks this emulator's own KMS, over the in-process callback, whether the key an
# `encryptionConfiguration` names is one investigation data could be encrypted with.
aws-sdk-kms = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
hex = { workspace = true }
# The role-resolution suite mounts IAM beside this service on one engine and creates the
# roles it resolves through IAM's own wire, so the records read are the ones `CreateRole`
# wrote.
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
# The encryption-key suite mounts KMS beside this service on one engine and creates the
# keys it resolves through KMS's own wire, so the state read is the one `CreateKey` wrote.
service-com-amazonaws-kms-trentservice = { workspace = true }

[lints]
workspace = true
