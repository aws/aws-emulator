[package]
name = "service-com-amazonaws-firehose-firehose-20150804"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
# `time` beyond the workspace default: the tests await the clock-owed
# CREATING -> ACTIVE / DELETING -> removed spans with `tokio::time::sleep`.
tokio = { workspace = true, features = ["time"] }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# The AWS SDK for IAM, driven over the in-process callback
# (`OperationContext::callback`): `CreateDeliveryStream`/`UpdateDestination` resolve every
# `RoleARN` a configuration names with `GetRole` before the stream is written. Only the
# generated client is needed — the emulator supplies the transport.
aws-sdk-iam = { version = "1", default-features = false }
# The AWS SDK for Amazon S3, driven over the same in-process callback: a destination's
# `BucketARN` is resolved with `HeadBucket` before `UpdateDestination` rewrites a stream's
# destination. Only the generated client is needed — the emulator supplies the transport.
aws-sdk-s3 = { version = "1", default-features = false }
# The AWS SDK for KMS, driven over the same in-process callback: the `KeyARN` an encrypted
# stream names is resolved with `DescribeKey` before the stream is reported as encrypted
# under it.
aws-sdk-kms = { version = "1", default-features = false }
# `iam_trust_policy`: the one reading of an IAM trust policy, shared with every other
# service that resolves a caller-supplied role.
service-common = { path = "../common" }
# The destination of a Firehose stream is an Amazon S3 location, and the one object store
# in this emulator is the Amazon S3 service's: a delivered object is written there.
service-com-amazonaws-s3-amazons3 = { workspace = true }
# A `KinesisStreamAsSource` stream is fed by a Kinesis data stream, and the one register of
# such streams, their shards and their records in this emulator is that service's: the
# records a producer put there are read back from it and buffered for the destination.
service-com-amazonaws-kinesis-kinesis-20131202 = { workspace = true }
# A destination whose `CloudWatchLoggingOptions` are enabled reports each delivery it did not
# take as a log event, and the one register of log groups, streams and events in this emulator
# is that service's: the event is written there and read back with `GetLogEvents`.
service-com-amazonaws-cloudwatchlogs-logs-20140328 = { workspace = true }
# An `Elasticsearch` / `Amazonopensearchservice` destination indexes each delivered record
# into an index of an Amazon OpenSearch Service domain, and the one such domain store in
# this emulator is that service's: a delivered document is written there.
service-com-amazonaws-opensearch-amazonopensearchservice = { workspace = true }
# A destination whose `DataFormatConversionConfiguration` is in force converts its records
# against the column information of the Glue table its `SchemaConfiguration` binds, and the
# one Data Catalog in this emulator is that service's: the columns are read from there.
service-com-amazonaws-glue-awsglue = { workspace = true }
# The Apache implementation of the Parquet format, which writes the object a destination
# with a `ParquetSerDe` serializer delivers. Pure Rust, like the codecs below: `snap` is the
# serializer's default `SNAPPY` compression and `flate2` its `GZIP` one.
parquet = { version = "60", default-features = false, features = [
    "snap",
    "flate2-rust_backend",
] }
# The UTC calendar fields the `IndexRotationPeriod` suffix of a destination index carries —
# including the ISO week a `OneWeek` rotation names — read from a maintained date library
# rather than computed here.
chrono = { version = "0.4", default-features = false, features = ["std"] }
# The IANA time-zone database behind a destination's `CustomTimeZone`: the offset that zone
# was keeping at a delivery's instant, which decides the digits the delivered prefix and
# object name carry.
chrono-tz = { version = "0.10", default-features = false, features = ["std"] }
# The `GZIP` compression format a destination can ask for.
flate2 = "1"
# The `ZIP` compression format a destination can ask for.
zip = { version = "9", default-features = false, features = ["deflate"] }
# The `Snappy` / `HADOOP_SNAPPY` compression formats a destination can ask for.
snap = "1"
# The `ZSTD` compression format a destination can ask for. Pure Rust, like the other
# codecs above: the emulator links no native compression library.
ruzstd = "0.9"
# The random component of a delivered object's name, which Firehose mints per object.
uuid = { version = "1", features = ["v4"] }
# The jq program a `MetadataExtraction` processor carries
# (`MetadataExtractionQuery`, with `JsonParsingEngine` `JQ-1.6`) is run by a maintained
# jq implementation rather than read by hand. It is an EXECUTION SUBSTRATE: it evaluates a
# program taken from a request, so `src/state/delivery.rs` builds it default-deny — jq's
# core constructs over the one record handed to it and NO library function at all, so the
# engine holds no environment, file, input, import or unbounded-generator native to call —
# and bounds every run's steps, memory, depth and output there.
jaq-core = "2"
# `serde_json`: the record a `MetadataExtraction` query reads is JSON, so the jq value is
# converted to and from the JSON value the rest of this crate parses it as.
jaq-json = { version = "1", features = ["serde_json"] }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# The IAM store the delivery suite's roles are created in: a delivery is made under the
# destination's role, and whether that role's permissions allow the write is IAM's answer, so
# the suite that drives it mounts IAM beside Firehose on the same engine.
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
# The generator behind the property-based not-found suite: delivery-stream names are
# DRAWN from the modelled name class rather than hand-picked. Test-only, seeded, and
# nothing of it reaches `src/`.
rand = "0.9"
sha2 = { workspace = true }
hex = { workspace = true }
# The CMK an encrypted stream names is resolved against the KMS service, so the suite that
# asserts that gate mounts KMS beside Firehose on the same engine and creates a real key.
service-com-amazonaws-kms-trentservice = { workspace = true }
# The destination reads of the delivery suite go through Amazon S3's own restXml wire, so
# its listings are read with the same XML reader that service's tests use.
quick-xml = "0.41"
# The HTTP endpoint a destination delivers to is served by another service of this emulator,
# and a Lambda function URL is one such endpoint: the suite that drives an endpoint
# destination end to end mounts Lambda beside Firehose on the same engine, so the POST this
# crate renders is answered by a handler that RUNS.
service-com-amazonaws-lambda-awsgirapiservice = { workspace = true }

[lints]
workspace = true
