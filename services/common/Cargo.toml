[package]
name = "service-common"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
# `iam_client`: the in-process IAM client a service resolving a caller-supplied IAM
# entity asks, built once here instead of per service.
aws-sdk-iam = { version = "1", default-features = false }
# `eventbridge_client`: the in-process EventBridge client a service publishing an event
# drives — the management-event fan-out (`api_call_events`) among them — built once here
# for every service that publishes. Only the generated client is needed: the emulator
# supplies the transport, so the SDK's own HTTPS stack is left out.
aws-sdk-eventbridge = { version = "1", default-features = false }
# `api_call_events`: a publication that could not be made is traced rather than failing the
# call it belongs to, so that path needs the workspace's logging facade.
tracing = { workspace = true }
# `api_gateway_access_logs`: the in-process CloudWatch Logs client an API Gateway stage
# writes its access-log records through, built once here for both API Gateway planes. Only
# the generated client is needed: the emulator supplies the transport, so the SDK's own
# HTTPS stack is left out.
aws-sdk-cloudwatchlogs = { version = "1", default-features = false }
# `s3_client`: the in-process Amazon S3 client a service DELIVERING an object into a bucket
# a client named writes through — a logging trail's log files (`trail_log_files`) among
# them — built once here for every service that writes one. Only the generated client is
# needed: the emulator supplies the transport, so the SDK's own HTTPS stack is left out.
aws-sdk-s3 = { version = "1", default-features = false }
# `sns_client`: the in-process Amazon SNS client a service PUBLISHING a notification to a
# topic a client named drives — the terminal status of an asynchronous task among them —
# built once here for every service that publishes. Only the generated client is needed: the
# emulator supplies the transport, so the SDK's own HTTPS stack is left out.
aws-sdk-sns = { version = "1", default-features = false }
# `organizations_client`: the in-process AWS Organizations client a service ACTING on an
# organization drives — attaching the service control policy a budget action's definition
# names to each of its targets among them — built once here for every such service. Only the
# generated client is needed: the emulator supplies the transport, so the SDK's own HTTPS
# stack is left out.
aws-sdk-organizations = { version = "1", default-features = false }
# `ssm_client`: the in-process AWS Systems Manager client a service RUNNING a document or
# resolving a parameter on a client's behalf drives, built once here for the same reason and
# with the same features left out.
aws-sdk-ssm = { version = "1", default-features = false }
# `trail_log_files`: a CloudTrail log file IS a gzip stream, so it is written with the
# maintained DEFLATE implementation this workspace already compresses with rather than by
# laying out the framing here.
flate2 = "1"
# `trail_log_files`: the UTC calendar fields a log file's key is laid out by (the year,
# month and day of its prefix and the minute in its name), from the maintained calendar
# crate rather than by slicing a rendered timestamp.
chrono = { version = "0.4", default-features = false, features = ["std"] }
# `xray_segments`: the in-process X-Ray client a service REPORTS its own segments through —
# the API Gateway stage that served a traced request, the Lambda invocation it reached — built
# once here for every producer. Only the generated client is needed: the emulator supplies the
# transport, so the SDK's own HTTPS stack is left out.
aws-sdk-xray = { version = "1", default-features = false }
# `kinesis_client`: the in-process Kinesis client a service DELIVERING a data record
# writes through, built once here for the same reason. Only the generated client is
# needed — the emulator supplies the transport, so the SDK's own HTTPS stack and runtime
# are left out and the client can reach nothing off this process.
aws-sdk-kinesis = { version = "1", default-features = false }
# `sqs_client`: the in-process Amazon SQS client a service DELIVERING a message sends through,
# built once here for the same reason and with the same features left out, so it too can reach
# nothing off this process.
aws-sdk-sqs = { version = "1", default-features = false }
# `firehose_client`: the in-process Amazon Data Firehose client a service REACHING a delivery
# stream a client named drives — resolving whether that stream exists before a destination
# naming it is stored among them — built once here for every such service, with the same
# features left out for the same reason.
aws-sdk-firehose = { version = "1", default-features = false }
# `dynamodb_stream_event`: the record TYPE a DynamoDB stream's data plane answers, which
# the envelope rendered there is built from — taken from the SDK rather than re-declared,
# for the same reason and with the same features left out.
aws-sdk-dynamodbstreams = { version = "1", default-features = false }
# `kms_key`: the in-process AWS KMS client a service RESOLVING a caller-supplied key
# identifier asks `DescribeKey` through — whether this account and Region hold a key that
# identifier names — built once here for every such service, with the same features left
# out for the same reason.
aws-sdk-kms = { version = "1", default-features = false }
# `resolve_route_key` / `ROOT_PATH_SEGMENT`: the framework's own routing-key rule,
# which this crate narrows rather than replaces.
emulator-server = { workspace = true }
# `published_data_planes`: the SHARED ENGINE the records of which service answers at an
# address this emulator published live in, as every store two services hand off through
# does — the state handle, and nothing else of the engine. `clock`: the emulator's own
# CLOCK is one of those stores, so a service reads the clock of the emulator it is serving
# rather than one per crate.
engine = { workspace = true }
http = { workspace = true }
# `front_door`: the operation wrapper, the schema it reads a member's HTTP binding
# off, the constraint walk it runs and the request/response types it serves.
# `event_stream` is driven through the same traits.
# `validation`: the same `Schema` / `ShapeSerializer` seam, used to re-walk a built
# input, and the `Violation` / constraint-path vocabulary the framework's own
# constraint walk reports in. `shared_path`: `percent_decode`, which it reads a
# percent-encoded URI path label through. `claims_modeled_route`:
# `ErasedServiceDefinition`, which it asks whether a service's own generated route table
# binds a route for the request, and the empty `SdkBody` the request it hands that
# service's protocol carries.
smithy-server-runtime = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
# `validation`: the leaf types a `ShapeSerializer` is handed.
# `addresses_modeled_route`: the empty body the request it asks a service's own protocol
# to route is built with (that routing key reads the method, URI and headers only).
aws-smithy-types = { workspace = true }
# `stable_hex_id`'s mixing function: a maintained digest, so a derived id that travels on
# the wire is reproducible across builds rather than tied to the algorithm `std`'s default
# hasher happens to use. `posix_shell_text_filters`: the digest the `sha256sum`/`sha512sum`
# utilities of a shell session answer with.
sha2 = { workspace = true }
# ... and the lowercase hexadecimal those utilities write that digest as, from the maintained
# encoder this workspace already encodes one with rather than a loop here.
hex = { workspace = true }
# `iam_trust_policy`: an IAM trust policy IS a JSON document, so it is read with a
# maintained JSON parser rather than by hand.
serde_json = { workspace = true }
# `catalog_table_rows`: the objects under a Data Catalog table's location are DELIMITED
# TEXT, so the records and fields a read decodes out of them are read by the maintained
# reader for that format rather than by a splitter written here — the separator, the
# quoting and the line terminators come from the table's own SerDe.
csv = "1.4"
# `graph_bulk_load`: the RDF bulk-load syntaxes a Neptune load's statements are written in
# (N-Triples, N-Quads and Turtle) are parsed by the maintained crate for them, and the
# terms a statement carries (IRIs, blank nodes and typed literals) are read through its
# term model, so the two services that load a graph read a statement the same way.
oxttl = "0.2.5"
oxrdf = "0.3.5"
# `submitted_collections`: reads the ORDER a request's JSON object wrote a map member's
# entries in, which the built input (a `HashMap`) does not keep. Only the deserializer
# seam is used; no shape here derives `Serialize`.
serde = { workspace = true }
# `query_error_envelope`: the v4 UUID an awsQuery error envelope reports as its
# `<RequestId>`, from the maintained crate the framework's own request-id minter and the
# service-local copies of that writer use, rather than derived here.
# `management_events`: the `eventID` / `requestID` a recorded event carries are version-4
# UUIDs, minted by the same maintained crate rather than by laying the form out here.
uuid = { version = "1", features = ["v4"] }
# `in_band_tls`: the async read/write traits a data-plane connection is read through
# (`io-util`'s `AsyncReadExt` for the one sniffed byte, and the `AsyncRead`/`AsyncWrite`
# the replaying stream implements), for a plane whose encryption is negotiated in band.
# `sql_wire_planes`: the same traits each wire reads and writes its own protocol through,
# the blocking pool every statement of a SQL-wire session runs on (`rt`, from the
# workspace's own feature set), and the clock its own cases wait on.
# `iot_mqtt_broker`: `sync` carries the per-connection channel the broker hands a live
# client's session its deliveries over, and the notification that closes one.
tokio = { workspace = true, features = ["io-util", "rt", "sync", "time"] }
# `iot_mqtt_broker`: the MQTT packet codec the broker reads a client's CONNECT,
# SUBSCRIBE and PUBLISH with and writes its own CONNACK, SUBACK, PUBLISH and PINGRESP
# with — the maintained serializer of the protocol, so the wire a stock MQTT client
# speaks is read by that codec rather than by a framing reader written here. A codec
# over bytes: it opens no socket (the core owns it) and reaches nothing off this process.
# `v5` carries the MQTT 5 half of it — the version's own reason codes and a publication's
# message properties — which is the second of the two versions the broker serves.
mqttbytes = { version = "0.6", features = ["v5"] }
# `iot_mqtt_broker`: the published broker address serves the IoT HTTPS data plane as well
# as MQTT — one address, both wires, as the host AWS publishes for an account's data
# endpoint does — so that socket speaks HTTP/1.1 with the same server its sibling planes
# are served by. `hyper-util` carries the tokio IO and timer adapters for it, and
# `http-body-util` the bounded body reader and the whole-body answer.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
# `sql_wire_planes`: the SQL engine a database endpoint's statements run against, in memory
# and per resource — the `bundled` SQLite already in this workspace, at the version and
# feature set the Amazon RDS engine endpoint builds (`vendor/emulator-telemetry` and the
# Athena, Redshift Data and RDS Data services build the same one). `column_decltype`
# carries the declared type of a column, which is what each wire maps to its own type code;
# `limits` installs the per-connection bounds on a statement, a value and a row;
# `functions` registers the server functions a statement may call (`version()`,
# `database()`); `hooks` carries the default-deny authorizer that confines a client's SQL to
# its own database and the progress handler that bounds one statement's run. An in-process
# library over data: it opens no listener (the core owns the socket), writes no host file
# (every database is opened in memory, with its temp store in memory too) and spawns
# nothing.
rusqlite = { version = "0.41", features = [
    "bundled",
    "column_decltype",
    "functions",
    "hooks",
    "limits",
] }
# `sqlparser`: `sql_wire_planes::dialect` reads a statement as the TOKENS of the wire's own
# SQL dialect — which is how a keyword that is part of a string literal, a quoted
# identifier, a dollar-quoted body or a comment stays part of it — rather than by a scan of
# its own. The same maintained parser every other service in this workspace reads SQL with,
# at the version they already lock.
sqlparser = "0.59"
# `sql_wire_planes`: `sha1` is the digest the MySQL `mysql_native_password` handshake is
# defined in terms of, and the only form a native-password login can be verified against.
sha1 = "0.10"
# ... and `getrandom` draws the per-connection nonce that handshake challenges a client
# with from the operating system's own entropy, so the proof the client answers with cannot
# be replayed.
getrandom = "0.3"
# `iam_authorization`: the reading of an IP address or a range in CIDR notation that the
# IAM `IpAddress`/`NotIpAddress` condition operators compare an address against, taken from
# the maintained crate rather than by splitting the notation by hand.
ipnet = "2"
# `iso8601_span`: the ISO 8601 duration grammar, parsed by the maintained crate rather
# than by hand, for every service handed a span as a caller-supplied string.
iso8601-duration = "0.2"
# `json_reference_path`: the maintained RFC 9535 JSONPath engine, which EVALUATES the
# reference path that module accepts — so a caller-supplied path is not interpreted here.
# The module bounds the path's length, its segment count and its selectors before the
# engine is handed anything, and hands it the module's own canonical rendering.
serde_json_path = "0.7"
# `jwt`: the JOSE primitives every service handed a JWS needs — the signature check
# against the key a token's issuer published or an ACME client embedded (ECDSA, RSASSA
# PKCS1-v1_5 and Ed25519, RFC 7518 section 3.1), the HMAC of RFC 7518 section 3.2, and the
# digest the RFC 7638 thumbprint of a public key is. An in-process COMPUTATION over data:
# it opens no listener, spawns nothing and reads nothing off the host. It is the
# cryptography library this workspace already signs those tokens with (the user-pool
# service), so it is already in this workspace's build and lockfile and no capability class
# arrives with this declaration — and no second implementation of the primitive is written.
# Not a pure-Rust elliptic-curve stack, whose `crypto-bigint` this repository's dependency
# audit blocks (RUSTSEC-2026-0387).
ring = "0.17"
# `jws_signing`: the SIGNING half of the JOSE primitives above — the RSA and P-384 key
# pairs an emulated OIDC issuer signs its tokens with, and those signatures. `ring` cannot
# GENERATE an RSA key pair, so the generation and the signature come from the other
# cryptography library this workspace already builds (the user-pool, KMS and private-CA
# services among its users), which is why no capability class arrives with this
# declaration. Not the pure-Rust `rsa` crate, whose two timing advisories this
# repository's dependency audit blocks.
aws-lc-rs = "1"
# ... and the PKCS#8 / PKCS#1 structures that library encodes a generated RSA key pair as,
# which the PUBLIC modulus and exponent a JWK publishes are read out of (RFC 5958 §2),
# rather than keeping a second copy of them beside the key.
pkcs8 = { version = "0.10", features = ["std"] }
pkcs1 = { version = "0.7", features = ["pkcs8"] }
# `in_process_sigv4`: the SigV4 signer a service signs an in-process call to another
# emulated service with — the SDK's own signer, which is what the emulator's verifier
# re-signs with, rather than a second implementation of the signature.
aws-sigv4 = { workspace = true }
# The signing identity `aws-sigv4` takes, built from the credential the framework hands
# every handler.
aws-credential-types = { workspace = true }
# `jsonata`: the JSONata interpreter the services whose API carries a caller-written
# JSONata expression evaluate it with — the Amazon States Language's JSONata mode
# today, and the B2BI mapping template once its own containment of the same engine
# moves here — so the engine is reached through one bounded seam rather than per
# service. An execution substrate, which is why that module states and enforces the
# ceilings that confine it; `default-features = false`, since nothing it turns on by
# default is needed. Pinned EXACTLY: the parse shapes the module reads a refused
# construct off are this version's.
jsonata-rs = { version = "=0.3.4", default-features = false }
# `injected_api_faults`: the per-call draw that decides whether a call falls in the share a
# fault-injection action affects, taken from the maintained generator rather than from a
# counter kept across calls.
rand = "0.9"
# The arena `jsonata-rs` allocates its parsed expression and its values into: one per
# evaluation, dropped with it. Pinned EXACTLY for the same reason — the memory ceiling of
# an evaluation is enforced through this crate's allocation limit.
bumpalo = "=3.20.3"
# `feature_store_offline_store`: the caller-supplied Amazon S3 URI a feature group's offline
# store is configured with is read by the maintained URL parser rather than split by hand.
# At least 2.5.9: that release is where `Url::origin()` stops recursing through a nested
# `blob:` URL, which an earlier release overflowed the stack on.
url = "2.5.9"
# `posix_shell_session`: the POSIX/bash TOKENIZER AND GRAMMAR every service that performs
# caller-supplied shell text reads it with. The PARSER only: it is a library that computes
# over data in process — it builds a syntax tree and runs nothing, opens nothing and reaches
# nothing — so what PERFORMS a program is that module's own session, whose catalog of
# session-local utilities (output, status, variables), bounds and fail-closed default are
# stated there. Its EXECUTING half, `brush-core`, is deliberately NOT taken: an engine
# resolves a command against the host's `PATH`, starts a host process for it and opens the
# host files a redirection names, with no seam to confine any of that, so taking it would
# hand a caller's program the host. It compiles no C and the tree it locks carries no
# advisory (it is already in this workspace's lock file, for the Amazon ECS crate, whose own
# copy of that session is to be migrated onto this module); its `peg` dependency is a
# procedural macro, so that part of it runs on the BUILDER's machine at build time, as every
# macro in this workspace does.
brush-parser = { version = "0.4", default-features = false }
# ... and the path of that URI spells an Amazon S3 key, so its percent-escaping is resolved
# by the maintained encoder the URL parser itself uses.
percent-encoding = "2"
# `posix_shell_text_filters`: the Base64 encoder and decoder the `base64` utility of a shell
# session computes with, from the maintained codec this workspace already encodes with rather
# than a second implementation of the alphabet here.
base64 = "0.22"
# `acm_certificate_termination`: the TLS server a service terminating a connection under a
# Certificate Manager certificate answers a handshake with — one statement of the
# certificate selection and the key loading for every presenting service. The TLS
# implementation this workspace already terminates every handshake with, at the workspace's
# own version, so no second one arrives with this declaration.
rustls = { workspace = true }
# ... and the reader that turns the PEM material a certificate was imported as into the DER
# that handshake sends: the maintained PEM reader this tree already reads certificate
# material with, rather than a hand-written framing reader.
rustls-pemfile = "2"
# `h264_mp4`: the MP4 file an H.264 byte stream is written into, and the track a
# stored file's samples are read out of — through the maintained ISO base media
# implementation this workspace already reads and writes those containers with,
# rather than a second laying-out of the boxes.
mp4 = "0.14"
# ... and the buffer type that writer takes one sample's bytes as.
bytes = { workspace = true }
# `schedule_expression`: the cron grammar a caller-supplied `cron(…)` schedule is read with,
# from the maintained parser this workspace already reads cron expressions with rather than a
# grammar written here.
cron = "0.15"
# `posix_shell_text_filters`: the regular expressions the `grep` utility of a shell session
# MATCHES with, from the maintained engine this workspace already matches caller-supplied
# patterns with (its linear-time matcher, so a pattern a caller wrote cannot cost the host
# more than the input it is run over) rather than a matcher written here.
# `unapplied_patterns`: the same engine the framework's boundary validator compiles a
# `@pattern` with, asked whether it compiles one at all.
regex = "1.13"
# `pattern_syntax_fault`: the PARSER behind that crate, whose structured syntax error is what
# places and names the fault in a caller's own regular expression — so a refusal relays that
# statement rather than one engine's rendered diagnostic.
regex-syntax = "0.8"
# `unapplied_patterns`: applies a modelled `@pattern` the engine above cannot compile — one
# carrying look-around, which that engine treats as satisfied. Bounded range (0.16.x), and
# every match runs under an explicit backtrack budget (`PATTERN_BACKTRACK_LIMIT`), so a
# backtracking engine cannot spin on a caller's value.
fancy-regex = "0.16"
# `code_signing_signature`: a signed code package IS a .zip archive carrying the signature
# envelope as one added entry, so the entries a signature covers are read by the maintained
# zip implementation this workspace already reads and writes those archives with. Read with
# `deflate` alone — no other compression method is linked in — and never extracted to a host
# path.
zip = { version = "9", default-features = false, features = ["deflate"] }
# `xml_document`: the maintained XML pull parser the ONE reading of an XML document a
# service was handed by another service's wire is built on — so the format itself is read
# by that parser rather than by a reader written per service. The same version every other
# crate in this workspace reads and writes XML with.
quick-xml = "0.41"
# `record_identicon`: the PNG encoder the image a service serves for a record whose own image
# bytes it does not hold is written with — the maintained codec this workspace already encodes
# PNGs with, so the one renderer every such service shares writes a real image rather than
# hand-assembled bytes.
png = "0.18"
# `aws_cloudwatch_cli`: the in-process Amazon CloudWatch client a service PUBLISHING metric
# data on another principal's behalf drives — a container's own program publishing as the task
# role among them — built once here for every such service. Only the generated client is
# needed: the emulator supplies the transport, so the SDK's own HTTPS stack is left out.
aws-sdk-cloudwatch = { version = "1", default-features = false }
# `event_stream`: the `vnd.amazon.eventstream` ENCODER one frame is written with, for an
# event whose payload is already encoded (an `@eventPayload` blob, or a stream a model
# declares as a streaming blob rather than as a union of event structures) — the maintained
# encoder of that framing, the same one the framework's own protocols write a
# protocol-serialized event frame with, rather than a second laying-out of the prelude, the
# headers and their CRCs here.
aws-smithy-eventstream = "0.60"
# `cbor_error_detail_member`: the CBOR implementation the framework's own `rpcv2Cbor` codec is
# built on, which reads an ALREADY ANSWERED error map back whatever members it carries and
# writes the renamed one again. At the version that vendored codec uses, so no second CBOR
# implementation enters this workspace.
aws-smithy-cbor = "0.62.2"

[dev-dependencies]
# `acm_certificate_termination`'s own cases load REAL certificate material, minted by the
# maintained generator the sibling services mint certificate material with — something
# other than the code under test. DEV-ONLY.
rcgen = "0.13"

[lints]
workspace = true
