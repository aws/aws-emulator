[package]
name = "service-com-amazonaws-resourcegroups-ardi"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# `service-common` carries the workspace's ONE AWS wording of a constraint-violation
# refusal and the ONE renaming of the member a JSON error body reports its text in, so
# this service states only which of its shapes and which constraint classes they apply to.
service-common = { path = "../common" }
# ULIDs: the 26-character lowercase ids this service's modelled ARNs qualify a
# group's name and a tag-sync task with.
ulid = "1"
# The modelled tag pattern is a character class over Unicode general categories,
# which this crate matches with the same regex engine the request boundary
# compiles a modelled pattern with rather than re-deciding the categories itself.
regex = "1.13"

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
hex = { workspace = true }

[lints]
workspace = true
