[package]
name = "service-com-amazonaws-kinesis-kinesis-20131202"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Encodes the opaque pagination token a truncated shard listing hands back.
hex = { workspace = true }
# The hash that places a data record in a shard: "an MD5 hash function is used to map
# partition keys to 128-bit integer values and to map associated data records to shards"
# (`PutRecordInput$PartitionKey`).
md-5 = "0.10"
# Folds a channel's region, name and creation instant into the short opaque `ChannelId` a
# read reports (`crate::state::channel_id`).
sha2 = { workspace = true }
# Resolves the `KeyId` a `StartStreamEncryption` request names against KMS, over the
# emulator's own in-process transport, before the stream is reported as encrypted under it.
aws-sdk-kms = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
# The one place this tree states the Region LABEL grammar, for the caller-supplied region
# that ends up in the authority of the KMS endpoint the lookup above is routed on.
service-common = { path = "../common" }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
# The encryption suites mount the KMS service beside Kinesis on one engine, because
# `StartStreamEncryption` resolves the `KeyId` it is given by calling it.
service-com-amazonaws-kms-trentservice = { workspace = true }
# The channel-key suite mounts IAM beside them too: a channel's create asks IAM whether its
# service execution role may use that key.
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }

[lints]
workspace = true
