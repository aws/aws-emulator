[package]
name = "service-com-amazonaws-comprehendmedical-comprehendmedical-20181030"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Opaque `NextToken` page tokens are hex-encoded resume keys.
hex = { workspace = true }
# `iam_role::role_is_unassumable`: the ONE reading of a caller-supplied role ARN against
# the account's IAM records, which every `Start*Job` operation resolves `DataAccessRoleArn`
# through before it records a job.
service-common = { path = "../common" }
# The Amazon S3 client an asynchronous job's run reads its input documents with and
# writes its analysed output back through, over the in-process callback into this same
# emulator (no network client feature is enabled: the transport is the emulator's own).
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
# The digest of a start call's parameters, which is what tells a REPEAT of one submission
# (the same `ClientRequestToken` with the same request) from another submission that
# reuses its token.
sha2 = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# The AWS SDK for IAM, used by the test harness to CREATE the roles a job's
# `DataAccessRoleArn` names, over the same in-process callback the handler resolves them
# through.
aws-sdk-iam = { version = "1", default-features = false }
# The owner of the roles this service RESOLVES, mounted beside it in the test harness: IAM
# holds the account's roles, so the resolution can only be driven end to end with it on the
# same engine. DEV-ONLY: this crate depends on no other service's crate outside its tests.
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
# The owner of the documents an asynchronous job reads and the output it writes, mounted
# beside this service in the batch-run suite: a job's run calls object storage in process,
# so a run can only be driven end to end with it on the same engine. DEV-ONLY, as above.
service-com-amazonaws-s3-amazons3 = { workspace = true }

[lints]
workspace = true
