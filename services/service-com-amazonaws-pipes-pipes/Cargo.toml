[package]
name = "service-com-amazonaws-pipes-pipes"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true, features = ["time"] }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Hex codec for the opaque `NextToken` ListPipes issues and reads back.
hex = { workspace = true }
# `arn`: the ONE parse of a resource ARN, shared with every other service — a pipe's
# Source, Enrichment and Target are read through it rather than split here. Also
# `front_door::binds_to_body` and `validation::refusing_violations_with_echoes`: where a
# refused member travels (body vs URI), and the violations of one request with each value
# echo restored to the bytes the caller submitted.
service-common = { path = "../common" }
# The AWS SDK clients the data plane (`state::data_plane`) reaches the other services of
# THIS emulator through, over the in-process callback (`OperationContext::callback`): the
# source and target queues (`ReceiveMessage`/`DeleteMessage`/`SendMessage`) and the two
# enrichment resources a pipe may name — a Lambda function (`Invoke`) and a Step
# Functions Express workflow (`StartSyncExecution`). Only the generated clients are
# needed: the emulator supplies the transport, so the SDK's own HTTPS stack is left out.
aws-sdk-sqs = { version = "1", default-features = false }
# The EventBridge surface a pipe whose target is an event bus delivers through: `PutEvents`
# with the configured `EventBridgeEventBusParameters` and the record as the event detail.
aws-sdk-eventbridge = { version = "1", default-features = false }
aws-sdk-lambda = { version = "1", default-features = false }
aws-sdk-sfn = { version = "1", default-features = false }
# The DynamoDB Streams surface a stream-sourced pipe reads its records through:
# `DescribeStream` for the stream's shards, `GetShardIterator` for the position
# `StartingPosition` names, and `GetRecords` for the changes themselves.
aws-sdk-dynamodbstreams = { version = "1", default-features = false }
# The Kinesis Data Streams surface a Kinesis-sourced pipe reads its records through:
# `ListShards` for the stream's shards, `GetShardIterator` for the position
# `StartingPosition` names, `GetRecords` for the records themselves, and
# `DescribeStreamSummary` for whether the stream a pipe names is there at all.
aws-sdk-kinesis = { version = "1", default-features = false }
# A binary message attribute travels as base64 in a record envelope.
base64 = "0.22"
# The CloudWatch store a RUNNING pipe publishes its own metrics to (the
# `AWS/EventBridge/Pipes` namespace, `state::metrics`). CloudWatch refuses a
# `PutMetricData` into a reserved `AWS/` namespace, so a service's own metrics never
# travel over that API; this writes the very store `ListMetrics`/`GetMetricStatistics`
# read.
service-com-amazonaws-cloudwatch-graniteserviceversion20100801 = { workspace = true }
# The IAM store a pipe's `RoleArn` is resolved against, to decide whether this service may
# act as that role and make the call each stage makes under it (`state::execution_role`).
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
hex = { workspace = true }
# `time` on top of the workspace features: the lifecycle test waits out the state-settle
# span with `tokio::time::sleep` rather than parking the test runtime's worker thread.
tokio = { workspace = true, features = ["time"] }
# The services a pipe's source, enrichment and target live in are mounted beside pipes on
# one engine in the data-plane tests, because a delivery is asserted where a client sees
# it: on the target queue, with the source queue drained and the enrichment run.
service-com-amazonaws-sqs-amazonsqs = { workspace = true }
service-com-amazonaws-sfn-awsstepfunctions = { workspace = true }
# A pipe whose target is a Lambda function is asserted against the function's own run, so
# Lambda is mounted beside pipes in that suite and the handler's deployment package — a
# .zip archive the suite writes in memory — is uploaded the way a caller uploads one.
service-com-amazonaws-lambda-awsgirapiservice = { workspace = true }
zip = { version = "9", default-features = false, features = ["deflate"] }
# A DynamoDB-stream-sourced pipe reads the very records DynamoDB's own writes publish, so
# the table service and the streams service are mounted beside pipes in that suite: the
# changes are applied with `PutItem`/`DeleteItem` and the pipe reads them off the stream.
service-com-amazonaws-dynamodb-dynamodb-20120810 = { workspace = true }
service-com-amazonaws-dynamodbstreams-dynamodbstreams-20120810 = { workspace = true }
# A Kinesis-sourced pipe reads the very records `PutRecord`/`PutRecords` wrote, so the
# Kinesis service is mounted beside pipes in that suite and the records are put the way a
# client puts them.
service-com-amazonaws-kinesis-kinesis-20131202 = { workspace = true }
# A pipe whose target is an EventBridge event bus is asserted where a client sees the
# publication: on the sink queue a rule on that bus forwards to, so EventBridge is mounted
# beside pipes in that suite and the bus, its rule and its target are created the way a
# client creates them.
service-com-amazonaws-eventbridge-awsevents = { workspace = true }
# The role a pipe's stages act as lives in IAM, and the metrics a running pipe publishes
# about its executions are read back through CloudWatch, so both are mounted beside pipes
# on one engine in the metrics suite.
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
service-com-amazonaws-cloudwatch-graniteserviceversion20100801 = { workspace = true }

[lints]
workspace = true
