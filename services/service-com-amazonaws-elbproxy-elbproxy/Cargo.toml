[package]
name = "service-com-amazonaws-elbproxy-elbproxy"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
# The shared request-claim rule for a SigV4 signing name several services share.
service-common = { path = "../common" }
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
automod = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
# The Classic Elastic Load Balancing service, which owns the `elasticloadbalancing`
# routing key this model's identity publishes too: `tests/all/shared_signing_name_routing.rs`
# mounts it beside this service, because "no OTHER service claims this request" can only be
# asked with both mounted. TEST-ONLY.
service-com-amazonaws-elasticloadbalancing-elasticloadbalancing-v7 = { workspace = true }

[lints]
workspace = true
