[package]
name = "service-com-amazonaws-neptune-amazonrdsv19"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# `data_plane_addressing`: the tree's one reading of which host is the emulator's own, so
# the address a cluster announces is one this process answers on. `graph_db_clusters`: the
# shared directory this control plane records a provisioned cluster's engine and feature
# configuration in, which the Neptune data plane answers its engine status from.
service-common = { path = "../common" }
# SHA-256, used to mint the opaque resource ids and DNS labels the API reports
# (DbClusterResourceId, DbiResourceId, endpoint shard labels) deterministically.
sha2 = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# Declares one module per `tests/all/<name>.rs`, so the single integration-test target at
# `tests/all/main.rs` picks a suite up by its file existing.
automod = { workspace = true }
# `time` is enabled here (and only for tests) so a suite can await the clock-owed
# `creating` -> `available` transition without blocking the runtime worker.
tokio = { workspace = true, features = ["time"] }
hex = { workspace = true }
# Reads the awsQuery XML responses the integration tests assert on.
roxmltree = "0.20"

[lints]
workspace = true
