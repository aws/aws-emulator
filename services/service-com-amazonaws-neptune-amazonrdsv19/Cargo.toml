[package]
name = "service-com-amazonaws-neptune-amazonrdsv19"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# SHA-256, used to mint the opaque resource ids and DNS labels the API reports
# (DbClusterResourceId, DbiResourceId, endpoint shard labels) deterministically.
sha2 = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# `time` is enabled here (and only for tests) so a suite can await the clock-owed
# `creating` -> `available` transition without blocking the runtime worker.
tokio = { workspace = true, features = ["time"] }
hex = { workspace = true }
# Reads the awsQuery XML responses the integration tests assert on.
roxmltree = "0.20"

[lints]
workspace = true
