[package]
name = "service-com-amazonaws-elasticloadbalancing-elasticloadbalancing-v7"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true, features = ["io-util", "net", "time"] }
bytes = { workspace = true }
http = { workspace = true }
# Speaks HTTP/1.1 on the raw connection the core hands a load balancer's own socket, which
# is what makes the published `DNSName` an address a client dials with its own client
# (`src/service/listener_socket.rs`). `hyper-util` carries the tokio IO and timer adapters
# for it, `http-body-util` the bounded body reader and the one-shot body.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
# The DRAW that spreads one cookie-less client's requests across the registered instances a
# load balancer may send them to: which instance a single request reaches is a sample rather
# than a position in a rotation nothing may store (`src/service/data_plane.rs`).
rand = "0.9"
serde_json = { workspace = true }
tracing = { workspace = true }
# SHA-256, for the stable per-record id in a load balancer's generated DNS name, and for
# the token the `AWSELB` stickiness cookie carries instead of the chosen instance's id
# (`src/service/stickiness.rs`).
sha2 = { workspace = true }
# The rendering of that token as the opaque value the cookie carries.
hex = { workspace = true }
# The ELBv2 model, whose operations this crate serves on the endpoint the two models
# SHARE: an awsQuery envelope names the API version it is for, and `Version=2015-12-01`
# is answered out of that model's own service over the one shared engine (see
# `src/service/api_version.rs`). Reaching its operations needs its routing table, which
# only its crate carries.
service-com-amazonaws-elasticloadbalancingv2-elasticloadbalancing-v10 = { path = "../service-com-amazonaws-elasticloadbalancingv2-elasticloadbalancing-v10" }
# The EC2 store, which OWNS instances: a health check of a registered instance observes
# whether EC2 reports that instance running, so the inventory a check reads is EC2's own
# (`src/state/instance_checks.rs`).
service-com-amazonaws-ec2-amazonec2 = { path = "../service-com-amazonaws-ec2-amazonec2" }
# `query_error_envelope`: the `<RequestId>` element an awsQuery `<ErrorResponse>` carries
# beside its `<Error>`, which no model declares and the framework's error renderers do not
# write. Shared with the ELBv2 crate, which this front door serves on the endpoint the two
# models share, so one endpoint cannot answer two envelopes.
service-common = { path = "../common" }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[lints]
workspace = true
