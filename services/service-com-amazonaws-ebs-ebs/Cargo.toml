[package]
name = "service-com-amazonaws-ebs-ebs"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
# The shared rule for naming the operation a request ADDRESSES from its own `@http`
# binding, which is how the routes whose `@required` header/query members the REST router
# keys on are served (see `src/service.rs`); the ONE evaluation of IAM policy documents
# against an action on a resource, and the one wording of a denial; and the shared reading
# of which IAM entity a principal ARN names.
service-common = { path = "../common" }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# SHA256 is the only checksum algorithm the EBS direct APIs model, and every block's
# `Checksum` is computed over the bytes this service persisted.
sha2 = { workspace = true }
# Snapshot ids are lowercase hex (`^snap-[0-9a-f]+$`), and so is every opaque token this
# service mints for a caller to hand back in a URI query.
hex = { workspace = true }
# `StartSnapshot` resolves the `KmsKeyArn` it is given through the KMS endpoint of this
# same emulator, over the in-process transport the operation callback hands out.
aws-sdk-kms = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
# The request identifier a relayed dependent-service refusal names, for an answer that
# carried none of its own.
uuid = { version = "1", features = ["v4"] }
# The STS store, for the identity an access key id speaks for — the principal
# `sts:GetCallerIdentity` answers for the credentials a request signed with — and the
# session policies its mint scoped it with.
service-com-amazonaws-sts-awssecuritytokenservicev20110615 = { workspace = true }
# The IAM store, for the identity-based policy documents in force on that principal and
# the permissions boundary that caps them: the authorization gate reads both services'
# OWN state accessors rather than keeping a second copy of either fact.
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[lints]
workspace = true
