[package]
name = "service-com-amazonaws-bedrockdataautomationruntime-amazonbedrockkeystoneruntimeservice"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
# The shared request-claim rule for a SigV4 signing name several services share.
service-common = { path = "../common" }
# The data-automation build-time service: it owns the projects and blueprints a
# submission references, so this service resolves those references against its store.
service-com-amazonaws-bedrockdataautomation-amazonbedrockkeystonebuildtimeservice = { workspace = true }
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true, features = ["sync", "time"] }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# The Amazon S3 client this service resolves a submission's input asset with, over the
# in-process callback into this same emulator (no network client feature is enabled: the
# transport is the emulator's own): a job's work begins by reading that asset, so whether
# the object store holds it is what the job's terminal outcome is settled on.
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
# The EventBridge client a job's lifecycle event is published with, over the same
# in-process callback: a submission carrying `eventBridgeEnabled` asks to be notified of
# its job through the account's default event bus.
aws-sdk-eventbridge = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
# Reads the header of an input asset that is an image — its format, from the bytes' own
# magic numbers, and its dimensions — which is what decides whether a job pointed at an
# image can process it. Only the decoders for the image formats data automation reads.
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
] }
# Parses the PDF document an input asset holds — its page tree, fonts and per-page content
# streams — so the text a finished job writes into its standard output is text really
# extracted from the asset rather than assembled by hand (`state::asset_extraction`).
pdf-extract = "0.12"
# Digests the store's own mint count and the submission instant into the 16 bytes behind
# the UUID an invocation id is (`state::mint_invocation_id`); the UUID layout itself is
# `service_common::uuid_from_random_bytes`.
sha2 = { workspace = true }
# Applies the character-class half of the modelled `TagKey` `@pattern` from the pattern's
# own source text: the framework's boundary walk cannot compile the expression's leading
# look-around and so drops the whole pattern, and this is the same linear-time engine that
# walk compiles a `@pattern` with.
regex = "1.13"

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
hex = { workspace = true }
# Writes the PDF documents the standard-output suite stages as a job's input asset, so the
# asset a job really parses is a document a PDF reader opens rather than bytes shaped like
# one.
pdf-writer = "0.13"
# Encodes the PNG the same suite stages as an image asset, so the image modality's row is a
# real image rather than hand-assembled bytes.
image = { version = "0.25", default-features = false, features = ["png"] }
# Percent-encoding for the ARN the build-time service binds in an `@httpLabel` path
# segment, which the reference-resolution suite creates and releases its fixtures
# through: the encoding is the crate's, as the sibling apigateway/medialive suites do it,
# rather than another hand-written copy of RFC 3986.
percent-encoding = "2"
# The integration tests poll a job across a clock-owed transition with
# `tokio::time::sleep`; the feature is enabled here so the library target does not carry
# it.
tokio = { workspace = true, features = ["time"] }
# The job-outcome suite mounts the Amazon S3 service beside this one on a single engine —
# the way the assembled emulator runs them — and stages the asset a submission points at
# in its store, because a job that cannot read its asset is the failure path under test.
service-com-amazonaws-s3-amazons3 = { workspace = true }
# EventBridge and SQS are mounted beside this service on one engine — the way the
# assembled emulator runs them — so a job's published event travels the real bus to a real
# SQS target, which is where the notification suite observes it.
service-com-amazonaws-eventbridge-awsevents = { workspace = true }
service-com-amazonaws-sqs-amazonsqs = { workspace = true }

[lints]
workspace = true
