[package]
name = "service-com-amazonaws-emrserverless-awstoledowebservice"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
# The cross-service rules this service takes: the framing of a 204 answer that carries no
# content, and the status such an answer carries.
service-common = { path = "../common" }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Hex codec for the opaque `ListApplications` / `ListJobRuns` pagination cursors.
hex = { workspace = true }
# Digests the rendered `CreateApplication` request behind the idempotency-token
# fingerprint, and the grant behind a `GetDashboardForJobRun` URL's token.
sha2 = { workspace = true }
# The Amazon S3 client a finished job run's log artifacts are PUBLISHED through, over the
# in-process callback into this same emulator (the client itself is `service-common`'s one
# builder; this is the `ByteStream` the object's bytes are handed over as). No network
# client feature is enabled: the transport is the emulator's own.
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
# A published log artifact IS a gzip stream, so it is framed with the maintained DEFLATE
# implementation this workspace already compresses with rather than by hand.
flate2 = "1"
# The `s3MonitoringConfiguration.logUri` a client configures log publishing with is a
# caller-supplied URI, read by the maintained URL parser rather than split by hand.
url = "2"
# ... and that URI's path spells an Amazon S3 key prefix, whose percent-escaping is
# resolved by the maintained encoder the URL parser itself uses.
percent-encoding = "2"

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# The log-publication suite mounts Amazon S3 beside this service on ONE engine, because a
# finished job run publishes its log artifacts there — what the assembled emulator does —
# and reads them back through the object store's own `ListObjectsV2` / `GetObject`.
service-com-amazonaws-s3-amazons3 = { workspace = true }
# ... and CloudWatch Logs beside it, for the other destination a monitoring configuration
# names: the suite reads the delivered records back through `GetLogEvents`.
service-com-amazonaws-cloudwatchlogs-logs-20140328 = { workspace = true }

[lints]
workspace = true
