[package]
name = "service-com-amazonaws-autoscaling-autoscaling-2011-01-01"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
# `time`: the clock pump that publishes a group's instance lifecycle events as they fall
# due waits for the earliest due instant the store holds
# (`state::lifecycle_events::drive_lifecycle_clock`).
tokio = { workspace = true, features = ["time"] }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Mints the `<RequestId>` the awsQuery error envelope carries (see
# `service::query_error_envelope`), the same v4 UUID form the framework's query
# renderer puts in a successful response's `ResponseMetadata/RequestId`.
uuid = { version = "1", features = ["v4"] }
# The EC2 store holds the account's subnets, and a subnet's Availability Zone is a fact
# about that subnet: a group that names only `VPCZoneIdentifier` has its zones resolved
# from EC2's own state (`state::ec2_subnets`) rather than asked of the caller. It also
# holds the account's launch templates, which a group launches its instances from.
service-com-amazonaws-ec2-amazonec2 = { workspace = true }
# The Elastic Load Balancing v2 store holds the target groups a group is attached to and the
# targets registered with them: an instance of an attached group is registered as a target
# there, through that service's own seam, so `DescribeTargetHealth` reports it
# (`state::elbv2_targets`).
service-com-amazonaws-elasticloadbalancingv2-elasticloadbalancing-v10 = { workspace = true }
# The Elastic Load Balancing store holds the Classic Load Balancers a group is attached to and
# the instances registered with them: an instance of an attached group is registered there,
# through that service's own seam, so `DescribeInstanceHealth` reports it
# (`state::elb_classic_instances`).
service-com-amazonaws-elasticloadbalancing-elasticloadbalancing-v7 = { workspace = true }
# The account's own IAM store holds the identity-based policies and the permissions
# boundary in force on the principal a request speaks for, which is what the authorization
# gate decides an account-wide read from (`service::authorization`). A launch template's
# `IamInstanceProfile` is a reference EC2 stores verbatim and this service resolves when it
# consumes the template, so the account's own IAM instance profiles are read from IAM's own
# state (`state::iam_instance_profiles`).
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
# The account's own STS store resolves WHICH principal an access key id speaks for — the
# same answer `sts:GetCallerIdentity` gives — so the authorization gate blames the principal
# the caller reads back for the credential it signed with.
service-com-amazonaws-sts-awssecuritytokenservicev20110615 = { workspace = true }
# The account's own CloudWatch store holds the alarms a target-tracking scaling policy is
# driven by: `PutScalingPolicy` materialises them there and reports back the ones that store
# holds, so an alarm this service reports is one CloudWatch's own `DescribeAlarms` resolves
# (`state::scaling_policies`).
service-com-amazonaws-cloudwatch-graniteserviceversion20100801 = { workspace = true }
# A launch template's `BlockDeviceMappings` may name a customer managed KMS key for a volume
# the launch creates, and that key — its state above all — is the service that OWNS keys' own
# fact: a key that produces no data key produces no volume, so the key a group launches under
# is resolved in the store `kms:CreateKey`, `kms:DisableKey` and `kms:ScheduleKeyDeletion`
# write and `kms:DescribeKey` reports (`state::volume_encryption_keys`), the way the stores
# above are read.
service-com-amazonaws-kms-trentservice = { workspace = true }
# A launch template's `ImageId` may name a Systems Manager parameter rather than an AMI, and
# that parameter is the service that OWNS parameters' own resource: "the Systems Manager
# parameter will resolve to an AMI ID on launch", so the AMI a group launches is resolved in
# the store `ssm:PutParameter` writes and `ssm:GetParameter` reports
# (`state::ssm_image_aliases`), the way the stores above are read. The integration tests mount
# that service beside this one for the same reason, and because the instance-profile
# association a group's launch writes is what its agent registers a managed node with.
service-com-amazonaws-ssm-amazonssm = { workspace = true }
# `service-common` carries the ONE reading of which IAM entity a caller-supplied IAM ARN
# names, which that instance-profile ARN is read through, and the ONE in-process
# EventBridge client an emulated service publishes an event through.
service-common = { path = "../common" }
# The AWS SDK for EventBridge, driven over the in-process callback
# (`OperationContext::callback`): Amazon EC2 Auto Scaling publishes an `EC2 Instance Launch
# Successful` / `EC2 Instance Terminate Successful` event onto the account's default event
# bus as a group's capacity changes (`state::lifecycle_events`). Only the generated client
# is needed — the emulator supplies the transport, so the SDK's own HTTPS stack is left out.
aws-sdk-eventbridge = { version = "1", default-features = false }
# The AWS SDK for Amazon SNS, driven over the same in-process callback: a group configured
# with `PutNotificationConfiguration` publishes the confirmation of that configuration, and
# the launch and termination of each of its instances, onto the configured topic
# (`state::sns_notifications`). Only the generated client is needed — the emulator supplies
# the transport, so the SDK's own HTTPS stack is left out.
aws-sdk-sns = { version = "1", default-features = false }
# `cron`: the crontab expression a scheduled action's `Recurrence` states its schedule as,
# read through the maintained parser this workspace already reads cron with rather than a
# grammar written here (`state::recurrence`).
cron = "0.15"
# `chrono`: the calendar arithmetic that parser states an occurrence in, which is what turns
# the next occurrence of a recurrence into the instant a read reports.
chrono = { version = "0.4", default-features = false, features = ["std"] }
# `chrono-tz`: the IANA time zone database a scheduled action's `TimeZone` names a zone from
# ("the canonical names of the IANA time zones"), which is the zone its recurrence is read
# in.
chrono-tz = { version = "0.10", default-features = false, features = ["std"] }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# `automod`: the single integration-test target declares one suite per `tests/all/<name>.rs`
# from the directory itself, so a new suite is a new file and nothing lists it.
automod = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
# EventBridge and Amazon SQS are mounted beside Amazon EC2 Auto Scaling on one engine in the
# integration tests, because this service publishes an instance lifecycle event onto the
# default event bus as a group scales and a rule on that bus delivers it to an SQS queue:
# without them mounted there is nothing for the publication to reach.
service-com-amazonaws-eventbridge-awsevents = { workspace = true }
service-com-amazonaws-sqs-amazonsqs = { workspace = true }
# Amazon SNS is mounted beside them for the same reason: a group's notification
# configuration publishes to an SNS topic, and the delivery is asserted on the SQS queue
# subscribed to that topic.
service-com-amazonaws-sns-amazonsimplenotificationservice = { workspace = true }
# `RunInstances$UserData` and `RequestLaunchTemplateData$UserData` are base64, and the suite
# whose group must hold instances a Classic Load Balancer's health checks ANSWER launches them
# from a template carrying the program that starts their server.
base64 = "0.22"

[lints]
workspace = true
