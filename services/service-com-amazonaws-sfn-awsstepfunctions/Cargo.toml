[package]
name = "service-com-amazonaws-sfn-awsstepfunctions"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
# `query_error_envelope`: the one statement, shared by every emulated service, of the
# response header a response names the request it answers in.
# `jsonata`: the shared bounded seam onto the maintained JSONata interpreter, which
# states and enforces the ceilings that confine an engine evaluating a caller's own
# text — how this crate evaluates the other query language the Amazon States
# Language's `QueryLanguage` member selects, rather than through a hand-written subset
# or a call site of that engine here.
service-common = { path = "../common" }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
# `time` is for `GetActivityTask`'s long poll: it holds the request open with
# `tokio::time::sleep` between looks at the store, instead of blocking a thread.
# `sync` is the channel a `Task` state's integration call is handed over on, from
# the blocking thread the walk runs on to the async request that makes the call.
tokio = { workspace = true, features = ["sync", "time"] }
bytes = { workspace = true }
http = { workspace = true }
# `raw_value`: a document the DEFINITION writes is reported in the text it was written
# as, so the walk keeps each sub-document's own bytes rather than re-encoding a parsed
# copy (`state::asl::echo`).
serde_json = { workspace = true, features = ["raw_value"] }
# Percent-encodes the fields of the form an `awsQuery` service's request IS, over the
# unreserved set AWS's own canonical request states.
percent-encoding = "2"
# Reads the restXml answer of the S3 dataset a `Map` state's `ItemReader` names: the
# `ListObjectsV2` listing, and the error document a refused read carries. The
# maintained XML pull parser, as the S3 service's own suites use.
quick-xml = "0.41"
# Reads a CSV dataset an `ItemReader` declares `"InputType": "CSV"` for: the maintained
# RFC 4180 reader, rather than splitting the text on the delimiter here.
csv = "1.4"
# Signs the in-process call a `Task` state's service integration makes to the service
# that owns the operation: the emulator verifies every request signature, and the
# credential scope is what routes the call. The SDK's own signer, as the emulator's
# verifier uses; `http1` carries `apply_to_request_http1x`, which puts the signature on
# the `http` 1.x request `state::integration` builds.
aws-sigv4 = { version = "1", features = ["http1"] }
# The identity (access key pair) that signer signs with, and the provider the
# emulator's own callback hands out.
aws-credential-types = "1"
# `States.Hash` returns the hex digest of its input under one of the algorithms the
# Amazon States Language names (MD5, SHA-1, SHA-256, SHA-384, SHA-512), each computed
# by the maintained implementation of it rather than written here.
md-5 = "0.10"
sha1 = "0.10"
sha2 = { workspace = true }
hex = { workspace = true }
# Reads the ISO 8601 instants the Amazon States Language's `Timestamp*` comparators and
# a `Wait` state's `Timestamp` are written as, offsets included: the maintained
# date-time implementation, rather than the wire-timestamp parser whose RFC 3339 profile
# carries no offset.
chrono = { version = "0.4", default-features = false, features = ["std"] }
# JSONPath: the query language every Amazon States Language `*Path` member is
# written in, evaluated by this maintained RFC 9535 implementation rather than a
# hand-written subset.
serde_json_path = "0.7"
tracing = { workspace = true }
# The key policy of a state machine's customer managed KMS key, and the ONE decision
# KMS makes about it: read out of the KMS service's own store, so this service and KMS
# cannot disagree about what a key permits the caller of a read.
service-com-amazonaws-kms-trentservice = { workspace = true }
# The identity-based policies in force on a state machine's EXECUTION ROLE, which is
# what a `Task` state's integration call is made as: read out of IAM's own store, so
# this service judges that call against the documents IAM's handlers wrote.
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
# The EventBridge CONNECTION an HTTP Task's `Authentication.ConnectionArn` names: its
# state and the credentials it holds, read out of EventBridge's own store — the same
# records `CreateConnection` wrote and an api-destination invocation carries — so a
# request this service makes through a connection and one EventBridge makes through it
# cannot disagree about what that connection authorizes.
service-com-amazonaws-eventbridge-awsevents = { workspace = true }
# The principal a request's access key id speaks for, read out of STS's own store —
# the same place `sts:GetCallerIdentity` answers from — so the `iam:PassRole` a
# control-plane request makes is decided for the identity that signed it.
service-com-amazonaws-sts-awssecuritytokenservicev20110615 = { workspace = true }
# Where this service's own observability goes: the `AWS/States` metric series an
# execution publishes, and the execution-history events a logging configuration
# delivers — written into the stores CloudWatch's and CloudWatch Logs' own readers
# answer from, so a published metric and its reader cannot disagree.
service-com-amazonaws-cloudwatch-graniteserviceversion20100801 = { workspace = true }
service-com-amazonaws-cloudwatchlogs-logs-20140328 = { workspace = true }
# The opaque name of the session this service assumes a state machine's execution role
# under (`state::task_authorization::new_session_name`): a fresh version-4 UUID from the
# maintained crate, rendered as its 32 hexadecimal digits.
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# The REST-protocol service a `Task` state's AWS SDK integration calls in
# `tests/all/backup_task_integration.rs`: mounted beside Step Functions on the one
# engine the test router builds, so the backup job a task starts is stored by AWS
# Backup's own handler and read back through its own API.
service-com-amazonaws-backup-cryocontrollerusermanager = { workspace = true }
# The service a `Task` state's integration call is made to in `tests/all/task_integrations.rs`:
# mounted beside Step Functions on the one engine the test router builds, the same shape
# `core/router/src/lib.rs` mounts them in, so the call a task makes is served for real.
service-com-amazonaws-dynamodb-dynamodb-20120810 = { workspace = true }
# EventBridge and SQS are mounted beside Step Functions in
# `tests/all/execution_status_change_events.rs`, because an execution's status changes are
# published onto the default event bus and a rule on that bus delivers them to an SQS
# queue target: without them mounted there is nothing for the publication to reach.
service-com-amazonaws-sqs-amazonsqs = { workspace = true }
# The same, for the service a `Task` state whose `Resource` names a Lambda FUNCTION
# invokes (`tests/all/lambda_task_control_flow.rs`): the function really runs there, so
# the control flow around the task is driven by what the run answered.
service-com-amazonaws-lambda-awsgirapiservice = { workspace = true }
# A deployment package is a .zip archive the suite above writes in memory...
zip = { version = "9", default-features = false, features = ["deflate"] }
# ...and `FunctionCode$ZipFile` is a blob, which a restJson1 request carries base64-encoded.
base64 = "0.22"
# The service that owns the dataset a `Map` state's `ItemReader` reads, mounted the same
# way in `tests/all/map_item_reader.rs`, so the objects the reader lists and gets are
# really stored by S3's own handlers.
service-com-amazonaws-s3-amazons3 = { workspace = true }
# The `awsQuery` service a `Task` state's integration call is made to in
# `tests/all/form_protocol_integration.rs`, mounted the same way, so what the task
# reports is that service's own answer.
service-com-amazonaws-sts-awssecuritytokenservicev20110615 = { workspace = true }
# The service a `Task` state's `arn:aws:states:::sns:publish` integration publishes to
# in `tests/all/sns_publish_task_integration.rs`, mounted beside Step Functions and SQS
# on the one engine the test router builds: the publish is really recorded by SNS's own
# handler and really delivered to the queue subscribed to the topic.
service-com-amazonaws-sns-amazonsimplenotificationservice = { workspace = true }
# Lists and READS the log files a logging trail delivered for this service's DATA events
# (`tests/all/sync_execution_data_events.rs`), through Amazon S3's own API over the same
# in-process callback the delivery writes through: a delivered object counts only if the
# object store answers with it. Only the generated client is needed — the emulator supplies
# the transport.
aws-sdk-s3 = { version = "1", default-features = false }
# Gunzips one of those delivered log files, which is a gzip stream.
flate2 = "1"
# AWS X-Ray is mounted beside Step Functions in `tests/all/execution_xray_tracing.rs`: the
# trace a tracing state machine's run publishes is submitted to that service's own
# `PutTraceSegments` through the in-process callback, and read back through its own
# `GetTraceSummaries` and `BatchGetTraces` — without it mounted there is nowhere for the
# publication to reach.
service-com-amazonaws-xray-awsxray = { workspace = true }

[lints]
workspace = true
