[package]
name = "service-com-amazonaws-apigateway-backplanecontrolservice"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true, features = ["io-util", "net", "time"] }
bytes = { workspace = true }
http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Parses the OpenAPI/Swagger definition `PutRestApi` imports. Read through its event
# stream (not `YamlLoader`) so an alias cannot expand the document, which is what lets the
# YAML spelling of a definition be read under a bound; the JSON spelling goes through
# `serde_json`. Its mappings keep the document's own key order, which is the order the
# paths are imported in. `default-features = false` as the crate's other two dependents
# declare it (cloudformation, greengrassv2): the default `encoding` feature pulls in
# hand-written unsafe SIMD decoders this import has no use for — a definition body is
# already required to be UTF-8 before the parser sees it — and dropping it keeps
# SR-MEM-001 true of the whole request path.
yaml-rust2 = { version = "0.10", default-features = false }
# Reads the comma-separated API key file `ImportApiKeys` imports — the maintained reader
# for the format, so a quoted cell carrying a comma, a line ending or a doubled quote is
# one value rather than whatever a hand-written splitter would make of it. The same
# version the sibling comprehend service declares for the same job.
csv = "1.3"
# `arn`: the ONE parse of a caller-supplied `resourceArn`, so this service agrees with
# every other on what an ARN's six fields are and which ARNs name its own resources —
# what `state::parse_tagged_resource` reads a tag operation's `resourceArn` with. Also the
# ONE bounded reader of a caller-supplied JSON path that names a single value
# (`json_reference_path`), which is what a mapping template's `$input.json`/`$input.path`
# expression is applied through (`service::mapping_template`).
service-common = { path = "../common" }
# Reads a caller-supplied media type — a `Model`'s `contentType` — as the maintained
# parser for the format, so a value that is not a media type is refused however it is
# malformed rather than by a hand-written split on `/`.
mime = "0.3"
# Validates a request payload at a deployed stage against the JSON Schema of the `Model`
# the method declares for its content type — the maintained validator for the format, with
# draft 4 among its dialects, which is the one `CreateModel$schema` documents a model is
# written in. It computes over data in process: it evaluates nothing, and the only schema
# resources it resolves a `$ref` against are the api's own models, because the data plane
# replaces its resource loader with one that resolves NOTHING
# (`service::invoke::NoSchemasBeyondTheApi`) — so a stored schema cannot name a file, a
# host or a URL for this emulator to read.
boon = "0.6"
# The WAFv2 web ACL in front of a deployed stage, and the evaluation of it: a web ACL is
# associated with a stage through `AssociateWebACL`, so the records and the semantics are
# that service's, and the data plane here asks it for the decision rather than keeping a
# second reading of a rule tree (`service::invoke::web_acl_decision`).
service-com-amazonaws-wafv2-awswaf-20190729 = { workspace = true }
# An `AWS` integration names another service's action, and where that action is one this
# emulator serves it is PERFORMED by making the call over the in-process transport
# (`service::invoke::aws_integration`). The SDK client is what signs and shapes that call,
# so this service builds no request for another service's API by hand. `rt-tokio` for the
# byte stream an object's bytes arrive as; the rest of the crate's defaults (its own
# transport, a credentials chain that reads the environment) are not used, because the
# transport and the credentials are the callback's.
aws-sdk-s3 = { version = "1", default-features = false, features = [
    "rt-tokio",
    "behavior-version-latest",
] }
# An `AWS_PROXY` integration names a Lambda function, and it is PERFORMED by invoking that
# function over the same in-process transport (`service::invoke::lambda_proxy`): the proxy
# event is handed to `Invoke` and what the handler answered becomes the method response.
# The grant Lambda's own resource policy carries for `apigateway.amazonaws.com` is read
# through `GetPolicy` on the same client. Only the generated client is needed.
aws-sdk-lambda = { version = "1", default-features = false }
# An `AWS` integration whose `uri` names a QUEUE action is performed by making that call
# over the same in-process transport (`service::invoke::aws_integration::sqs`), so this
# service builds no request for Amazon SQS's API by hand. Only the generated client is
# needed; the version the sibling sns/configservice crates declare for the same hop.
aws-sdk-sqs = { version = "1", default-features = false }
# Reads the `application/x-www-form-urlencoded` body an `AWS` integration's request template
# renders — the wire form a query api names an action and its parameters in — as the
# maintained reader for that media type, so a field whose value carries a `&`, a `=` or a
# percent escape is read as the one value it is rather than by a split written here.
form_urlencoded = "1"
# Base64 for the two members a Lambda proxy integration encodes a payload that is not UTF-8
# text in — the event's own `isBase64Encoded` body and the handler's response body — and for
# the `Blob` member a web ACL's `ByteMatchStatement$SearchString` is in this crate's tests.
# The maintained coder every other service in this tree uses.
base64 = "0.22"
# Matches an `IntegrationResponse$selectionPattern` — "the regular expression (regex)
# pattern used to choose an integration response based on the response from the back end" —
# against the status a backend answered with. The maintained engine, whose matching is
# linear in the subject, so a pattern a control-plane call stored cannot make a request to a
# deployed stage expensive. Also matches an `Authorizer$identityValidationExpression`
# against the audience of the token a `COGNITO_USER_POOLS` authorizer was presented.
regex = "1"
# A `COGNITO_USER_POOLS` authorizer's decision is a function of the token presented and of
# the user pools its `providerARNs` name, and every pool this emulator serves publishes its
# own key set in this same process: the data plane reads that PUBLIC key set from the pool
# that owns it rather than fetching `<issuer>/.well-known/jwks.json` over a network this
# emulator never leaves (`service::invoke::cognito_user_pools`).
service-com-amazonaws-cognitoidentityprovider-awscognitoidentityproviderservice = { workspace = true }
# An `AWS_IAM`-authorized method is authorized against the PRINCIPAL the request's credential
# speaks for: STS holds the sessions an access key id resolves to — which is where a
# credential an identity pool vended is recorded — and IAM holds the identity-based policies
# and the permissions boundary in force on that principal
# (`service::invoke::execute_api_authorization`). The decision itself is
# `service_common::iam_authorization`, the tree's one evaluation of policy documents.
service-com-amazonaws-sts-awssecuritytokenservicev20110615 = { workspace = true }
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
# A domain name access association names a VPC endpoint as its `accessAssociationSource`,
# and VPC endpoints are Amazon EC2's records: the identifier a create carries is resolved
# against that service over the in-process transport before anything is stored
# (`state::vpc_endpoints`), so this service keeps no second reading of which endpoints the
# account has. The same hop resolves the endpoint a private integration's VPC link reaches,
# and the name that endpoint publishes (`service::invoke::private_delivery`). Only the
# generated client is needed, as the sibling apigatewayv2 service declares it for the same
# hop.
aws-sdk-ec2 = { version = "1", default-features = false }
# A private integration is carried over a VPC link, and what that link's load balancers
# forward to — the target groups and the addresses registered in them — is Elastic Load
# Balancing's record, read from that service's own store on the one shared engine
# (`service::invoke::private_delivery`), the same seam the WAFv2 decision above is read over.
service-com-amazonaws-elasticloadbalancingv2-elasticloadbalancing-v10 = { workspace = true }
# The CIVIL CALENDAR a usage plan's quota is metered on: the UTC day a metered request
# falls on, the day a `startDate`/`endDate` names, and the first day of the metering
# period a day belongs to (`state::usage`). The maintained date library the sibling
# services in this tree use, with the same `default-features = false` + `std` spelling:
# the clock itself is `std`'s, so no time-zone database is pulled in.
chrono = { version = "0.4", default-features = false, features = ["std"] }
# `GenerateClientCertificate` ISSUES the client certificate it reports: the caller supplies
# no key material, so the PEM a record carries is a real self-signed X.509 certificate
# generated here (`state::client_certificates`). The maintained generator the sibling
# services in this tree use for certificate material, at the same version, so this emulator
# has one way of issuing a certificate rather than a hand-rolled DER writer.
rcgen = "0.13"
# The CONTENT CODING a response is served under where the api's `minimumCompressionSize`
# asks for compression (`service::invoke::compression`): the maintained encoder for `gzip`
# and `deflate`, the two codings API Gateway's own compression documents, so the bytes a
# client receives are a real encoder's rather than a relabelled body. The same version and
# spelling the sibling cloudfront service compresses an edge answer with.
flate2 = "1"
# The .zip archive a generated client SDK is downloaded as (`GetSdk`): the maintained
# writer for the format, the same one the sibling services in this tree read and write an
# archive with, so what a caller saves to a file is an archive every unzip tool opens.
# `deflate` is the compression a .zip entry carries, and no other feature is needed: the
# archive is written in memory and nothing of the host's file system is read.
zip = { version = "9", default-features = false, features = ["deflate"] }
# The front door a REGIONAL custom domain name publishes as its `regionalDomainName` speaks
# HTTP/1.1 on the raw connection the core hands that domain name's own socket, which is what
# makes the published address one a client dials with its own client
# (`src/service/custom_domain_socket.rs`). `hyper-util` carries the tokio IO and timer
# adapters for it, `http-body-util` the bounded body reader and the one-shot body. The same
# versions and features the sibling Elastic Load Balancing v2 crate serves its load
# balancers' own addresses with.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
# Runs the SERVER side of the TLS handshake that front door terminates: the core's own TLS
# server presents the emulator's certificate and never asks the client for one, so a custom
# domain name that must present the certificate Certificate Manager holds for it and enforce
# its `mutualTlsAuthentication` truststore runs the handshake itself.
# `rustls-pemfile` reads that PEM material (and the truststore's CA certificates) into the
# DER the handshake and its path validation need, and `tokio-rustls` drives it over the
# connection the core handed in. The versions this workspace already builds.
rustls = { workspace = true }
rustls-pemfile = "2"
tokio-rustls = "0.26"
# Writes the values of the XML document an `AWS` integration to a QUERY api answers a call
# its execution role may not make with (`service::invoke::aws_integration::sns`): the
# maintained coder for that format, so a role ARN or a resource ARN a caller configured
# cannot end an element rather than a hand-written escape written here. The same version the
# sibling apigatewayv2/cloudformation/s3 crates read and write XML with.
quick-xml = "0.41"
# Draws the identifiers this control plane ASSIGNS (`state::identifier`): an id a record is
# addressed by is one opaque handle per record, drawn independently rather than derived from
# how many have been minted. The maintained generator the sibling services in this tree draw
# their assigned identifiers with, at the same version.
rand = "0.9"

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
hex = { workspace = true }
# A deployed method whose integration is `AWS_PROXY` is served by invoking a Lambda
# function, and what the handler wrote is asserted where a client reads it — in the
# DynamoDB table the handler put the item in — so both services are mounted on the test's
# own engine beside this one.
service-com-amazonaws-lambda-awsgirapiservice = { workspace = true }
service-com-amazonaws-dynamodb-dynamodb-20120810 = { workspace = true }
# The group a served proxy integration's RUN logs to lives in the CloudWatch Logs emulator's
# store, and `tests/all/stage_proxy_run_logs.rs` reads the delivery back through that
# service's own `FilterLogEvents`, so it is mounted on that suite's engine too.
service-com-amazonaws-cloudwatchlogs-logs-20140328 = { workspace = true }
# A deployed method whose `AWS` integration names an SNS topic action is served by making that
# call, and what the topic then delivers to a subscribed queue is read back through those two
# services' own APIs (`tests/all/sns_service_integration.rs`), so both are mounted on that
# suite's engine beside this one.
service-com-amazonaws-sns-amazonsimplenotificationservice = { workspace = true }
service-com-amazonaws-sqs-amazonsqs = { workspace = true }
# The segments a tracing stage and the invocation it made record live in the AWS X-Ray
# emulator's store, and `tests/all/stage_trace_context.rs` reads them back through that
# service's own `BatchGetTraces`, so it is mounted on that suite's engine too.
service-com-amazonaws-xray-awsxray = { workspace = true }
# The .zip deployment package such a function is created from, written in memory the way a
# caller uploads one — the same reader/writer the Lambda crate's own invoke suites use, and
# the same one `GetSdk` writes a generated SDK with (it is a runtime dependency of this
# crate for that reason, so the suites reach it through that declaration).
# A domain name access association's source is resolved against the VPC endpoints Amazon
# EC2 holds, so that service is mounted beside this one on the suite's own engine and every
# endpoint a case names is created through EC2's OWN API rather than written into a store by
# hand (`tests/all/domain_name_access_association_endpoint.rs`).
service-com-amazonaws-ec2-amazonec2 = { workspace = true }
# Percent-encoding for the `resourceArn` @httpLabel a tag call puts in its URI path: the
# encoding itself is the crate's, as the sibling medialive/codeartifact suites do it,
# rather than a tenth hand-written copy of RFC 3986.
percent-encoding = "2"
# A REGIONAL custom domain name presents the certificate Certificate Manager holds for its
# `regionalCertificateArn`, so that service is mounted beside this one on the suite's own
# engine and every certificate a case names is brought in through Certificate Manager's OWN
# `ImportCertificate` (`tests/all/regional_custom_domain_front_door.rs`).
service-com-amazonaws-acm-certificatemanager = { workspace = true }
# That domain name's mutual-TLS truststore is an object Amazon S3 holds, so the object store
# is mounted beside this one too and every truststore a case names is staged through Amazon
# S3's own `PutObject` — the very seam the front door reads it over.
service-com-amazonaws-s3-amazons3 = { workspace = true }

[lints]
workspace = true
