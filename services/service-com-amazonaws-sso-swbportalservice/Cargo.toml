[package]
name = "service-com-amazonaws-sso-swbportalservice"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# The sign-in a presented access token names is the one the emulator's own IAM Identity
# Center OIDC `CreateToken` minted, so the token is resolved against that service's own
# record of it rather than against a copy kept here.
service-com-amazonaws-ssooidc-awsssooidcservice = { workspace = true }
# The account assignments an administrator made are IAM Identity Center's own records, and
# they are what the portal reports, so they are read where they live.
service-com-amazonaws-ssoadmin-swbexternalservice = { workspace = true }
# An assigned account's display name and email address are the organization's records of
# that account, which is what `AccountInfo` reports them from.
service-com-amazonaws-organizations-awsorganizationsv20161128 = { workspace = true }
# `can_handle`: the ONE reading of whether an endpoint host is one AWS itself publishes a
# service endpoint at, which is what tells another service's endpoint from an ordinary
# hostname an operator points a client at.
service-common = { path = "../common" }
# Encodes the opaque pagination cursors `src/state.rs` issues (hex in, hex out).
hex = { workspace = true }
# Digests the access token into a pagination cursor's scope, so a cursor is bound to
# the session that asked for it without carrying the token itself.
sha2 = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }

[lints]
workspace = true
