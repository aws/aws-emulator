[package]
name = "service-com-amazonaws-observabilityadmin-observabilityadmin"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Encodes/decodes the opaque `NextToken` the list operations hand out.
hex = { workspace = true }
# Reads the caller-supplied telemetry pipeline configuration document, which is YAML
# (or the JSON that YAML 1.2 is a superset of). yaml-rust2 is the pure-Rust YAML 1.2
# implementation the sibling apigateway, cloudformation and amp crates already read
# caller-supplied documents with, and it exposes the parser's EVENT stream, which is
# where an alias can be refused instead of expanded.
yaml-rust2 = { version = "0.10", default-features = false }
# Reads one CSV row for the `csv` processor, so a quoted field carrying the delimiter
# or a newline is one field as CSV defines it.
csv = "1.3"
# Compiles the `substitute_string` processor's pattern. The crate matches in time
# linear in the subject and takes a compile-time size limit, so a caller-supplied
# pattern cannot make one record's match unbounded.
regex = "1.12"
# `service-common` carries this tree's ONE caller-supplied-ARN parse, which the
# integration-scoped refusals read the resource field of a requested `Arn` from
# (`arn::resource`) rather than splitting the value here again.
service-common = { path = "../common" }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
hex = { workspace = true }

[lints]
workspace = true
