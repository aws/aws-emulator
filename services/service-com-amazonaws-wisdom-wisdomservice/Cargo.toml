[package]
name = "service-com-amazonaws-wisdom-wisdomservice"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
# `time` is what `GetRecommendations` waits on: `waitTimeSeconds` is a caller-requested
# long poll, so the handler sleeps between re-reads of the session's feed.
tokio = { workspace = true, features = ["time"] }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# `hex` renders the opaque pagination cursor `SearchQuickResponses` hands out, whose
# position is an ordering key rather than a bare id.
hex = { workspace = true }
# `service-common` carries the workspace's ONE rendering of a `@pattern` as the service
# publishes it, which this crate's constraint-violation messages state, and the ONE
# provisioning of the Amazon SNS topic an assistant streams chat messages through, which
# `CreateAssistant` and `DeleteAssistant` drive over the in-process callback.
service-common = { path = "../common" }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
# `automod` roots the one integration-test target at `tests/all/main.rs`, declaring a
# module per suite file under `tests/all/`.
automod = { workspace = true }
# Amazon SNS is mounted beside this service on ONE engine wherever a suite asserts the
# chat-streaming topic an assistant reports: the topic belongs to that service, so the
# assertion resolves it there rather than trusting this service's own answer.
service-com-amazonaws-sns-amazonsimplenotificationservice = { workspace = true }
# ... and those suites ASK that service for the topic through its own API, with the AWS SDK
# for Amazon SNS over the in-process callback. DEV-ONLY: the provisioning this service does
# drives that hop through `service-common`, so no handler here builds a client.
aws-sdk-sns = { version = "1", default-features = false }

[lints]
workspace = true
