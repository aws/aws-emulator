[package]
name = "service-com-amazonaws-networksecuritymanager-piccolocustomerapiservice"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Renders the `ListPolicies` `nextToken` payload and the hex halves of a minted
# `policyId`/`updateToken` inside the patterns the model declares for them.
hex = { workspace = true }
# Spreads the seed behind a minted `policyId`/`updateToken` (see `state::random_bytes`).
sha2 = { workspace = true }
# The fleet's shared refusal-wording home: the order an enumerated type's admissible
# values are listed in (`service::enum_value_sets`).
service-common = { path = "../common" }

[dev-dependencies]
# Declares one test suite per `tests/all/<name>.rs` from `tests/all/main.rs`.
automod = { workspace = true }
# Percent-encodes an ARN into a query-parameter value (the coverage listings take the
# entity and resource ARNs as query parameters) the way an SDK encodes one. Pinned here
# rather than referenced from the root `[workspace.dependencies]`, which this project does
# not allow editing.
percent-encoding = "2.3"

[build-dependencies]
emulator-core-build-support = { workspace = true }

[lints]
workspace = true
