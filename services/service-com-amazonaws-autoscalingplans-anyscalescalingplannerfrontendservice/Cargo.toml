[package]
name = "service-com-amazonaws-autoscalingplans-anyscalescalingplannerfrontendservice"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Opaque pagination tokens: the NextToken cursors are hex-encoded, so a token this
# service did not mint fails to decode and is refused as InvalidNextTokenException.
hex = { workspace = true }
# Policy names: a scaling plan's policy is named after the identity of the resource and
# the metric it was minted from, and both are unbounded caller text, so each enters the
# bounded PolicyName as a fixed-width digest of itself.
sha2 = { workspace = true }
# The in-process SigV4 signature a call this service makes to Application Auto Scaling —
# the service that owns the target tracking scaling policies a plan installs — carries,
# and the family's UUID layout the id inside a derived policy name is rendered in.
service-common = { path = "../common" }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# `time` is a TEST-only feature: one integration test waits out the real lifecycle
# settle span with `tokio::time::sleep`. The production build does not need it.
tokio = { workspace = true, features = ["time"] }
# One integration-test target rooted at `tests/all/main.rs`: `automod::dir!` declares one
# module per `tests/all/<name>.rs`, so a new suite is a new file and nothing else.
automod = { workspace = true }

[lints]
workspace = true
