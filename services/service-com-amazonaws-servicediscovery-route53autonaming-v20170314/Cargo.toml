[package]
name = "service-com-amazonaws-servicediscovery-route53autonaming-v20170314"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Hashes the id counter into the opaque resource ids this service mints.
sha2 = { workspace = true }
# Encodes the opaque pagination cursor a `NextToken` carries.
hex = { workspace = true }
# `state::route53_zone`: the in-process Amazon Route 53 client this service creates a DNS
# namespace's hosted zone with and publishes its services' record sets through. Only the
# generated client is needed: the emulator supplies the transport, so the SDK's own HTTPS
# stack is left out.
aws-sdk-route53 = { version = "1", default-features = false }
# `state::route53_zone`: a DNS namespace's hosted zone is MANAGED by this service, which
# Route 53 reports as the zone's `LinkedService`. That fact is recorded on the zone whose id
# Route 53 minted, through the shared engine, so this crate needs the owning service's state
# TYPE — the same way Route 53 reaches the Amazon EC2 and CloudWatch stores.
service-com-amazonaws-route53-awsdnsv20130401 = { workspace = true }
# `state::namespace_vpc`: the in-process Amazon EC2 client that resolves the VPC a private
# DNS namespace is visible inside, so a create naming a VPC the account does not hold fails
# its asynchronous step instead of reporting success. Only the generated client is needed:
# the emulator supplies the transport.
aws-sdk-ec2 = { version = "1", default-features = false }

# The constraint-refusal wording this service answers with, and the renaming of the
# member an error body carries its text in: the shared collecting walk, the shared
# per-operation layer that quotes the collection a request submitted, the shared home for
# the modelled `@pattern`s the boundary validator declares and cannot apply, and the one
# home for that rename. See `src/service/submitted_collections.rs`,
# `src/service/modelled_patterns.rs` and `src/service/error_message_member.rs`.
service-common = { path = "../common" }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# `tests/all/main.rs` declares one module per suite file under `tests/all/`.
automod = { workspace = true }
# `tests/all/async_namespace_operations.rs` and
# `tests/all/namespace_vpc_failure_reason.rs`: the VPC a private DNS namespace is created
# for is resolved in Amazon EC2, so the tests mount EC2 beside this service on the one
# shared engine, exactly as the assembled emulator does.
service-com-amazonaws-ec2-amazonec2 = { workspace = true }

[lints]
workspace = true
