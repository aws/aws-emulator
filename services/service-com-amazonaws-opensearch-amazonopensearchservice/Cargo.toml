[package]
name = "service-com-amazonaws-opensearch-amazonopensearchservice"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Mints the GUID `ChangeId` a domain configuration change is addressed by
# (`state::new_change_id`) and the GUID `ReservedInstanceId` a purchase mints
# (`state::new_reserved_instance_id`): `GUID`'s pattern is exactly a hyphenated
# UUID. The `v5` feature derives the GUID of a seeded Reserved Instance offering
# from what the offering IS, so the catalog reports the same ids on every call.
uuid = { version = "1", features = ["v4", "v5"] }
# The STS session store, so the principal an index request is authorized as is the
# identity `sts:GetCallerIdentity` answers for the access key it signed with.
service-com-amazonaws-sts-awssecuritytokenservicev20110615 = { workspace = true }
# The IAM store, which holds the identity policies in force on that principal — the
# documents an index request is authorized against.
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
# The Cognito user-pool store, which holds the pools a domain's Dashboards Cognito
# authentication can name (`state::cognito_authentication`): the pool a `CognitoOptions`
# container points at is resolved in the store `cognito-idp:CreateUserPool` writes.
service-com-amazonaws-cognitoidentityprovider-awscognitoidentityproviderservice = { workspace = true }
# `arn::region_label`: the ONE reading of a caller-supplied Region as a Region LABEL,
# and `iam_authorization`: the shared evaluation of those documents against
# (action, resource), so this service and every other one handed the same document
# decide alike. Declared as a path dependency, the way the other consumers do.
service-common = { path = "../common" }
# The percent-decoding of a query parameter a data-plane request carries
# (`service::domain_rest`): a query string holds its values escaped, and the maintained
# crate is what states that grammar rather than a hand-rolled decoder here.
percent-encoding = "2.3"
# The Amazon S3 object store, which holds the dictionary file a package's content is
# imported from: `CreatePackage` names an S3 bucket and key, and the content of that
# object is what an index's analysis settings read through `analyzers/<PackageID>`
# (`state::analysis`). Read from the store S3 itself writes, the way the IAM and Cognito
# stores above are read.
service-com-amazonaws-s3-amazons3 = { workspace = true }
# The Amazon CloudWatch Logs store, which holds the log groups a domain's logs are
# published to: a `LogPublishingOption` names its destination by ARN, and that group is
# resolved in the store `logs:CreateLogGroup` writes (`state::log_destinations`) — the
# way the IAM, Cognito and S3 stores above are read.
service-com-amazonaws-cloudwatchlogs-logs-20140328 = { workspace = true }
# The AWS KMS key store, which holds the customer managed keys a domain's encryption at
# rest can name: an `EncryptionAtRestOptions$KmsKeyId` is resolved — at the domain's own
# Region, and for the key state KMS serves it in — in the store `kms:CreateKey` and
# `kms:DisableKey` write (`state::encryption_at_rest`), the way the stores above are read.
service-com-amazonaws-kms-trentservice = { workspace = true }
# The Certificate Manager certificate store, which holds the certificates a domain's
# custom endpoint can be served under: a `DomainEndpointOptions$CustomEndpointCertificateArn`
# is resolved — and asked whether it covers the requested hostname — in the store
# `acm:ImportCertificate` and `acm:RequestCertificate` write
# (`state::custom_endpoint`), the way the stores above are read.
service-com-amazonaws-acm-certificatemanager = { workspace = true }
# UAX#29 word segmentation: the word boundaries the engine's standard tokenizer splits
# text on (`state::analysis`), rather than a hand-written scanner here.
unicode-segmentation = "1"
# Snowball stemming, so a language analyzer and a `stemmer`/`snowball` token filter fold
# a term's inflected forms together the way the engine's own stemmer does.
rust-stemmers = "1.2"
# The published per-language stop-word lists, so a language analyzer and a `stop` filter
# that names no list of its own drop the function words they are documented to drop
# without a list hand-maintained here.
stop-words = "0.8"
# The AWS SDK for EC2, driven over the in-process callback
# (`OperationContext::callback`): the VPC and the Availability Zones a VPC endpoint
# reports are DERIVED from its subnets, and a subnet is EC2's resource, so
# `state::vpc_network` resolves what a request names against EC2. Only the generated
# client is needed — the emulator supplies the transport.
aws-sdk-ec2 = { version = "1", default-features = false }
# A look-around-capable regex engine, for the one modelled `@pattern` of this service
# the request boundary cannot apply: a custom endpoint's FQDN syntax opens each label
# with a negative lookahead (`state::custom_endpoint`), which the engine that boundary
# compiles a `@pattern` with has no support for.
fancy-regex = "0.16"
# `rquickjs` is the QuickJS JavaScript engine, embedded in this process, which is what
# EVALUATES the condition of an alerting monitor's trigger
# (`state::trigger_condition`): whether a trigger fires is decided by the caller's own
# condition over the run's results, so that source is executed rather than read. An
# EXECUTION SUBSTRATE, which is why that module states and enforces the ceilings that
# confine it (a fresh engine per evaluation, the engine's own memory and stack limits, a
# wall clock and a step budget checked by its interrupt handler, and a latched stop the
# evaluated source cannot reach). `dyn-load` is left OUT, so no host library can be
# loaded; plain QuickJS registers no filesystem, process, environment, network or thread
# API, and nothing here adds one. It is also a NATIVE component: `rquickjs-sys` compiles
# the QuickJS C sources with `cc` inside this build, so nothing is fetched or started
# outside this process. Already in this workspace's build and lockfile (five services run
# caller-supplied JavaScript in it), so no new capability class arrives with it.
rquickjs = "0.14"
# The maintained Handlebars implementation, which RENDERS the Mustache templates an
# alerting action's subject and message are written as, and the two values the plugin
# substitutes into a monitor's own query (`state::message_template`): Handlebars is a
# superset of Mustache's interpolation, so a template is rendered by a maintained engine
# rather than by a substitution written here. A library that computes over data: it opens
# nothing, starts nothing and reaches nothing, and the module bounds both the template it
# is handed and the text it produces.
handlebars = { version = "6", default-features = false }
# The AWS SDK for SNS, driven over the in-process callback
# (`OperationContext::callback`): an alerting monitor's trigger publishes its rendered
# message to the Amazon SNS topic its notification channel names
# (`state::notification_publication`), which is what fans that notification out to the
# topic's own subscriptions. Only the generated client is needed — the emulator supplies
# the transport.
aws-sdk-sns = { version = "1", default-features = false }
# The Service Quotas store, which holds the value the account's adjustable quotas are in
# force at: how many security groups one network interface of a VPC placement may carry is
# the account's "Security groups per network interface" quota, so `state::vpc_network`
# reads it in the store `service-quotas` answers `GetServiceQuota` from — the way the IAM,
# Cognito, S3, CloudWatch Logs, KMS and Certificate Manager stores above are read.
service-com-amazonaws-servicequotas-servicequotasv20190624 = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
hex = { workspace = true }
# The Amazon SNS and Amazon SQS services, mounted beside this one on ONE shared engine by
# the alerting suite: a monitor trigger's notification is published to an SNS topic and
# read back off the SQS queue subscribed to it, so what the suite asserts is where a client
# sees it.
service-com-amazonaws-sns-amazonsimplenotificationservice = { workspace = true }
service-com-amazonaws-sqs-amazonsqs = { workspace = true }
# ... and the Amazon SQS SDK client, driven over the in-process callback, which is how that
# suite creates the queue, subscribes it to the topic and receives from it (the Amazon SNS
# client it drives beside it is this crate's own dependency above).
aws-sdk-sqs = { version = "1", default-features = false }
# Generates the real certificates and key pairs a test brings into Certificate Manager
# through its own `ImportCertificate`, so the names a domain's custom endpoint is judged
# against are read out of a real X.509 body rather than written into the test. TEST-ONLY.
rcgen = "0.13"

[lints]
workspace = true
