[package]
name = "service-com-amazonaws-vpclattice-mercurycontrolplane"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Hashes the account id into the stable segment of a service's lattice domain name,
# and the entropy of a minted resource id.
sha2 = { workspace = true }
# Encodes the opaque `nextToken` cursor a paginated listing hands back.
hex = { workspace = true }
# Evaluates the modelled `@pattern` of a resource name, which is written with negative
# look-ahead the `regex` crate behind `@pattern` cannot compile.
fancy-regex = "0.16"
# The shared rendering of a `@pattern` requirement in a constraint-violation message.
service-common = { path = "../common" }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[lints]
workspace = true
