[package]
name = "service-com-amazonaws-interconnect-interconnect"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# The Direct Connect client `ListAttachPoints` resolves the account's Direct Connect
# gateways through, over the in-process callback into this same emulator (no network
# client feature is enabled: the transport is the emulator's own). An attach point IS a
# Direct Connect gateway, which that service owns.
aws-sdk-directconnect = { version = "1", default-features = false }
# v4 UUIDs for the server-owned `Connection$sharedId` / `activationKey` and the
# random suffix of a `ConnectionId`.
uuid = { version = "1", features = ["v4"] }
# Reads the base64 an `activationKey` is written in: the member carries the partner
# portal's encoded capture, so text that does not decode is a fault in the request.
base64 = "0.22"
# `page_tokens::PageTokenKey`: the workspace's one way a listing authenticates the page
# cursors it issues, so a `nextToken` this service did not mint names no position.
service-common = { path = "../common" }
# The hex a minted page cursor is rendered as on the wire.
hex = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
# The Interconnect tests mount the Direct Connect service beside Interconnect on one
# engine, because an attach point is one of that service's gateways: `ListAttachPoints`
# reports what Direct Connect holds, so the suites create the gateways there.
service-com-amazonaws-directconnect-overtureservice = { workspace = true }
# `tokio::time::sleep`, which only the integration suite needs: it waits out a
# connection's provisioning span to observe the clock-owed transition. No handler
# sleeps, so the runtime dependency above stays without the `time` feature.
tokio = { workspace = true, features = ["time"] }

[lints]
workspace = true
