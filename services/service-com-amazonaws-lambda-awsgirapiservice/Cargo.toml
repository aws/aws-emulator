[package]
name = "service-com-amazonaws-lambda-awsgirapiservice"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
# The shared request-claim rule for a SigV4 signing name several services share.
service-common = { path = "../common" }
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
# `time` on top of the workspace features: the event source mapping poller
# (`state::event_source_poller`) waits between passes with `tokio::time::sleep` rather
# than parking a worker thread, and `sync` for the run slots an invocation takes one of
# (`state::execution`).
tokio = { workspace = true, features = ["io-util", "sync", "time"] }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
# The Telemetry API READS a subscribe body into the members it publishes
# (`state::execution::runtime_api::telemetry`), so the values each member admits and the
# detail of a body that states something else are the deserializer's own.
serde = { workspace = true }
tracing = { workspace = true }
# An event source mapping on a queue is accepted against the QUEUE's own configuration,
# which lives in the Amazon SQS emulator's queue store: it is reached through the shared
# engine, which needs the owning service's state TYPE.
service-com-amazonaws-sqs-amazonsqs = { workspace = true }
# An event source mapping on an Amazon MQ broker is accepted only against a broker that
# EXISTS, and brokers live in the Amazon MQ emulator's own store
# (`state::event_source_request`): it is reached through the shared engine, which needs the
# owning service's state TYPE. The same store holds the QUEUES of each broker's own data
# plane, which the mapping's poller consumes (`state::mq_poller`).
service-com-amazonaws-mq-mq = { workspace = true }
# An event source mapping on an Amazon MSK cluster CONSUMES the topics it names, and a
# cluster's topics and their partition logs live in the Amazon MSK emulator's own store
# (`state::kafka_poller`): the records are read through the same data-plane reading that
# cluster's Apache Kafka wire protocol serves a fetch from, reached through the shared engine,
# which needs the owning service's state TYPE.
service-com-amazonaws-kafka-kafka = { workspace = true }
# The AMQP 0-9-1 basic properties a message of such a broker carries, which is how the
# message is stored and what the event a RabbitMQ mapping hands its function reports for it
# (`state::mq_poller`): the same codec the broker's own wire is served with, so one process
# has one reading of those values.
amq-protocol = { version = "10.7", default-features = false }
# A mapping is also accepted against what the invoked function's EXECUTION ROLE may read on
# the event source (`state::event_source_authorization`): the role's policies live in the
# IAM emulator's store, reached through that same shared engine. The same store holds the
# identity-based policies an INVOCATION is authorized against
# (`state::invoke_authorization`).
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
# An event source also carries a RESOURCE-based policy of its own, held by the service that
# owns the source (`state::event_source_resource_policy`): a queue's `Policy` attribute lives
# in the Amazon SQS store above, and a data stream's or a table stream's attached policy in
# these two — each read through the owning service's own store over the shared engine, which
# needs that service's state TYPE.
service-com-amazonaws-kinesis-kinesis-20131202 = { workspace = true }
service-com-amazonaws-dynamodb-dynamodb-20120810 = { workspace = true }
# The age a stream mapping's poller meters for a batch is measured from the instant the
# batch's newest record was WRITTEN (`state::event_source_arrival`), and a DynamoDB stream
# record's own reported creation stamp is rounded down to the second: the write instant is
# read out of the store of the service that holds the record, over the shared engine, which
# needs that service's state TYPE.
service-com-amazonaws-dynamodbstreams-dynamodbstreams-20120810 = { workspace = true }
# Attaching a function to a VPC IS an elastic network interface per configured subnet, and
# those interfaces are the ACCOUNT's own EC2 records (`state::vpc_interfaces`): they are
# written into, and taken back out of, the Amazon EC2 emulator's inventory over the shared
# engine — which needs that service's state TYPE — so the subnets they sit in resolve to the
# VPC the function reports and a client reading `DescribeNetworkInterfaces` sees them.
service-com-amazonaws-ec2-amazonec2 = { workspace = true }
# A function's `FileSystemConfigs` mounts an Amazon EFS ACCESS POINT into the execution
# environment, and the files behind it are the file system's own, held by the service that
# owns it (`state::file_system_mounts`): the access point's root directory, its `PosixUser`
# and that one shared tree are read out of the Amazon EFS emulator's store over the shared
# engine, which needs that service's state TYPE — so what one function writes under its mount
# path, every other client of that file system reads.
service-com-amazonaws-efs-magnolioapiservice-v20150201 = { workspace = true }
# A container-image package names an image in the Amazon ECR registry, and Lambda follows
# that reference when the package is stored (`state::image_source`): the registry's own
# image and tag records are reached through the shared engine, which needs the owning
# service's state TYPE.
service-com-amazonaws-ecr-amazonec2containerregistry-v20150921 = { workspace = true }
# A .zip deployment package carries the CODE SIGNATURE it was signed with, and that
# signature is verified against the key pair the signing profile version holds
# (`state::package_signature`): the pair lives in the AWS Signer emulator's own store,
# reached through the shared engine, which needs the owning service's state TYPE.
service-com-amazonaws-signer-wallabyservice = { workspace = true }
# A function's own invocation logs go to the CloudWatch Logs store of the same engine
# (`state::log_delivery`), which is where `FilterLogEvents` and `GetLogEvents` read them
# from: the delivery writes that service's own records rather than a second copy.
service-com-amazonaws-cloudwatchlogs-logs-20140328 = { workspace = true }
# An invocation is authorized against the principal its access key id speaks for, which is
# the session the token service minted that key for — the same record `GetCallerIdentity`
# answers from (`state::invoke_authorization`), reached through the shared engine.
service-com-amazonaws-sts-awssecuritytokenservicev20110615 = { workspace = true }
# CodeSha256 is the SHA-256 of the stored deployment package...
sha2 = { workspace = true }
# ...reported base64-encoded, as the model's CodeSha256 member describes it.
base64 = "0.22"
# The key DERIVATION the same module computes (`crypto.hkdfSync`): the extract-and-expand
# construction over the digests above, taken from its own crate rather than composed here.
hkdf = "0.12"
# The SYMMETRIC CIPHERS that same `crypto` core module computes
# (`state::execution::node::cipher`): a handler that is handed an envelope-encrypted payload
# opens it with `createDecipheriv`, so the AES modes it names are taken from maintained
# implementations rather than written here — the authenticated mode, and the two block modes
# over the `aes` block cipher.
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
ctr = "0.9"
# The other two digest families the `crypto` core module a Node handler imports computes
# (`state::execution::node::digest`), beside the SHA-2 one above, and the keyed form of all
# of them. Taken from crates rather than written here: a digest is arithmetic a maintained
# implementation already states.
sha1 = "0.10"
md-5 = "0.10"
hmac = "0.12"
# The PASSWORD-BASED derivation that same module computes (`crypto.pbkdf2Sync`): the
# iterated keyed digest of PKCS #5, over the keyed digests above, taken from its own crate
# rather than counted out here. `default-features = false` with `hmac` alone leaves the
# password-hash string format out of the build.
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
# The COMPRESSION the `zlib` core module a Node handler imports computes
# (`state::execution::node::compress`). All three are LIBRARIES that compute over the bytes
# they are handed, in this process: none of them opens a socket, starts a process, loads a
# shared library or reads a host path, and none compiles a C toolchain dependency — `flate2`
# is taken with its default `miniz_oxide` backend, which is Rust, and the other two are Rust
# throughout. Each is pinned to a released version and resolves with a checksum in Cargo.lock.
#
# * the gzip, zlib and raw wrappers of one deflate stream (`zlib.gzipSync` and its family),
flate2 = "1"
# * the BROTLI streams the same module states beside them (`zlib.brotliCompressSync`),
brotli = "9"
# * and the CRC-32 it checksums bytes with (`zlib.crc32`), which is also the checksum a gzip
#   member carries.
crc32fast = "1"
# The two other COMPRESSION engines of this runtime's PYTHON standard library, which the `bz2`
# and `lzma` modules a handler imports are written over
# (`state::execution::guest_compression`). Both are LIBRARIES computing over the bytes they are
# handed, in this process: neither opens a socket, starts a process, loads a shared library or
# reads a host path.
#
# * `bzip2` on its default `libbz2-rs-sys` backend is the bzip2 format's own implementation
#   rewritten in Rust, so a bzip2 stream is read and written by Rust throughout;
# * `liblzma` is the xz project's own implementation of the `.xz` and the legacy `.lzma`
#   streams, built from the sources it vendors (`static`, with the binding generator left out
#   of the build) and linked into this binary. It is taken rather than a Rust codec because the
#   format's own implementation is the one that reads and writes every stream of it: the Rust
#   codec tried first writes an `.xz` stream its own reader cannot read back once the payload
#   passes one LZMA2 chunk.
#   It is a NATIVE component, and the one in this set that is: `liblzma-sys` compiles the
#   vendored xz C sources with `cc` at build time — the `xz` release those sources are is the
#   one that sys crate's own 0.4 line carries (the 5.8 line), identified by the pinned
#   `liblzma-sys` version and its checksum in Cargo.lock, which is also what an advisory
#   database is asked about; the `uncheck_liblzma_version` escape is NOT taken, so the build
#   refuses sources whose version its bindings do not expect. That C, and the `unsafe` binding
#   layer over it, are outside this crate's forbidden `unsafe_code` exactly as the QuickJS
#   sources `rquickjs-sys` compiles and the SQLite sources `rusqlite`'s `bundled` feature
#   compiles already are. What reaches that decoder is CALLER bytes — a handler's
#   `lzma.decompress` — so the seam that hands them over bounds them in host code no guest can
#   reach (`state::execution::guest_compression`: `MAX_CALL_BYTES` on what one call may be
#   handed and may answer, `MEMORY_LIMIT` on what the engine may allocate to read one stream),
#   a stream it cannot read is reported as the failure the module raises for one, and the
#   invocation's own deadline, step and memory bounds hold the rest. Nothing is decoded at
#   build time and no stream is read from a host path.
bzip2 = "0.6"
liblzma = { version = "0.4", default-features = false, features = ["static"] }
# The hexadecimal the guest hands bytes over and reads digests back as.
hex = { workspace = true }
# The regular-expression engine the WHOLE-VALUE reading of a `@pattern` whose branches are
# alternatives is checked with (`state::arn_member_form`): the model's own expression,
# compiled once, rather than a hand-written reading of it.
regex = "1.13"
# The cryptographic random bytes `crypto.randomBytes`/`randomUUID` draw from: the one
# source of randomness a run has, read from the platform rather than from a seed.
getrandom = "0.3"
# The IANA time-zone database a run's `Intl` and local `Date` readings stand on
# (`state::execution::node::intl`): a zone's offset at an instant, with its daylight-saving
# transitions, is this database's answer, compiled into the binary rather than read from a
# host path. `chrono` is taken for the calendar arithmetic `chrono-tz` states its offsets in
# terms of, with no clock feature, so no reading of the HOST's own zone is compiled in: the
# only zone a run reads is the one its own `TZ` names.
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = { version = "0.10", default-features = false }
# RevisionId is a UUID, minted fresh on every change to a function.
uuid = { version = "1", features = ["v4"] }
# The AWS SDK clients the event source mapping poller (`state::event_source_poller`)
# reaches the other services of THIS emulator through, over the in-process callback
# (`OperationContext::callback`): the mapped Kinesis data stream or DynamoDB table stream
# it reads (`ListShards`/`DescribeStream`, `GetShardIterator`, `GetRecords`) and the
# function it hands each batch to (`Invoke`). Only the generated clients are needed: the
# emulator supplies the transport, so the SDK's own HTTPS stack is left out.
aws-sdk-kinesis = { version = "1", default-features = false }
aws-sdk-dynamodbstreams = { version = "1", default-features = false }
aws-sdk-lambda = { version = "1", default-features = false }
# The queue the record of a batch that mapping gave up on is written to, when its
# `DestinationConfig$OnFailure` names one (`state::event_source_poller::failure_destination`):
# that write is Amazon SQS's own `SendMessage`, made over the same in-process callback. (A
# topic destination is the `aws-sdk-sns` client already taken below.)
aws-sdk-sqs = { version = "1", default-features = false }
# The id of the invocation request such a record reports, read off the answer the SDK client
# above got back: the request id is response METADATA rather than a modelled member, and this
# is the trait the SDKs expose it through.
aws-types = { version = "1", default-features = false }
# The concurrent fan-out one pass of the queue poller makes: a mapping configured for several
# concurrent instances hands that many batches to its function AT ONCE
# (`state::sqs_poller`), which is this crate's `join_all` over the attempts rather than a
# hand-rolled poll loop. Only the combinator is needed, so the executor and the I/O half of
# the `futures` facade are left out.
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
# Amazon S3 binds every operation to a method, a path, a query and headers of its own
# rather than carrying an input document in the body, so a handler's `boto3.client("s3")`
# call cannot be built by the AWS JSON path the other reachable services share: this is the
# client that builds, signs and parses it (`state::execution::aws_s3`), over the same
# in-process callback. It is also the client the record of a batch an event source mapping
# gave up on is written through when its `DestinationConfig$OnFailure` names a BUCKET
# (`state::event_source_poller::failure_destination`): that write is Amazon S3's own
# `PutObject`.
aws-sdk-s3 = { version = "1", default-features = false }
# CloudFront binds every operation to a method, a path and an XML body of its own
# (`restXml`) rather than carrying an input document in a JSON body, so a handler's
# `boto3.client("cloudfront")` call cannot be built by the AWS JSON path the other
# reachable services share: this is the client that builds, signs and parses it
# (`state::execution::aws_cloudfront`), over the same in-process callback. A function that
# INVALIDATES a distribution's cache after writing the object behind it is the shape that
# needs it. Only the generated client is needed: the emulator supplies the transport.
aws-sdk-cloudfront = { version = "1", default-features = false }
# Amazon SNS's model declares `awsQuery`: an operation travels as the `Action` parameter of a
# form-encoded body with its input flattened into the parameters beside it, and the answer is
# an XML document, so a handler's `boto3.client("sns")` call cannot be built by the JSON paths
# the other reachable services share: this is the client that builds, signs and parses it
# (`state::execution::aws_sns`), over the same in-process callback. A function that PUBLISHES
# what it just handled, or SUBSCRIBES a queue to the topic it publishes to, is the shape that
# needs it. Only the generated client is needed: the emulator supplies the transport.
aws-sdk-sns = { version = "1", default-features = false }
# The EMAIL service's model declares `awsQuery` too, so a handler's `boto3.client("ses")` call
# is built, signed and parsed by this client (`state::execution::aws_ses`), over the same
# in-process callback. A function that exists to MAIL — a scheduled report, a sign-up
# confirmation, an alert — is the shape that needs it, which is the overwhelming majority of
# handlers that send at all. Only the generated client is needed: the emulator supplies the
# transport.
aws-sdk-ses = { version = "1", default-features = false }
# The security token service's model declares `awsQuery` too, so a handler's
# `boto3.client("sts")` call is built, signed and parsed by this client
# (`state::execution::aws_sts`), over the same in-process callback. A function that ASSUMES
# ANOTHER ROLE and then calls a service with the session it was vended — the role-chaining
# shape AWS documents for a function that reaches across accounts or narrows its own grants
# — is the shape that needs it. Only the generated client is needed: the emulator supplies
# the transport.
aws-sdk-sts = { version = "1", default-features = false }
# The IDENTITY service's model declares `awsQuery` too, so a handler's
# `boto3.client("iam")` call is built, signed and parsed by this client
# (`state::execution::aws_iam`), over the same in-process callback. A function that reports
# the role it runs as, that checks what that role is allowed to do, or that PROVISIONS an
# identity for a workload is the shape that needs it. The same client the event source
# mapping's grant checks already reach IAM's store with, taken here for the guest seam. Only
# the generated client is needed: the emulator supplies the transport.
aws-sdk-iam = { version = "1", default-features = false }
# Amazon RDS's model declares `awsQuery` as well, so a handler's `boto3.client("rds")` call
# is built, signed and parsed by this client (`state::execution::aws_rds`), over the same
# in-process callback. A credential-rotation function that puts the new master password in
# force on the DB instance the secret belongs to (`ModifyDBInstance`), and one that EXPORTS a
# database snapshot to Amazon S3 — the shape a CloudFormation custom resource's provider takes
# for that integration — are the shapes that need it. Only the generated client is needed: the
# emulator supplies the transport.
aws-sdk-rds = { version = "1", default-features = false }
# AWS CloudFormation's model declares `awsQuery` too, so a handler's
# `boto3.client("cloudformation")` call is built, signed and parsed by this client
# (`state::execution::aws_cloudformation`), over the same in-process callback. A function that
# reads the STACK it was deployed by — its template, its resources, its outputs and its events
# — or that drives a stack of its own, which is the shape a deployment or custom-resource
# handler takes, is the shape that needs it. Only the generated client is needed: the emulator
# supplies the transport.
aws-sdk-cloudformation = { version = "1", default-features = false }
# Amazon EC2's model declares `ec2Query`, so a handler's `@aws-sdk/client-ec2` or
# `boto3.client("ec2")` call is built, signed and parsed by this client
# (`state::execution::aws_ec2`), over the same in-process callback. A function that revokes or
# authorizes the rules of a SECURITY GROUP — the shape the provider of a CloudFormation custom
# resource over a VPC's default group takes — is the shape that needs it. Only the generated
# client is needed: the emulator supplies the transport.
aws-sdk-ec2 = { version = "1", default-features = false }
# A function whose environment variables are encrypted with a customer managed key can
# only be invoked while that key can decrypt them, and the key's state belongs to the key
# service: it is asked over the same in-process callback
# (`state::execution::environment_key`).
aws-sdk-kms = { version = "1", default-features = false }
# Whether the customer managed key an event source mapping's FILTER CRITERIA are sealed
# under lets this service open them again is KMS's OWN decision over the key policy its
# handlers wrote (`state::filter_criteria_key`): the key record and that decision are
# reached through the shared engine, which needs the owning service's state TYPE.
service-com-amazonaws-kms-trentservice = { workspace = true }
# The CloudWatch store Lambda publishes its own metrics to (the `AWS/Lambda` namespace,# `state::metrics`). CloudWatch refuses a `PutMetricData` into a reserved `AWS/`
# namespace, so a service's own metrics never travel over that API; this writes the very
# store `ListMetrics`/`GetMetricStatistics` read.
service-com-amazonaws-cloudwatch-graniteserviceversion20100801 = { workspace = true }
# The EventBridge client a durable execution's status changes are published through
# (`state::durable_events`), over the same in-process callback: the shared construction of
# that hop is `service_common::eventbridge_client`, and this is the entry type it builds.
aws-sdk-eventbridge = { version = "1", default-features = false }

# ---------------------------------------------------------------------------
# The EXECUTION substrate: what runs a function's own deployment package.
#
# `Invoke` answers with whatever the caller's handler returned, so the handler has to
# run. These crates are an in-process execution substrate — they interpret
# caller-supplied code — and every one of them is taken with the host-reaching surface
# switched OFF at compile time, so the capability class is "run the caller's Python or
# JavaScript in this process, with no host access at all":
#
# * `rustpython-vm` with `default-features = false` leaves `host_env`, `stdio` and
#   `threading` out of the build, so the VM registers no `ctypes` host loader, writes
#   nothing to this process's stdio and starts no interpreter thread; `compiler` is the
#   bytecode compiler for the package's own sources and `freeze-stdlib` takes the Python
#   standard library from `rustpython-pylib`'s frozen copy rather than from any host
#   path.
# * `rustpython-stdlib` with `default-features = false` is the native-module pool. The
#   crate is NOT registered wholesale: `crate::execution::python` filters
#   `stdlib_module_defs` through its own allow-list, so `_socket`, `_ssl`, `select`,
#   `_posixsubprocess`, `mmap`, `_ctypes`, `_thread` and `posix` are never reachable from
#   guest code, and the modules the guest does expect (`os`, `_thread`) are this crate's
#   own replacements.
# * `rustpython-ruff_*` are RustPython's own forks of the Python parser's AST crates.
#   They are PINNED exactly: `rustpython-codegen` 0.6 is built against the 0.16.5 AST,
#   and 0.16.10 renamed fields it uses, so an unpinned resolution picks a newer 0.16.x
#   and fails to compile.
# * `nix` (`resource` only) reads this process's own resource usage — the run thread's
#   faulted pages — which is how a run is bounded in memory: RustPython exposes no
#   allocator seam, so the bound is sampled from outside the guest, and a per-THREAD
#   reading is the only one that belongs to one run. It compiles no C.
#
# Native and unsafe surface accepted here: the RustPython tree uses `unsafe` for its
# object model and its frozen-module tables, and its `malachite`/`num` arithmetic
# dependencies compile Rust only. No crate in this set compiles a C toolchain
# dependency, loads a shared library, or opens a socket, a process or a host file.
# Advisories considered: RUSTSEC-2026-0394 (RustPython up to 0.5, fixed in 0.6 — the line
# taken here) and the `atty` advisory that the 0.3/0.4 lines pull in (not reachable from
# 0.6).
# * `rquickjs` is the QuickJS JavaScript engine, which is what RUNS a `nodejs*`
#   function's own handler (`crate::state::execution::node`). The `loader` feature is
#   taken because module resolution has to be THIS emulator's: an `import` is answered
#   from the deployment package's own entries and the core modules the crate supplies,
#   and from nothing else. The `dyn-load` feature is deliberately NOT taken, so no
#   native-library loader is compiled in, and plain QuickJS exposes no filesystem,
#   process, socket or environment API of its own: the whole host surface of a run is
#   the three functions that module installs. Each run is bounded by the engine's own
#   memory limit (set from the function's `MemorySize`), a stack limit, an interrupt
#   handler holding the deadline and the step ceiling, and the host-driven timer queue.
#   It is also a NATIVE component: `rquickjs-sys` compiles the QuickJS C sources with
#   `cc` at build time, which is outside this crate's forbidden `unsafe_code`; the
#   version is pinned and resolves with a checksum in Cargo.lock. No advisory stands
#   against this line.
rquickjs = { version = "0.14", features = ["loader"] }
# The CONTAINED Python interpreter, shared with the other service of this emulator that runs
# caller-supplied Python (`service-com-amazonaws-lambdamicrovms-lambdamicrovms`, which runs a
# MicroVM image's guest): the interpreter's construction and native-module narrowing, the
# containment patches the host reads back, the clamped sleep and recursion limit, the watch
# that samples a run from outside it, and the memory reading a run's ceiling is judged on all
# live there, so a hole cannot be closed in one service and left open in the other.
python-guest-substrate = { path = "../python-guest-substrate" }
rustpython-vm = { version = "0.6", default-features = false, features = [
    "compiler",
] }
rustpython-stdlib = { version = "0.6", default-features = false }
rustpython-pylib = { version = "0.6", features = ["freeze-stdlib"] }
rustpython-ruff_python_ast = "=0.16.5"
rustpython-ruff_python_parser = "=0.16.5"
rustpython-ruff_python_trivia = "=0.16.5"
rustpython-ruff_source_file = "=0.16.5"
rustpython-ruff_text_size = "=0.16.5"
nix = { version = "0.31", default-features = false, features = ["resource"] }
# The DATABASE ENGINE the `sqlite3` module of the Python standard library this runtime
# supplies runs its statements on (`state::execution::guest_sqlite`): the `bundled` SQLite
# already in this workspace, at the version and feature set every other in-process database
# of this emulator builds (`services/common`, and the Athena, Redshift Data and RDS Data
# services). `column_decltype` carries the declared type of a column, which is what
# `detect_types` converts a value by; `limits` installs the per-connection bounds on a
# statement, a value and a database; `hooks` carries the default-deny authorizer that confines
# a handler's SQL to its own database and the progress handler that bounds one statement's run;
# `serialize` answers the BYTE IMAGE of a database, which is what the file a handler named it by
# holds in the function's ephemeral storage, and `backup` carries the `DatabaseName` that call
# names the main database by.
# An in-process library over data: it opens no listener, writes no host file (every database is
# opened in memory, with its temp store in memory too) and spawns nothing.
rusqlite = { version = "0.41", features = [
    "backup",
    "bundled",
    "column_decltype",
    "hooks",
    "limits",
    "serialize",
] }
# The TRAFFIC SPLIT an alias with a `RoutingConfig` performs: one uniform draw per
# invocation decides which of the two versions that invocation runs on
# (`state::alias_routing`).
rand = "0.9"
# A deployment package is a .zip archive, and the handler's module is one entry in it.
# Read with `deflate` alone — no other compression method is linked in — and never
# extracted to a host path.
zip = { version = "9", default-features = false, features = ["deflate"] }
# Speaks HTTP/1.1 on the raw connection the core hands a FUNCTION URL's own listener, which
# is what makes the published `FunctionUrl` an address a client dials by its host alone
# (`src/state/function_url_endpoint.rs`). `hyper-util` carries the tokio IO and timer
# adapters for it, `http-body-util` the bounded body reader and the one-shot body.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
# `InvokeWithResponseStream`'s `PayloadChunk` carries its blob as the FRAME's own payload
# (`@eventPayload`), which the framework's event serializer does not express: that one
# frame is written with the event-stream encoder itself.
aws-smithy-eventstream = "0.60"
# A running handler's SDK call to a REST-bound service binds its input to a URI, so a label
# or a query parameter's value is percent-encoded on the way into one
# (`state::execution::rest_json`).
percent-encoding = "2.3"
# `generate_db_auth_token` is not an API call: the SDKs build the authentication token a
# database login presents by SigV4-PRESIGNING a request in the client
# (`state::execution::db_auth_token`). `aws-sigv4` is the SDK's own signer, in that
# presigned form, and `aws-credential-types` is the credential type it signs with, so the
# token is the one that signer computes rather than a format written out here. Both are
# already in this workspace's lock file.
aws-sigv4 = { version = "1", default-features = false, features = ["http1", "sign-http"] }
aws-credential-types = "1"
# The TLS CLIENT one of those connections negotiates its session with
# (`state::execution::guest_socket`): a data plane whose protocol runs over TLS is reached by
# running the client side of a real handshake against the certificate this emulator's core
# presents on the plane it reached, whose end runs the server side of it — so the version, the
# suite and the peer certificate a handler reads back are the ones that handshake negotiated.
# The same implementation the core's own listeners terminate TLS with, so one process has one
# TLS stack, and `tokio-rustls` is that implementation over the in-process stream the
# connection is.
rustls = { workspace = true }
tokio-rustls = "0.26"
# The platform's own values for the names a complete POSIX module carries as plain data —
# the `open` flags the standard library reads off `os` while being imported
# (`state::execution::host_posix`) — taken from the C headers rather than written out here.
libc = "0.2"
# The VPC a function with a `VpcConfig` is attached to, as the run inside it addresses that
# VPC (`state::execution::vpc_network`): `ipnet` reads the CIDR blocks of the VPC and of the
# subnets its interfaces sit in, and says whether a destination lies in one, which is what
# decides the source address a route resolves to; `simple-dns` reads and writes the DNS
# messages the VPC's own resolver is asked and answers with, so what travels between the
# handler and that resolver is a real DNS exchange. Both are pure-Rust libraries computing
# over data in this process: no listener, no engine, no native or build-time code, and
# between them one dependency of their own (`bitflags`, already in this workspace's lock).
ipnet = "2"
simple-dns = "0.13"

[build-dependencies]
emulator-core-build-support = { workspace = true }
# The same interpreter standard library the dependency above freezes into the build, taken
# here as TEXT: `build.rs` reads the modules of it that the frozen code objects were compiled
# from, so a traceback frame inside one of them carries its source line
# (`state::execution::python_library`). No feature of it is built here — only the constant
# naming where that library is — and nothing is read while a function runs.
rustpython-pylib = { version = "0.6" }

[dev-dependencies]
# The one integration-test target is rooted at tests/all/main.rs, which declares one module
# per suite file under tests/all/ rather than listing them by hand.
automod = { workspace = true }
# The VPC, subnets and security groups a function's attachment is asserted against are
# created through Amazon EC2's OWN API in the VPC-attachment tests, and the interfaces
# Lambda stood up are read back through its `DescribeNetworkInterfaces`: the client that
# builds, signs and parses those `ec2Query` calls over the in-process callback is the one the
# guest SDK seam holds, declared under `[dependencies]` above.
# The key service a durable function's `DurableConfig` names a key in, mounted beside
# lambda so a key really is disabled when the test says it is, is declared under
# `[dependencies]` above.
# The two services that own what a VPC's own resolver answers a handler inside that VPC:
# Route 53 holds the PRIVATE hosted zones and their VPC associations, and Route 53 Resolver owns
# the in-VPC DNS data plane that reads them. Both are mounted beside lambda on ONE engine in the
# private-zone suite, so the name the handler resolves is answered out of the records those
# services' own operations wrote.
service-com-amazonaws-route53-awsdnsv20130401 = { workspace = true }
service-com-amazonaws-route53resolver-route53resolver = { workspace = true }
# The client that builds, signs and parses those Route 53 `restXml` calls over the in-process
# callback, the way the EC2 client of the VPC-attachment suites does for `ec2Query`.
aws-sdk-route53 = { version = "1", default-features = false }
# A deployment package the invoke tests upload is a .zip archive they write in memory.
zip = { version = "9", default-features = false, features = ["deflate"] }
# `time` on top of the workspace features: the data-plane tests wait out the state-settle
# span and the poller's passes with `tokio::time::sleep`, and `io-util` for the listener the
# socket tests open on this emulator's own core: its protocol handler reads and writes the
# connection the core hands it. `test-util` for the PAUSED clock a unit test over the poll
# loop's own wait runs on, so the case that lets the loop's interval run out advances virtual
# time instead of sleeping (`state::sqs_poller`). `net` for the socket a client of a
# WEBSOCKET api's data plane dials, which is a TCP connection to this emulator's own listener.
tokio = { workspace = true, features = ["io-util", "net", "test-util", "time"] }
# API Gateway V2, mounted beside lambda on ONE engine: a function fronting the routes of a
# WEBSOCKET api is invoked by that api's data plane, and the reply it pushes back travels
# through the `@connections` surface that api publishes, so the backend-response lifecycle is
# driven against the service that owns the socket.
service-com-amazonaws-apigatewayv2-apigatewayv2 = { workspace = true }
# And the `@connections` management API beside it (signing name `execute-api`): the reply a
# WEBSOCKET backend pushes back to its caller is a call of THAT service, which the handler's own
# SDK makes over the in-process seam, so it has to be mounted for the push to reach anything.
service-com-amazonaws-apigatewaymanagementapi-apigatewaymanagementapi = { workspace = true }
# The RFC 6455 WebSocket protocol, CLIENT side: that data plane is a socket, so the client
# half of the conversation — the opening handshake, the masking of every frame, the accept
# value it verifies and the closing handshake — is this maintained implementation rather than
# anything hand-written. The same version, and the same `client_async` seam, the API Gateway
# V2 crate's own socket suites drive. `handshake` only.
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
# The services a mapping's event source and its own metrics live in are mounted beside
# lambda on ONE engine in the data-plane tests, because a delivery is asserted where a
# client sees it: on the stream the records were put to, and in the series CloudWatch
# reports for the function. A DynamoDB table's stream is two of them: the table the item
# is written to, and the stream surface its records are read through. (The two stream
# services' own crates are dependencies above, because a source's resource policy is read
# out of their stores.)
# An invocation's own log is delivered to CloudWatch Logs, so the tests that assert a run's
# lines read them where a client reads them: through that service's own API, mounted beside
# lambda on ONE engine.
service-com-amazonaws-cloudwatchlogs-logs-20140328 = { workspace = true }
# A handler's SDK call to a REST-bound service is asserted against the service that answers
# it, so Amazon API Gateway is mounted beside lambda on ONE engine for those tests.
service-com-amazonaws-apigateway-backplanecontrolservice = { workspace = true }
# A handler's SDK call to AWS Step Functions is asserted against the execution that service
# started, so Step Functions is mounted beside lambda on ONE engine for that test.
service-com-amazonaws-sfn-awsstepfunctions = { workspace = true }
# The same for the RDS Data API, the other REST-bound service a handler's SDK reaches: the
# rows a handler's statements write are read back through that service's own endpoint, with
# it mounted beside lambda on ONE engine.
service-com-amazonaws-rdsdata-rdsdataservice = { workspace = true }
# And for Amazon RDS itself, the `awsQuery` service a handler drives a database's Amazon S3
# export and its role associations through: the refusal a handler's call reads is held against
# the one that service answers the SAME call made directly, with it mounted beside lambda on
# ONE engine.
service-com-amazonaws-rds-amazonrdsv19 = { workspace = true }
# The same for Amazon SES API v2, the other REST-bound service a handler's SDK reaches: the
# identity, configuration set and message a handler's calls produce are read back through
# that service's own API, mounted beside lambda on ONE engine.
service-com-amazonaws-sesv2-simpleemailservice-v2 = { workspace = true }
# The same for Amazon SES (the 2010-12-01 API), the email service a handler's `ses` client
# reaches: the identity a handler verifies and the message it sends are read back through that
# service's own awsQuery API, mounted beside lambda on ONE engine.
service-com-amazonaws-ses-simpleemailservice = { workspace = true }
# The same for AWS IoT: the thing a handler's own `CreateThing`/`UpdateThing` registers is
# read back through that service's own registry, with it mounted beside lambda on ONE engine.
service-com-amazonaws-iot-awsiotservice = { workspace = true }
# The same table is the sink a handler's OWN outbound call writes to in the stream-driven
# pipeline test, mounted on that same engine so the item is read back where a client reads
# it. The table's STREAM is a `[dependencies]` entry of its own, so there is nothing to
# declare for it here.
service-com-amazonaws-cloudwatch-graniteserviceversion20100801 = { workspace = true }
# The token-minting tests read the query fields of a minted authentication token the way a
# client reads them, with the same query-string reader the SDK's own signer uses.
form_urlencoded = "1"
# The secret a handler's own Secrets Manager call reads, mounted beside lambda on ONE engine:
# the value, the key it is held under and the role policies that decide the read are written
# with those services' own operations.
service-com-amazonaws-secretsmanager-secretsmanager = { workspace = true }
# The bucket a handler's own S3 call reads and writes, mounted beside lambda on ONE engine
# in the SDK tests: an object a handler reads is asserted where a client reads it, and the
# bucket policy and the role policies that decide such a read are written with S3's and
# IAM's own operations.
service-com-amazonaws-s3-amazons3 = { workspace = true }
# The topic a handler's own Amazon SNS call publishes to and subscribes a queue to, mounted
# beside lambda on ONE engine: a publication is asserted where a client sees it — off the queue
# the subscription delivers to — and the subscription and tags the handler wrote are read back
# through that service's own reads.
service-com-amazonaws-sns-amazonsimplenotificationservice = { workspace = true }
# The Parameter Store a handler's own Systems Manager call reads and writes, mounted beside
# lambda on ONE engine: a parameter a handler wrote is asserted where a client reads it,
# through that service's own GetParameter.
service-com-amazonaws-ssm-amazonssm = { workspace = true }
# The bus a publication made with an invocation's own credential is decided by, mounted
# beside lambda on ONE engine: the event is asserted where a client sees it — off the queue
# the matching rule targets — and the role policies that decide the publication are written
# with IAM's own operations.
service-com-amazonaws-eventbridge-awsevents = { workspace = true }
# AppConfig's two APIs, mounted beside lambda on ONE engine for the suite that reads a
# function's own configuration: the application, environment, configuration profile and
# hosted version a handler reads are written with the control plane's own operations, and the
# deployed document the handler polls is served by the data plane.
service-com-amazonaws-appconfig-amazonappconfig = { workspace = true }
service-com-amazonaws-appconfigdata-appconfigdata = { workspace = true }
# The image analysis service a handler's own call asks what an object holds, mounted beside
# lambda on ONE engine: the labels a handler records are asserted against what that service
# answers for the same image when a client calls it directly.
service-com-amazonaws-rekognition-rekognitionservice = { workspace = true }
# The PNG and JPEG frames that suite submits, encoded by the image library rather than written
# out byte by byte — the two formats that service accepts.
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
] }
# The pipe a handler's own EventBridge Pipes call reads and steers, mounted beside lambda on
# ONE engine: the pipe a handler described, started, stopped and tagged is asserted where a
# client reads it, through that service's own reads.
service-com-amazonaws-pipes-pipes = { workspace = true }
# The trace store a traced invocation's own segments and a handler's UDP-submitted documents
# land in, mounted beside lambda on ONE engine: what the X-Ray daemon this runtime serves
# submitted is asserted where a client reads it, through that service's own BatchGetTraces and
# GetTraceSummaries.
service-com-amazonaws-xray-awsxray = { workspace = true }
# The Bedrock Agent runtime plane a handler's own agent invocation and knowledge-base retrieval
# reach, and the serverless search plane its collection create reaches, mounted beside lambda on
# ONE engine: each refusal a handler reports is the one that service itself answered, and the
# collection it created is read back through that service's own API.
service-com-amazonaws-bedrockagentruntime-amazonbedrockagentruntimeservice = { workspace = true }
service-com-amazonaws-opensearchserverless-opensearchserverless = { workspace = true }
# The Bedrock Agent BUILD-TIME plane, mounted beside those two on that same engine: the
# knowledge base a handler retrieves from — and the custom data source whose documents it
# retrieves — are created and ingested through this plane's own API, so what the handler gets
# back is read out of the records those creates really wrote.
service-com-amazonaws-bedrockagent-amazonbedrockagentbuildtimelambda = { workspace = true }
# The VECTOR STORE a handler's own embedding writes and nearest-neighbour searches reach,
# mounted beside lambda on ONE engine: the bucket, index and vectors a handler created are
# asserted where a client reads them — through that service's own GetIndex, ListVectorBuckets
# and GetVectors.
service-com-amazonaws-s3vectors-s3vectors = { workspace = true }
# The USER POOL a handler's own Amazon Cognito calls administer, mounted beside lambda on ONE
# engine: the user a handler created, read, listed or disabled is asserted where a client reads
# it — through that service's own AdminGetUser and ListUsers.
service-com-amazonaws-cognitoidentityprovider-awscognitoidentityproviderservice = { workspace = true }
# The search DOMAIN whose REST data plane a handler's own signed requests are decided by,
# mounted beside lambda on ONE engine: the write a handler signs is admitted or refused by
# that service's own authorization, and the document it stored is read back through its own
# data plane.
service-com-amazonaws-opensearch-amazonopensearchservice = { workspace = true }
# The trail that decides what an invocation's audit record is delivered to, mounted beside
# lambda on ONE engine: the record of a call is asserted where a client reads it — out of the
# log file the trail delivered into the object store above.
service-com-amazonaws-cloudtrail-cloudtrail-20131101 = { workspace = true }
# Gunzips such a delivered log file, which is a gzip stream.
flate2 = "1"
# The SCHEDULES a handler's own EventBridge Scheduler calls write, read and delete, mounted
# beside lambda on ONE engine: the group and schedule a handler created are asserted where a
# client reads them — through that service's own GetSchedule, ListSchedules and
# GetScheduleGroup — and the role policies that decide those calls are written with IAM's own
# operations.
service-com-amazonaws-scheduler-awschronosservice = { workspace = true }
# Reads the text of an `awsQuery` answer as the XML it is: the apostrophes a service's own
# not-found sentence quotes a name with travel escaped in that document, and a handler's SDK
# hands the same sentence over already unescaped, so the two are held against each other
# through this maintained unescaper rather than a hand-written one.
quick-xml = "0.41"
# The Apache Kafka wire protocol, CLIENT side: the records an MSK event source mapping consumes
# are produced over the bootstrap address the cluster published, so the suite over that mapping
# frames a real `Produce` on a socket of that address with the same implementation the cluster's
# own broker endpoint is served with — one reading of the protocol in this process.
kafka-protocol = { version = "0.18", default-features = false, features = [
    "broker",
    "client",
] }
# The identity POOL whose vend hands a caller the credentials an invocation is signed with,
# mounted beside lambda on ONE engine: the pool, the identity and the session an invocation
# reports in `context.identity` are the ones that service's own CreateIdentityPool, GetId and
# GetCredentialsForIdentity really made.
service-com-amazonaws-cognitoidentity-awscognitoidentityservice = { workspace = true }

[lints]
workspace = true
