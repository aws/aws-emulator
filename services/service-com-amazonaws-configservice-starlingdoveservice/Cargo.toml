[package]
name = "service-com-amazonaws-configservice-starlingdoveservice"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true, features = ["time"] }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# The AWS SDK for EventBridge, driven over the in-process callback
# (`OperationContext::callback`): a rule's compliance change is published onto the
# account's default event bus with `PutEvents`, the way an Amazon Web Services service
# delivers its own events. Only the generated client is needed — the emulator supplies
# the transport, so the SDK's own HTTPS stack and runtime are left out.
aws-sdk-eventbridge = { version = "1", default-features = false }
# The AWS SDK for Amazon S3, driven over the same in-process callback: a running
# configuration recorder OBSERVES the resources it records through the owning service's
# own API (`state::recording`), so the buckets it records and their configuration come
# from S3 itself rather than from another crate's state. Only the generated client is
# needed — the emulator supplies the transport.
aws-sdk-s3 = { version = "1", default-features = false }
# The AWS SDK for Amazon SQS, driven over the same callback: a running configuration
# recorder observes this account's queues and their configuration through Amazon SQS's own
# API (`state::recording`), the way it observes every other resource type it records.
aws-sdk-sqs = { version = "1", default-features = false }
# The AWS SDK for Amazon SNS: a delivery channel "sends notifications and updated
# configuration states" to the topic its `snsTopicARN` names, so each configuration item
# Config records is published to that topic with `Publish`
# (`state::change_notification`).
aws-sdk-sns = { version = "1", default-features = false }
# The AWS SDK for IAM, driven over the same in-process callback: a running configuration
# recorder observes this account's IAM roles through IAM's own API, and an account-wide
# managed rule reads the account's password policy from it (`state::observed_iam`), so
# neither is read from another crate's state.
aws-sdk-iam = { version = "1", default-features = false }
# The AWS SDK for AWS Lambda, driven over the same callback: a Config Custom Lambda rule is
# evaluated by the function the account points the rule at, so Config INVOKES that function
# and the function delivers its verdict back with `PutEvaluations`
# (`state::custom_lambda_rule`).
aws-sdk-lambda = { version = "1", default-features = false }
# The AWS SDK for Amazon Web Services Systems Manager, driven over the same in-process
# callback: a remediation configuration's target is an SSM automation document, so whether
# that document exists is asked of Systems Manager's own document registry
# (`state::remediation_target`) rather than assumed. Only the generated client is needed —
# the emulator supplies the transport.
aws-sdk-ssm = { version = "1", default-features = false }
# `regex`: the CloudFormation registry type-name form a Config read accepts a resource
# type under is a published regular expression, so the expression itself is what matches
# it (`state::resource_type`).
regex = "1"
# `sqlparser`: the SQL `SELECT` command `SelectResourceConfig` takes is PARSED with it,
# so a malformed expression is refused because the parser cannot read it rather than
# because this emulator searched its text.
sqlparser = "0.59"
# `yaml-rust2`: a conformance pack `TemplateBody` is a YAML (or JSON, which YAML 1.2 is a
# superset of) CloudFormation template, so one YAML parser reads both spellings and
# `PutConformancePack` judges the template it IS. Pure Rust, no `unsafe`, no C.
yaml-rust2 = { version = "0.10", default-features = false }
# `flate2`: a delivered configuration snapshot is a gzip-framed object, so the snapshot
# delivery writes its payload through this crate's gzip encoder.
flate2 = "1"
# `uuid`: the identifiers Config hands back in the uuid form (a stored query's `QueryId`,
# a `ResourceEvaluationId`) are drawn as version-4 uuids by this crate, so the id is
# random rather than derived from how many have been minted (`state::identifier`).
uuid = { version = "1", features = ["v4"] }
# `rand`: the identifiers Config hands back as a run of opaque base-36 characters draw
# every character from this crate's thread-local generator, for the same reason
# (`state::identifier`).
rand = "0.9"
# `md-5`: a configuration item's `configurationItemMD5Hash` is "a unique MD5 hash that
# represents the configuration item's state", which a caller uses "to compare the states
# of two or more configuration items", so the hash is that digest of the state the item
# records (`state::discovered_resource`).
md-5 = "0.10"
# `service-common` carries the workspace's ONE evaluation of an IAM policy document
# (`iam_authorization`), which is how `PutDeliveryChannel` decides whether the delivery
# bucket's own policy allows Config to deliver into it.
service-common = { path = "../common" }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
hex = { workspace = true }
# `time` lets a test await the clock-owed recorder status transition.
tokio = { workspace = true, features = ["time"] }
# S3, EventBridge, SNS and SQS are mounted beside Config on one engine in the integration
# tests: the recorder READS the resources it records from S3 and Amazon SQS, a rule's
# compliance change is published onto the default EventBridge bus, whose rule delivers it
# to an SQS queue, and a recorded configuration item is streamed to the delivery channel's
# SNS topic, whose subscriber is an SQS queue — without them mounted there is nothing to
# record and nowhere to publish.
service-com-amazonaws-s3-amazons3 = { workspace = true }
service-com-amazonaws-eventbridge-awsevents = { workspace = true }
service-com-amazonaws-sqs-amazonsqs = { workspace = true }
service-com-amazonaws-sns-amazonsimplenotificationservice = { workspace = true }
# IAM is mounted beside Config where the suite is about the configuration recorder's own
# role: Config assumes that role to deliver, and the question is put to IAM itself, so
# without IAM mounted there is nothing to answer it.
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
# CloudFormation is mounted beside Config where the suite PROVISIONS the delivery pipeline
# the way a client does — a stack declaring the delivery bucket, its Config bucket policy
# and the recorder's role — so the bucket, the policy and the role the delivery is judged
# against are the ones a stack really created rather than ones the suite wrote by hand.
service-com-amazonaws-cloudformation-cloudformation = { workspace = true }
# Systems Manager is mounted beside Config where the suite is about a remediation
# configuration's TARGET: the document the configuration names exists only if Systems
# Manager's own registry holds it, so without SSM mounted there is nothing to ask.
service-com-amazonaws-ssm-amazonssm = { workspace = true }
# Lambda is mounted beside Config where the suite is about a Custom Lambda rule: Config
# INVOKES the function the rule names and the function's own run delivers the verdict back
# with `PutEvaluations`, so without Lambda mounted there is no evaluator to invoke.
service-com-amazonaws-lambda-awsgirapiservice = { workspace = true }# `zip`: a function's deployment package — the .zip archive that suite writes in memory —
# is uploaded the way a caller uploads one.
zip = { version = "9", default-features = false, features = ["deflate"] }
# `base64`: a deployment package travels as base64 in `CreateFunction`'s `Code.ZipFile`.
base64 = "0.22"
# `percent-encoding`: IAM reports a policy version's document percent-encoded, so the suite
# that reads a recorded managed policy back decodes it with this crate rather than by hand.
percent-encoding = "2"

[lints]
workspace = true
