[package]
name = "service-com-amazonaws-iot-awsiotservice"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
# `time` on top of the workspace features: the wait for an authorizer's Lambda function to
# answer is bounded by `tokio::time::timeout` (`state::custom_authorizer`).
tokio = { workspace = true, features = ["time"] }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# The IoT job-execution store shared with the IoT Jobs data plane, which serves the
# executions `CreateJob` creates when a job targets a thing (`services/common`).
service-common = { path = "../common" }
# Endpoint identifiers: an account's IoT endpoint prefix is derived from the
# account id and the region with SHA-256 (see `state::derive_endpoint_identifier`).
sha2 = { workspace = true }

# Opaque `nextToken` continuation tokens: `ListThings` hex-encodes the listing's
# filters and the last thing name it emitted (see `ops::list_things`).
hex = { workspace = true }

# A `kinesis` topic-rule action writes the selected message onto its stream with
# `PutRecord`, built as the SDK's generated client only: the transport is the emulator's own
# in-process callback (`service_common::kinesis_client`), so the SDK's HTTPS stack and
# runtime are left out and nothing off this process is reachable.
aws-sdk-kinesis = { version = "1", default-features = false }

# A `dynamoDBv2` topic-rule action writes the selected message into its table with `PutItem`,
# one column per message attribute (`state::rules_engine::dynamodb_action`), built as the SDK's
# generated client only: the transport is the emulator's own in-process callback, so the SDK's
# HTTPS stack and runtime are left out and nothing off this process is reachable.
aws-sdk-dynamodb = { version = "1", default-features = false }

# `chrono`: `parse_time(<format>, <time>)` of the AWS IoT SQL library writes an instant out
# through a date pattern (`state::rule_expression::library`), so the calendar arithmetic that
# turns milliseconds since the epoch into a year, a month and a day is this maintained crate's
# rather than hand-rolled here. No clock feature: the instant comes from the expression.
chrono = { version = "0.4", default-features = false, features = ["std"] }

# `sqlparser`: the SELECT clause and the WHERE condition of a topic rule's SQL statement
# are PARSED with it (`state::rule_sql`), so the statement a caller stores is read by a
# maintained SQL parser rather than matched here. A parser only — it yields an AST and has
# no host primitives — and what runs over that AST is this crate's own bounded walk of the
# published message.
sqlparser = "0.59"

# The CloudWatch metric store the rules engine publishes its own `AWS/IoT` series into — one
# count per rule action it attempted, so what a rule did with a message is readable where a
# client reads every other series (`state::rules_engine::action_metrics`): that service's own
# state struct, in the SAME shared engine, written through its own accessors rather than
# through a second copy of them.
service-com-amazonaws-cloudwatch-graniteserviceversion20100801 = { workspace = true }

# The IAM store a topic-rule action's `roleArn` is resolved against, to decide whether the
# rules engine may assume that role and make the action's API call under it
# (`state::rule_action_role`), and the identity-based policy documents in force on the
# principal a request speaks for, which is what the authorization decision taken in front of
# every operation is made from (`service::authorization`): the IAM service's own state struct,
# in the SAME shared engine, read through its own accessors rather than through a second copy
# of them.
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }

# The STS store that same decision resolves the caller through (`service::authorization`): the
# session a request's access key id belongs to is the record `sts:GetCallerIdentity` answers
# from, read through that service's own accessor in the SAME shared engine.
service-com-amazonaws-sts-awssecuritytokenservicev20110615 = { workspace = true }

# `form_urlencoded`: the ONE reader of a query string in this crate — the `resourceArn` a tag
# READ binds to the query is percent-encoded by an SDK client, and the authorization decision
# reads that ARN back (`service::authorization`).
form_urlencoded = "1"

# The Amazon Cognito Identity store an identity POOL a request names is resolved against
# (`state::cognito_identity_pools`): whether a pool exists is its holder's answer, read
# through that service's own state struct in the SAME shared engine rather than through a
# second copy of it.
service-com-amazonaws-cognitoidentity-awscognitoidentityservice = { workspace = true }

# The Certificate Manager store a domain configuration's server certificate is resolved
# against (`state::domain_configurations`): whether a certificate exists, and whether a
# public authority ISSUED it or the account imported it, is the holder's answer — read
# through that service's own state struct in the SAME shared engine rather than through a
# second copy of it.
service-com-amazonaws-acm-certificatemanager = { workspace = true }

# The Amazon S3 client a bulk thing provisioning task reads its input file object through
# (`state::thing_registration`), over the in-process callback into this same emulator (no
# network client feature: the transport is the emulator's own).
aws-sdk-s3 = { version = "1", default-features = false, features = [
    "rt-tokio",
    "behavior-version-latest",
] }

# `CreateKeysAndCertificate` issues a REAL 2048-bit RSA key pair, and the certificate
# over it is signed with that key (`state::certificates`): the key generation and the
# RSASSA-PKCS1-v1_5 SHA-256 signature are this library's, computed in process.
aws-lc-rs = "1"
# Writes the DER/PEM X.509 certificate this service issues for that key pair.
x509-cert = "0.2"
# Reads the PKCS#8 structure `aws-lc-rs` encodes a private key as, to take the PKCS#1
# RSA private key out of it.
pkcs8 = "0.10"
# Writes that PKCS#1 RSA private key as the PEM block `KeyPair$PrivateKey` carries.
pkcs1 = { version = "0.7", features = ["pem"] }

# `TestInvokeAuthorizer` RUNS the custom authorizer the request names, which means
# invoking the authorizer's Lambda function over the in-process callback into this same
# emulator (`state::custom_authorizer`). Built as the SDK's generated client only: no
# network client feature is enabled, so the transport is the emulator's own.
aws-sdk-lambda = { version = "1", default-features = false }
# A token signature is "Base-64-encoded" (`TestInvokeAuthorizer$tokenSignature`), and an
# MQTT password is a blob that travels base-64 in the authorizer's JSON event, so both
# are decoded and encoded with it (`state::custom_authorizer`).
base64 = "0.22"

# The IoT policy-document grammar reads an address condition clause through the maintained
# IP parsers rather than by matching text, the same two `service_common` decides such a
# clause with (`state::policy_document_conditions`).
ipnet = "2"

# `uuid`: the `traceId` one V2 logging entry carries identifies that ENTRY
# (`state::v2_logging::broker_logs`), so it is a version-4 UUID drawn from the maintained
# generator every other minted identifier in this workspace comes from rather than derived from
# the session or the event.
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# Declares one module per `tests/all/<name>.rs` from `tests/all/main.rs`, so a new
# integration-test suite is a new file and nothing lists it.
automod = { workspace = true }
# `tokio::time` drives the tests' wait past a stream's activation transition; `net` and
# `io-util` open the socket a device's own MQTT connection to the published data endpoint is
# spoken over (`tests/all/data_endpoint_mqtt_transport.rs`).
tokio = { workspace = true, features = ["time", "net", "io-util"] }
# A device dials the published data endpoint with TLS as well as in the clear — the two
# halves of that one address: `rustls` / `tokio-rustls` run the CLIENT side of the handshake
# the core terminates, in process. TEST-ONLY.
rustls = { workspace = true }
tokio-rustls = "0.26"
# Amazon SQS, mounted beside IoT on one engine, so an `sqs` rule action's send is observed
# where a client observes it: as a body that queue's own `ReceiveMessage` serves.
service-com-amazonaws-sqs-amazonsqs = { workspace = true }
# The rules-engine tests observe a rule's action where a client observes it, so the
# services a `kinesis` action reaches are mounted beside IoT on one engine: the data plane
# a message is published through, the stream the record is written to, and the IAM store
# the action's role lives in.
service-com-amazonaws-iotdataplane-iotmoonrakerservice = { workspace = true }
service-com-amazonaws-kinesis-kinesis-20131202 = { workspace = true }
# The Amazon S3 service, mounted beside IoT on one engine so the input file a bulk thing
# provisioning task names is an object staged with `PutObject`.
service-com-amazonaws-s3-amazons3 = { workspace = true }
# The AWS Lambda service, mounted beside IoT on one engine — exactly as the assembled
# emulator mounts them — because `TestInvokeAuthorizer` runs the authorizer by calling a
# function that service holds.
service-com-amazonaws-lambda-awsgirapiservice = { workspace = true }
# An authorizer function's deployment package is a .zip archive, and its handler module is
# one entry in it.
zip = { version = "9", default-features = false, features = ["deflate"] }
# The CA certificates the `RegisterCACertificate` suite registers: a caller's own
# certificate authority is the input that operation takes, so the suite mints real ones
# (and real end-entity certificates, to pin what it refuses) with the generator this tree
# already uses for certificate material.
rcgen = "0.13"

[lints]
workspace = true
