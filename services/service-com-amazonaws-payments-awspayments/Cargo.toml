[package]
name = "service-com-amazonaws-payments-awspayments"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Exact decimal arithmetic for the account balances this service adds up — the same
# arbitrary-precision library the emulator's other exact-numeric engines use.
bigdecimal = "0.4"
# `page_tokens`: the one way the emulator's services tell a continuation token they
# ISSUED from one a caller built, which is what the three paginated listings here
# resume a page from.
service-common = { path = "../common" }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
automod = { workspace = true }

[lints]
workspace = true
