[package]
name = "service-com-amazonaws-groundstation-groundstation"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
# `service-common` carries the ONE reading that lets an `@httpQuery` timestamp bind in
# every form the wire names an instant in (`query_timestamps`), which
# `ListGroundStationReservations`' window needs — see `src/service.rs`.
service-common = { path = "../common" }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Digests the per-process seed, the mint counter and the clock into the 16 bytes of a
# `Uuid`-shaped id (see `state::new_uuid`); `hex` renders them.
sha2 = { workspace = true }
hex = { workspace = true }
# Amazon S3 client an `s3RecordingConfig`'s `bucketArn` is resolved through: Ground
# Station reads the recording bucket before it will store the config, and S3 is called
# over the in-process callback into this same emulator (no network client feature is
# enabled: the transport is the emulator's own).
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
# Calendar arithmetic for `GetMinuteUsage`: the first instant of a requested month, and of
# the next one, in the proleptic Gregorian calendar (month lengths and the leap rule).
chrono = { version = "0.4", default-features = false, features = ["std"] }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# The s3-recording suite mounts the S3 service beside Ground Station on one engine,
# because CreateConfig resolves an `s3RecordingConfig`'s bucket by calling S3 in process.
service-com-amazonaws-s3-amazons3 = { workspace = true }

[lints]
workspace = true
