[package]
name = "service-com-amazonaws-opensearchserverless-opensearchserverless"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Hex codec for the opaque `nextToken` page cursor.
hex = { workspace = true }
# Spreads the seed behind a minted `CollectionId` and `PolicyVersion`
# (see `state::random_bytes`).
sha2 = { workspace = true }
# The version-5 (name-based) UUID an index of a collection's data plane reports as
# its `uuid` (`service::collection_rest`): derived from the index's own ARN and
# name, so the maintained crate states the UUID form rather than this crate.
uuid = { version = "1", features = ["v5"] }
# `data_plane_addressing`: the ONE reading of how a client ADDRESSES an emulated
# service's data plane — the reserved path namespace, the host a request addressed
# and the host without its port — which the collection REST data plane
# (`service::collection_rest`) resolves a request by rather than re-implementing.
# Declared as a path dependency, the way the other consumers do.
service-common = { path = "../common" }
# The AWS SDK for EC2, driven over the in-process callback
# (`OperationContext::callback`): a VPC and a subnet are EC2's resources, so a managed
# VPC endpoint's placement is resolved against EC2 (`src/state/ec2_network.rs`) before
# an endpoint is minted. Only the generated client is needed — the emulator supplies
# the transport.
aws-sdk-ec2 = { version = "1", default-features = false }
# The account's own identity records, which is what a data access policy's `Principal`
# names: the collection data plane resolves the access key id a request signed with to the
# IAM user that holds it, or to the role session this emulator's STS minted it for
# (`src/service/collection_rest/authorization.rs`). Each service's OWN accessor is called,
# so this plane reads the very records `iam:CreateAccessKey` and `sts:AssumeRole` wrote.
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
service-com-amazonaws-sts-awssecuritytokenservicev20110615 = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[lints]
workspace = true
