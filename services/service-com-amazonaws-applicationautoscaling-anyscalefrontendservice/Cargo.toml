[package]
name = "service-com-amazonaws-applicationautoscaling-anyscalefrontendservice"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
# The value a constraint-violation message echoes is the one the caller submitted,
# including a list-valued member the framework's walk can only summarise as a count.
service-common = { path = "../common" }
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true, features = ["time", "rt"] }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Derives the stable opaque id inside a minted ARN from the resource's identity.
sha2 = { workspace = true }
# Renders that digest, and the opaque `NextToken` payload, as printable text.
hex = { workspace = true }
# A target-tracking policy's CloudWatch alarms are created in the CloudWatch
# emulator's own alarm store, a scalable target resolves the DynamoDB table or
# index it names in the DynamoDB emulator's own table store, and executing a
# scaling policy moves the ECS service's desired count in the ECS emulator's own
# service store: all are reached through the shared engine, which needs the
# owning service's state TYPE.
service-com-amazonaws-cloudwatch-graniteserviceversion20100801 = { workspace = true }
service-com-amazonaws-dynamodb-dynamodb-20120810 = { workspace = true }
service-com-amazonaws-ecs-amazonec2containerservicev20141113 = { workspace = true }
# Registering a scalable target in a namespace creates that namespace's service-linked
# role in the IAM emulator's own role store, which needs IAM's state TYPE and the
# helpers that spell a service-linked role's path, trust policy and ARN.
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
# Whether IAM lets a request perform the action it names is decided against the calling
# principal's own policies, which needs the principal the credential speaks for (AWS STS's
# own session store) beside the documents in force on it.
service-com-amazonaws-sts-awssecuritytokenservicev20110615 = { workspace = true }
# Parses the `cron(...)` schedule a scheduled action carries (and `chrono`, which it
# is built on, parses an `at(...)` expression's date and time).
cron = "0.15"
chrono = { version = "0.4", default-features = false, features = ["std"] }
# Resolves the IANA time zone a scheduled action names, so its `at`/`cron` expression is
# read in that zone rather than only in UTC.
chrono-tz = { version = "0.10", default-features = false, features = ["std"] }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# `base64`: an instance's user data is base64 on the wire ("user data must be base64-encoded",
# `RunInstancesRequest$UserData`), so the launch the metric-driven scenario suite makes encodes
# the container agent's configuration the way a client's launch carries it.
base64 = "0.22"
# Amazon EC2, for the capacity an ECS cluster is given by LAUNCHING an instance into it: the
# metric-driven scenario suite launches that instance through Amazon EC2's own API on the same
# engine, because an instance is that service's resource. A DEV dependency: nothing in `src/`
# reads Amazon EC2's state — the ECS store answers what capacity a cluster holds.
service-com-amazonaws-ec2-amazonec2 = { workspace = true }
# Amazon Keyspaces, for the `cassandra` scalable target whose TABLE lives there: a
# registration resolves that table by calling the owning service, so the suite that pins
# that rule mounts it beside this service on one engine. A DEV dependency, because the
# resolution is made over the wire rather than against that crate's state type — Amazon
# Keyspaces' own auto scaling is implemented on top of this service, so its crate already
# depends on this one.
service-com-amazonaws-keyspaces-keyspacesservice = { workspace = true }
# AWS Lambda, for the `lambda` scalable target whose function VERSION OR ALIAS lives there:
# a registration resolves that qualifier by calling the owning service, so the suite that
# pins that rule mounts it beside this service on one engine. A DEV dependency for the same
# reason as Amazon Keyspaces above — the resolution is a call, not a read of that crate's
# state type.
service-com-amazonaws-lambda-awsgirapiservice = { workspace = true }
# Amazon API Gateway, for the `custom-resource` scalable target that IS an endpoint: the
# contract's GET and PATCH are invoked on a deployed REST API stage, so the suite that pins
# the reachability precondition stands that endpoint up through API Gateway's own API on the
# same engine. A DEV dependency: nothing in `src/` reads its state — the endpoint is reached
# over the wire, at the address the resource id names.
service-com-amazonaws-apigateway-backplanecontrolservice = { workspace = true }

[lints]
workspace = true
