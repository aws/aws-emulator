[package]
name = "service-com-amazonaws-redshiftdata-redshiftdata"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true, features = ["time", "rt", "sync"] }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
hex = { workspace = true }
# The SQL engine the Data API runs submitted statements on, in-process.
#
# MEMORY-SAFETY POSTURE (SR-MEM-001): the rationale, the bounds and the
# alternatives considered are recorded in this crate's README.md, section "The
# SQL engine, and its memory-safety posture". In short: this crate itself keeps
# `#![forbid(unsafe_code)]` and contains no `unsafe`; the native component the
# `bundled` feature links is the SAME engine the workspace already links through
# `vendor/emulator-telemetry` (`rusqlite` 0.41, `bundled`), so no new native
# library enters the emulator process.
#
# CAPABILITY: this is an EXECUTION SUBSTRATE — it compiles caller-supplied text
# into instructions and runs them — and a NATIVE component: the `bundled`
# feature makes libsqlite3-sys compile the SQLite C amalgamation on the
# builder's machine at build time and link it in. The host-filesystem escapes it
# re-opens (`ATTACH DATABASE '<path>'`, `VACUUM INTO '<path>'`, a `PRAGMA` that
# re-enables a switch, extension loading, a virtual-table module) are all closed
# in `Database::open` in src/state.rs, before any request reaches the engine:
# default-deny authorizer, `SQLITE_LIMIT_ATTACHED = 0`, defensive mode,
# untrusted schema, no URI filenames, `temp_store = MEMORY`, `max_page_count`,
# plus length, column, depth and compound-select limits. `limits` and `hooks`
# are the features those controls need; `functions` is what registers the
# Redshift functions this engine does not carry (`src/state/functions.rs`) as
# Rust implementations on the connection, adding no native component;
# `load_extension` is deliberately absent.
#
# `backup` is the engine's own page-level copy between two OPEN connections
# (`sqlite3_backup_*`). It is what `state::capture_warehouse` /
# `state::restore_warehouse` take and write back a Redshift Serverless snapshot of
# a warehouse's databases with: both ends are in-memory databases this crate
# opened through `Database::open`, so the copy names no path and opens no file —
# unlike `VACUUM INTO`, which the authorizer denies for exactly that reason.
#
# PINNED at 0.41, the release reviewed and built here: it is the first one whose
# `libsqlite3-sys` (0.39) carries a SQLite C library without RUSTSEC-2026-0459 (a
# page-cache disclosure through an undersized-page WAL file, fixed in SQLite
# 3.54.0), which 0.37's `libsqlite3-sys` 0.35 shipped. The two components 0.41
# adds — `sqlite-wasm-rs` and its `rsqlite-vfs` — are gated to `wasm32` upstream
# and are not linked into a host build, so the engine in the process is still one
# bundled SQLite. The linked release is asserted against that floor by the
# engine-release suite of `services/service-com-amazonaws-rdsdata-rdsdataservice`.
rusqlite = { version = "0.41", features = ["backup", "bundled", "column_decltype", "functions", "hooks", "limits"] }
# `ops::get_statement_result_v2`: the CSV form of a statement's result is
# WRITTEN by this CSV writer, so the separator, the quoting of a value carrying a
# comma, a quote or a newline, and the line terminator are a CSV
# implementation's rather than this service's own rendering.
csv = "1.4"
# Mints the `UUID`-shaped statement, query and session identifiers.
uuid = { version = "1", features = ["v4"] }
# `state::redshift_sql`: the dialect-aware SQL parser this service reads a
# submitted statement with. `state::sql_parameters` reads which named
# placeholders a statement references off its TOKENS, so a `:name` inside a
# string literal or a comment, a `::` cast and a real placeholder are told apart
# by the SQL grammar rather than by a text scan; `state::redshift_sql` reads the
# whole statement, so a Redshift construct the engine spells differently is
# re-spelled from the parsed statement and never by rewriting text. `visitor` is
# the feature that walk needs.
sqlparser = { version = "0.59", features = ["visitor"] }
# `state::functions`: the hash functions Amazon Redshift's `MD5`, `SHA`/`SHA1`
# and `SHA2` compute, which the SQL engine does not carry. Real implementations,
# so a statement hashing a value gets that value's hash.
md-5 = "0.10"
sha1 = "0.10"
sha2 = { workspace = true }
# `state::warehouse`: the clients this service resolves a statement's compute
# target through, over the in-process callback into this same emulator (no network
# client feature is enabled: the transport is the emulator's own). A provisioned
# cluster is a resource of Amazon Redshift and a serverless workgroup one of
# Amazon Redshift Serverless, so whether the endpoint a statement names exists is
# a question only those services can answer.
aws-sdk-redshift = { version = "1", default-features = false }
aws-sdk-redshiftserverless = { version = "1", default-features = false }
# `state::statement_events`: the EventBridge client a statement's status change is
# published with, over the same in-process callback as the clients above. A submit
# carrying `WithEvent` asks to be told how its statement ended through the
# account's default event bus.
aws-sdk-eventbridge = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
# `Service::override_refusal`: the wording AWS states a boundary constraint
# refusal with on the JSON protocols, which every service on one shares. Also
# the ONE evaluation of an IAM policy document in this tree, which decides
# whether the role a `COPY` or an `UNLOAD` names may read or write the Amazon S3
# objects it names (`state::object_store`).
service-common = { path = "../common" }
# The data plane a Redshift statement reaches BEYOND its own database, each
# service reached through its OWN store on this one shared engine — the store
# that service's own operations read and write, so an object a caller staged
# with `PutObject` is the object a `COPY` loads and an object an `UNLOAD` wrote
# is the one `GetObject` serves (`state::data_plane`):
#
# * Amazon S3 holds the objects `COPY` reads, `UNLOAD` writes and a Spectrum
#   external table serves;
# * IAM holds the role a load or an export names and the policies that decide
#   what it may do under it;
# * the AWS Glue Data Catalog holds the external databases a `CREATE EXTERNAL
#   SCHEMA` binds to and the tables they define.
#
# No SQL type crosses into those crates: what is read is their own state.
service-com-amazonaws-s3-amazons3 = { workspace = true }
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
service-com-amazonaws-glue-awsglue = { workspace = true }
# `state::system_tables` renders the timestamps a system table reports, and
# `state::copy_load` reads the date and timestamp formats a load accepts, in
# this date and time library rather than in a hand-written civil-calendar
# conversion.
chrono = { version = "0.4", default-features = false, features = ["std"] }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
hex = { workspace = true }
# The awsQuery requests the data-plane suites make — Amazon Redshift's parameter
# groups and reboots, IAM's roles and policies — carry form-encoded values, which
# this percent-encoding implementation writes rather than a hand-rolled escape.
percent-encoding = "2"
# The Data API tests mount the two Redshift control planes beside this service on
# one engine, because the cluster and the workgroup a statement runs on are THEIR
# resources: the suites create them there and then submit statements here.
service-com-amazonaws-redshift-redshiftserviceversion20121201 = { workspace = true }
service-com-amazonaws-redshiftserverless-redshiftserverless = { workspace = true }
# EventBridge and SQS are mounted beside this service on one engine — the way the
# assembled emulator runs them — so a statement's published status change travels
# the real bus to a real SQS target, which is where the event suite observes it.
service-com-amazonaws-eventbridge-awsevents = { workspace = true }
service-com-amazonaws-sqs-amazonsqs = { workspace = true }

[lints]
workspace = true
