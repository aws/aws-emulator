[package]
name = "service-com-amazonaws-cloudtrail-cloudtrail-20131101"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
# `service-common` carries three readers this crate needs.
# `rpc_target`: the one reading of an `awsJson` `X-Amz-Target` — which service and which
# operation it names — which this service's routing seams read because its published
# target prefix is the fully qualified Coral name and so carries dots of its own.
# `arn`: the ONE parse of a caller-supplied resource ARN (the six fields, the vendor,
# the resource type and the id of a resource of that type), which every tagging call
# reads its `ResourceId` through and which the resource-policy operations read their
# `ResourceArn` through.
# `management_events`: the account's management-event (audit) log, shared with every
# service whose calls CloudTrail records and reports through `LookupEvents`.
service-common = { path = "../common" }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Parses the SQL of a CloudTrail Lake `QueryStatement` — the one a dashboard
# widget carries and the one `StartQuery` runs — so a query CloudTrail Lake
# cannot run is refused by a real SQL parser rather than by matching text or by
# a hand-written subset of the language. Both read it through
# `src/state/widget_query.rs`: the crate's default `recursive-protection` is the
# crate's own guard against a deeply nested statement exhausting the thread's
# stack (that module bounds the statement before parsing it as well), and
# `visitor` is what lets it report the RELATIONS the parser found, which is how
# `StartQuery` resolves the event data store a run reads.
sqlparser = { version = "0.59", features = ["visitor"] }
# Mints the event data store id that is the suffix of its ARN, the modelled `UUID`
# import id `StartImport` hands back and the `QueryId` `StartQuery` returns for a new
# query run (36 characters of `^[a-f0-9\-]+$`): a v4 UUID, the form CloudTrail Lake
# uses.
uuid = { version = "1", features = ["v4"] }
# Hex-codes the opaque `ListChannels` pagination token (`src/ops/list_channels.rs`), the
# opaque `LookupEvents` one (`src/ops/lookup_events.rs`), which it also reads back, and
# the one `ListEventDataStores` issues through the shared `state::page_token` reader.
hex = { workspace = true }
# The account's S3 BUCKETS: a trail delivers its log files into one, so `CreateTrail`
# and `UpdateTrail` resolve the destination `S3BucketName` in the one object store
# (`state::destination_bucket_exists`) rather than in a copy of it here, and read that
# bucket's POLICY there to decide whether CloudTrail may write the trail's log files
# (`state::referenced_resources`).
service-com-amazonaws-s3-amazons3 = { workspace = true }
# The account's SNS TOPICS: a trail notifies log-file delivery to one, so the topic's
# access policy is read in the one Amazon SNS store (`state::referenced_resources`).
service-com-amazonaws-sns-amazonsimplenotificationservice = { workspace = true }
# The account's KMS KEYS: a trail encrypts its log files under one, so a `KmsKeyId` is
# resolved in the one KMS store (`state::referenced_resources`).
service-com-amazonaws-kms-trentservice = { workspace = true }
# The account's CloudWatch Logs LOG GROUPS: a trail may also deliver to one, so a
# `CloudWatchLogsLogGroupArn` is resolved in the one CloudWatch Logs store
# (`state::referenced_resources`).
service-com-amazonaws-cloudwatchlogs-logs-20140328 = { workspace = true }
# The account's IDENTITY-BASED POLICY documents and permissions boundaries: the
# authorization decision every request to this service is judged by
# (`src/service/authorization.rs`) reads them through IAM's own accessors, so a document
# `iam:PutUserPolicy` wrote decides the next call. No cycle: that crate depends on no
# service crate.
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
# The session registry in that same shared engine, which is where `sts:GetCallerIdentity`
# answers from: that decision resolves the principal a request's credential speaks for —
# and the session policies its mint scoped it with — through STS's OWN resolution rather
# than guessing it (`src/service/authorization.rs`). No cycle: that crate does not depend
# on this one.
service-com-amazonaws-sts-awssecuritytokenservicev20110615 = { workspace = true }
# Writes the DER PKCS#1 `RSAPublicKey` body a digest-signing public key is reported as
# (`ListPublicKeys`, `PublicKey$Value`: "The DER encoded public key value in PKCS#1
# format"), so that structure comes from an ASN.1 crate rather than from hand-written DER.
# `alloc` is what carries the DER WRITER (`to_der`), and it is the only feature asked for:
# `pem` is left off because the member is DER, not PEM, and nothing here reads or writes a
# private key.
pkcs1 = { version = "0.7", default-features = false, features = ["alloc"] }
# The MD5 digest a public key's `Fingerprint` is, over that DER body.
md-5 = "0.10"
# Derives the bits of the per-Region, per-period digest-signing keys `ListPublicKeys`
# reports, so the same Region and period always answer the same key.
sha2 = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# Reads the base64 an `awsJson1_1` body carries a blob member in, so a suite can decode the
# DER public key `ListPublicKeys` reported and parse it back.
base64 = "0.22"
# Lists and READS the log files a logging trail delivered, through Amazon S3's own API over
# the in-process callback: a delivered object counts only if the object store answers with
# it. Only the generated client is needed — the emulator supplies the transport.
aws-sdk-s3 = { version = "1", default-features = false }
# Gunzips a delivered log file, which is a gzip stream.
flate2 = "1"
# Serves calls of ANOTHER service of the account beside this one, so a suite can assert that
# a logging trail delivers the records of every service's management calls and not only of
# CloudTrail's own (`tests/all/trail_log_file_delivery_of_other_services.rs`).
service-com-amazonaws-sfn-awsstepfunctions = { workspace = true }
# Serves the identity DATA PLANE beside this one, so a suite can assert what a trail whose
# advanced selector names the `Data` category delivers for a call on the CONTENTS of a
# resource (`tests/all/trail_log_file_delivery_of_data_events.rs`).
service-com-amazonaws-cognitoidentity-awscognitoidentityservice = { workspace = true }

[lints]
workspace = true
