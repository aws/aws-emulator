[package]
name = "service-com-amazonaws-bedrockagentcore-amazonbedrockagentcore"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
# The shared request-claim rule for a SigV4 signing name several services share, and the
# tree's one base64url coding of a compact-JWS segment.
service-common = { path = "../common" }
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
# `tokio` beyond the workspace's own features: `InvokeCodeInterpreter` runs a script on
# the blocking pool (`rt`), bounds how many run at once with a `sync` semaphore, and
# bounds the wait for one of those slots with `time`.
tokio = { workspace = true, features = ["sync", "time"] }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
# `regex`: runs a modelled `@pattern` against a value the request boundary's own walk does
# not reach (a map's key, a leaf inside a map entry's value) — see
# `src/service/map_entry_constraints.rs`.
regex = "1.13"
tracing = { workspace = true }
# `rquickjs`: the QuickJS JavaScript engine, embedded in this process, which is what
# actually RUNS the JavaScript a caller submits to `InvokeCodeInterpreter`'s
# `executeCode` tool — nothing about a run is synthesized. Default features only: the
# `dyn-load` feature (native module loading) is deliberately NOT enabled, and no
# module loader is installed on this runtime at all, so a submitted script can import
# nothing, and plain QuickJS exposes no filesystem, process or socket API. (The
# `loader` feature is compiled in the workspace build because the Lambda emulator's
# own engine resolves a deployment package's modules through it; a feature being
# compiled installs nothing here.) Each run is bounded by a memory limit, a stack
# limit, an interrupt deadline and an output cap, on a blocking thread — see
# `src/ops/invoke_code_interpreter.rs`.
#
# It is also a NATIVE component: `rquickjs-sys` compiles the QuickJS C sources with
# `cc` at build time, on the builder's machine and with the builder's authority, and
# that C is outside this crate's `#![forbid(unsafe_code)]`. The version is pinned and
# resolves with a checksum in Cargo.lock, so the engine every user runs is the one
# reviewed here. One version is pinned for the whole workspace, so the binary carries
# a single QuickJS.
rquickjs = "0.14"
# Two things this crate RUNS caller-supplied Python for need a contained interpreter, and
# this crate adds NO execution substrate of its own for either: the PYTHON half of the code
# interpreter's `executeCode`, which runs the program a caller submits, and
# `InvokeAgentRuntime`, which runs the code an agent runtime was DEPLOYED from. Both drive
# the ONE contained interpreter this workspace already holds
# (`state::execution::python` of the crate below), exactly as the Amazon EMR notebook and
# Spark-step planes do: one interpreter per run, built with its host-reaching surface
# compiled out, its native modules narrowed to an allow-list, its `posix` that crate's own
# with every host-reaching call refused, and the deadline, step, memory, recursion and
# output bounds enforced in host code the caller's program cannot reach. What this crate
# supplies on a run's import path is ordinary Python of its own: the kernel a submitted
# program runs in with the session workspace it reads and writes
# (`state::code_interpreter_python`), and the AgentCore runtime contract an invocation is
# delivered through (`state::agent_runtime_run`). The only filesystem either run sees is an
# in-memory one, and neither is given a seam to dispatch an AWS call on.
service-com-amazonaws-lambda-awsgirapiservice = { workspace = true }
# `png`: encodes a browser session's viewport as the PNG image `InvokeBrowser`'s
# `screenshot` action answers with — the one format `ScreenshotFormat` declares — so the
# image is a real PNG of the session's own dimensions rather than bytes shaped like one.
png = "0.18"
# The AgentCore CONTROL plane, whose store owns the browsers a browser session is
# started on: `StartBrowserSession` names one it did not create, so the data plane
# resolves the `browserIdentifier` against the component that owns it rather than
# taking a session's existence on trust (src/state/browser.rs). Its store also owns the
# account's token vault, so `GetResourceApiKey` resolves the credential provider it
# names against it (src/state/resource_api_keys.rs).
service-com-amazonaws-bedrockagentcorecontrol-amazonbedrockagentcorecontrol = { workspace = true }
# `aws-sdk-secretsmanager`: an API key credential provider keeps its key in a Secrets
# Manager secret rather than in either AgentCore plane's store, so `GetResourceApiKey`
# reads the key out of the service that holds it, through the in-process callback into
# this same emulator (src/state/resource_api_keys.rs). Default features only — the SDK's
# own TLS and DNS stacks are never used, because the transport is the callback's.
aws-sdk-secretsmanager = { version = "1", default-features = false }
# The two stores the identity plane's authorization gate reads
# (`src/state/authorization.rs`): every operation models `AccessDeniedException`, and a
# workload access token is scoped to ONE workload identity, so a mint decides whether IAM
# lets the caller obtain a token for the identity it named — the SESSION a credential speaks
# for lives in STS's store while the POLICIES in force on that principal live in IAM's. Only
# their `state` accessors are used; the DECISION itself, and the wording of its refusal, are
# `service-common`'s one shared evaluation.
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
service-com-amazonaws-sts-awssecuritytokenservicev20110615 = { workspace = true }
# Amazon CloudWatch, whose metric store is the ONE home of every series this emulator
# publishes: the built-in tools report how many sessions a caller holds open as the
# `AWS/Bedrock-AgentCore` `ActiveSessionCount` gauge, and a reader of that gauge
# (`ListMetrics`, `GetMetricStatistics`, an alarm) reads CloudWatch's own store, so the
# samples are appended there rather than kept in a copy of this plane's own
# (src/state/session_metrics.rs). Only its `state` accessor is used.
service-com-amazonaws-cloudwatch-graniteserviceversion20100801 = { workspace = true }
# Amazon Bedrock Runtime, which is where this emulator's INFERENCE lives: `InvokeHarness`
# serves one turn of a managed agent loop, and no language model runs in this emulator, so
# the text, the token counts and the stop reason of that turn come from that plane's own
# generation stage (`emulated_completion`) and tokenizer rather than from a second copy of
# either here (src/state/harness_invocation.rs). The sibling Bedrock Agent Runtime
# emulator's `InvokeAgent` reaches it the same way. Only its `state` accessors are used.
service-com-amazonaws-bedrockruntime-amazonbedrockfrontendservice = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# Declares one module per `tests/all/<name>.rs`, so a new suite is picked up by being
# there rather than by a hand-kept list.
automod = { workspace = true }
# Writes the .zip an agent runtime's code artifact is normally stored as, so the test that
# pins how a deployment's modules are read drives a REAL archive rather than bytes that
# happen to pass. `deflate` is the compression a .zip entry carries; nothing else is needed.
zip = { version = "9", default-features = false, features = ["deflate"] }
sha2 = { workspace = true }
hex = { workspace = true }
# IAM and the token service, mounted beside this one in the test harness: the policies a
# token mint is authorized against are IAM's, and the identity a credential speaks for is
# STS's, so the gate is driven end to end against the services that own them. They are also
# normal dependencies of this crate (the gate reads their stores); this entry only states
# that the harness mounts them.
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
service-com-amazonaws-sts-awssecuritytokenservicev20110615 = { workspace = true }
# Percent-encodes an `@httpLabel` / `@httpQuery` value the way an AWS SDK does, so the
# test harness never hand-rolls RFC 3986 escaping.
percent-encoding = "2.3"
# Decodes one `application/vnd.amazon.eventstream` frame, so a test reads
# `InvokeCodeInterpreter`'s response the way an SDK's event-stream decoder does.
aws-smithy-eventstream = "0.60"

[lints]
workspace = true
