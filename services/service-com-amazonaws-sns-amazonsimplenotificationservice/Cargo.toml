[package]
name = "service-com-amazonaws-sns-amazonsimplenotificationservice"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
# `time`: a delivery the subscribed endpoint could not take YET is retried along the phases
# SNS's own delivery policy publishes, which wait between attempts
# (`ops::publish::Endpoints::deliver`).
tokio = { workspace = true, features = ["time"] }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
# The policy and delivery-policy documents SNS answers with are serialized from typed
# structs, so their members keep SNS's own order rather than being sorted by key.
serde = { workspace = true }
tracing = { workspace = true }
# The content-based MessageDeduplicationId of a FIFO publish is a SHA-256 of the body,
# and the message/subscription ids are formatted from a SHA-256 digest.
sha2 = { workspace = true }
hex = { workspace = true }
# The `messageMD5Sum` a delivery-status record reports for the published message is the MD5
# digest of its body (`state::delivery_status`).
md-5 = "0.10"
# `arn`: the ONE parse of a caller-supplied resource ARN, shared with every other service —
# a subscription's SQS endpoint ARN is read through it rather than split here. It also carries
# the ONE evaluation of IAM policy documents, which authorizes a call against the caller's
# identity policies and the topic's own access policy (`state::authorization`).
service-common = { path = "../common" }
# The IAM store the calling principal and its identity-based policies are read from, through
# IAM's own accessors: that service owns the collection rule, so this one sees exactly what
# IAM's own authorizer sees (`state::authorization`).
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
# The KMS store the key a SUBSCRIBED QUEUE is encrypted with lives in, reached through KMS's
# own authorization module: a delivery to such a queue has a data key generated under that
# key for this service, so the key's own policy decides it
# (`ops::publish::queue_encryption`).
service-com-amazonaws-kms-trentservice = { workspace = true }
# The AWS SDK for SQS, driven over the in-process callback
# (`OperationContext::callback`): `Publish` delivers a message to the queues subscribed to
# the topic with `SendMessage` (`ops::publish::deliver_to_endpoints`). Only the generated
# client is needed — the emulator supplies the transport, so the SDK's own HTTPS stack and
# runtime are left out.
aws-sdk-sqs = { version = "1", default-features = false }
# The AWS SDK for Lambda, driven over the same in-process callback: a subscription whose
# protocol is `lambda` has a function for an endpoint, which `Publish` invokes
# asynchronously and whose resource-based policy it reads first
# (`ops::publish::function_delivery`).
aws-sdk-lambda = { version = "1", default-features = false }
# The AWS SDK for CloudWatch Logs, over the same callback: a topic carrying
# `<Protocol>{Success,Failure}FeedbackRoleArn` writes one delivery-status record per
# delivery into `sns/<region>/<account-id>/<topic-name>` (`state::delivery_status`).
aws-sdk-cloudwatchlogs = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
# `aws-types`: the request id an endpoint's own service answered with, which a
# delivery-status record reports as that provider's answer (`ops::publish`).
aws-types = { version = "1", default-features = false }
# The `cidr` matcher of a subscription's filter policy asks whether an address lies in a
# network, which this parses rather than splitting the text by hand
# (`state::message_filter`).
ipnet = "2"
# The RSA key a delivered notification is signed with, and the signature itself
# (`state::notification_signature`).
aws-lc-rs = "1"
# The self-signed X.509 certificate published at the notification's SigningCertURL, minted
# over that RSA key (`state::notification_signature`).
rcgen = "0.13"
# The DER container rcgen takes that RSA private key in.
rustls-pki-types = "1"
# The modular exponentiation of the RSASSA-PKCS1-v1_5 signature (`state::notification_signature`).
num-bigint = "0.4"
# Reads the PKCS#8 structure aws-lc-rs encodes the key as, for its modulus and private
# exponent.
pkcs1 = "0.7"
pkcs8 = "0.10"
# The validity window rcgen stamps on that certificate, converted from `SystemTime`.
time = { version = "0.3", default-features = false, features = ["std"] }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# SQS is mounted beside SNS on one engine in the subscription-delivery tests, because an
# `sqs` subscription's endpoint is a queue and a delivery is asserted where a client sees
# it: on the queue.
service-com-amazonaws-sqs-amazonsqs = { workspace = true }
# Lambda is mounted beside SNS on one engine in the lambda-subscription delivery tests,
# because a `lambda` subscription's endpoint is a function and an invocation is observed
# where that service holds it: on the function's asynchronous queue, and in what the
# function's own handler did.
service-com-amazonaws-lambda-awsgirapiservice = { workspace = true }
# The CloudWatch Logs store a delivery-status record is read back from. (The IAM store the
# feedback role is resolved in, and the principals an authorization test creates, is a
# dependency of this crate itself.)
service-com-amazonaws-cloudwatchlogs-logs-20140328 = { workspace = true }
# STS mints the role-session credential the publish-authorization suite signs with, so the
# session a refusal names is the one `sts:AssumeRole` reported.
service-com-amazonaws-sts-awssecuritytokenservicev20110615 = { workspace = true }
# A deployment package the delivery tests upload is a .zip archive they write in memory, as
# `FunctionCode$ZipFile` carries it: base64 of a .zip.
zip = { version = "9", default-features = false, features = ["deflate"] }
base64 = "0.22"
# `time` on top of the workspace features: a delivery is made after the publishing call is
# answered, and the tests wait that span out rather than parking a thread.
tokio = { workspace = true, features = ["time"] }
# Reads the certificate published at a notification's SigningCertURL, to verify that
# notification's signature against the public key it carries — the check a subscriber makes.
x509-cert = { version = "0.2", features = ["pem"] }

[lints]
workspace = true
