[package]
name = "service-com-amazonaws-codedeploy-codedeploy-20141006"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
# `yaml_nesting`: the shared count of a caller-supplied YAML document's nesting
# indicators, which is what bounds an AppSpec's nesting before a parser is handed
# it (`state::appspec`).
service-common = { path = "../common" }
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true, features = ["time"] }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Identifier minting: ids are cut from a SHA-256 of this store's counter plus a
# per-process seed, rendered as hex.
sha2 = { workspace = true }
hex = { workspace = true }
# A deployment's `alarmConfiguration` is polled against the alarms' own state,
# which lives in the CloudWatch emulator's alarm store: it is reached through the
# shared engine and needs the owning service's state TYPE.
service-com-amazonaws-cloudwatch-graniteserviceversion20100801 = { workspace = true }
# An Lambda deployment SHIFTS TRAFFIC by moving the alias its revision's AppSpec
# names, and that alias lives in the AWS Lambda emulator's own function store:
# the move is written there through the shared engine, which needs the owning
# service's state TYPE (`state::lambda_traffic_shift`).
service-com-amazonaws-lambda-awsgirapiservice = { workspace = true }
# A deployment group's `serviceRoleArn` is resolved against the account's IAM
# records before the group is stored — the trust policy of the very role
# `CreateRole` wrote — which needs the owning service's state TYPE
# (`state::service_role`).
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
# A revision that names an S3 object keeps the deployment's AppSpec in that
# object, so the revision is resolved against Amazon S3's own object store
# through the shared engine, which needs the owning service's state TYPE
# (`state::s3_revision`).
service-com-amazonaws-s3-amazons3 = { workspace = true }
# An Lambda revision IS the AppSpec file, "formatted as JSON or YAML stored as a
# RawString", so the function, alias and versions a deployment shifts are read
# out of it with a maintained YAML 1.2 implementation (YAML 1.2 is a superset of
# JSON, so one parser reads both forms); yaml-rust2 is the pure-Rust one the
# other services that read caller-supplied YAML already use.
yaml-rust2 = { version = "0.10", default-features = false }
# A deployment's lifecycle event hooks are Lambda VALIDATION FUNCTIONS this
# service invokes: the invocation is made over AWS Lambda's own modelled `Invoke`
# through the in-process callback (`state::hook_invocation`).
aws-sdk-lambda = { version = "1", default-features = false }
# A deployment group's `triggerConfigurations` are PUBLISHED to the Amazon SNS
# topics they name, over the in-process callback into this same emulator
# (`state::trigger_notifications`); `default-features = false` keeps the SDK's own
# transport, sleep and credential machinery out, since the callback supplies all
# three.
aws-sdk-sns = { version = "1", default-features = false }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
hex = { workspace = true }
# Writes the .zip deployment package the lifecycle-hook suite uploads for its
# validation function, the way a caller uploads one, and encodes it as the
# `ZipFile` member carries it.
zip = { version = "9", default-features = false, features = ["deflate"] }
base64 = "0.22"
# `time` for the test that waits on a clock-owed deployment transition.
tokio = { workspace = true, features = ["time"] }
# Percent-encodes the query-protocol form fields the IAM fixture in the shared test
# harness sends (`Emulator::iam_query`).
percent-encoding = "2.3"
# A deployment group's triggers publish to Amazon SNS topics, and the queue
# subscribed to such a topic is where the end-to-end suite reads the notification:
# both are mounted beside CodeDeploy on one engine by the shared test harness.
service-com-amazonaws-sns-amazonsimplenotificationservice = { workspace = true }
service-com-amazonaws-sqs-amazonsqs = { workspace = true }

[lints]
workspace = true
