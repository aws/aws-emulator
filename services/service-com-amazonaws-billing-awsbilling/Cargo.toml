[package]
name = "service-com-amazonaws-billing-awsbilling"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
# The caller identity an `AccessDeniedException` message names is STS's own:
# `sts:GetCallerIdentity` and this service must answer with one principal for
# one credential, so the identity is resolved from the STS store (src/state.rs).
service-com-amazonaws-sts-awssecuritytokenservicev20110615 = { workspace = true }
# Whether the caller is an organization's management account is AWS Organizations'
# own fact: `CreateBillingView` is reserved to that identity, so the gate reads the
# organization out of that service's store rather than keeping a copy here
# (src/state.rs).
service-com-amazonaws-organizations-awsorganizationsv20161128 = { workspace = true }
# A billing group is AWS Billing Conductor's own resource, and an account's
# membership of one is what shapes its billing view's data into the PRO_FORMA
# domain and names the group's primary account — so `ListBillingViewSegments`
# reads the membership history out of THAT service's store
# (src/state/account_relationships.rs).
service-com-amazonaws-billingconductor-awsbillingconductor = { workspace = true }
# A custom billing view comes to carry a resource-based policy when the account
# SHARES it, which is AWS Resource Access Manager's action and not an operation this
# service's model declares — so `GetResourcePolicy` derives the document from that
# service's store (src/state/resource_policy.rs).
service-com-amazonaws-ram-amazonresourcesharing = { workspace = true }
# The opaque `nextToken` every paginated read hands out is AUTHENTICATED under a
# per-store secret, so a cut point a caller assembled is refused rather than
# honoured: the workspace's one page-token key (src/state.rs).
service-common = { path = "../common" }
# The promotional credit codes `RedeemCredits` redeems are issued against an AWS
# partner's benefit allocation, so the registry of issued codes — and the terms of
# the promotion each one names — belongs to that service's store, not this one's
# (src/ops/redeem_credits.rs).
service-com-amazonaws-partnercentralbenefits-partnercentralbenefitsservice = { workspace = true }
# Hex-encodes the opaque `nextToken` the list operations hand out
# (ListBillingViews, ListSourceViewsForBillingView).
hex = { workspace = true }
# Calendar-month arithmetic (`Months`/`checked_add_months`, and the epoch-seconds
# constructor): the one-calendar-month width `ListBillingViews` documents for its
# `activeTimeRange` is a civil-calendar span, not a fixed number of days
# (src/state/billing_month.rs).
chrono = { version = "0.4", default-features = false, features = ["std"] }
# Digests the entry selection a `GetBillingPreferences` page was taken under, so
# its `nextToken` is bound to it at a fixed width.
sha2 = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
hex = { workspace = true }
# Declares one module per `tests/all/<name>.rs`, so a new suite is picked up by
# adding the file alone.
automod = { workspace = true }

[lints]
workspace = true
