[package]
name = "service-com-amazonaws-cloudwatchlogs-logs-20140328"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
# `time` beyond the workspace default: the subscription fan-out suite awaits the
# clock-owed CREATING -> ACTIVE span of the Kinesis stream it delivers to with
# `tokio::time::sleep`.
tokio = { workspace = true, features = ["time"] }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Opaque pagination tokens: the cursor payload is hex-encoded so a client only
# round-trips it.
hex = { workspace = true }
# Reads a lookup table's CSV body (`CreateLookupTable$tableBody`) to its header row and
# data rows, as CSV defines quoting and embedded separators.
csv = "1.3"
# Compiles the regular expression a Logs Insights `parse` command carries, so a query
# string that does not compile is refused rather than accepted.
regex = "1.12"
# `chrono`: a query result carries `@timestamp` and `@ingestionTime` as the calendar instant
# each stands for, so the epoch milliseconds a stored event keeps are rendered (and read
# back for ordering) with it.
chrono = { version = "0.4", default-features = false, features = ["std"] }
# `chrono-tz`: a scheduled query states the timezone its schedule expression is evaluated in
# (`ScheduleTimezone`), so the instants a `cron(...)` schedule names are read in that zone.
chrono-tz = { version = "0.10", default-features = false }
# `sqlparser`: the `SELECT` `StartQuery` accepts for the SQL query language is PARSED with
# it, so what `GetQueryResults` runs is the structure of the caller's own statement.
sqlparser = "0.59"
# `cron`: the `cron(...)` half of a scheduled query's `scheduleExpression` is read by this
# maintained parser, so a schedule a write states is judged field by field rather than by
# shape alone.
cron = "0.15"
# An ingested Embedded Metric Format log event publishes its metrics into the CloudWatch
# emulator's own metric store, which is reached through the shared engine and needs the
# owning service's state TYPE.
service-com-amazonaws-cloudwatch-graniteserviceversion20100801 = { workspace = true }
# The GZIP framing a subscription filter's destination is handed the delivered log events
# in ("they are Base64 encoded and compressed with the GZIP format").
flate2 = "1"
# `arn`: the one reading of a caller-supplied resource ARN, used to resolve which service
# and Region a subscription filter's `destinationArn` names.
service-common = { path = "../common" }
# The STS store, for the identity an access key id speaks for: the principal
# `sts:GetCallerIdentity` answers for the credentials a request signed with.
service-com-amazonaws-sts-awssecuritytokenservicev20110615 = { workspace = true }
# The IAM store, for the identity-based policy documents in force on that principal, which
# is what an operation declaring `AccessDeniedException` is decided against.
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
# The AWS SDKs for the services `PutSubscriptionFilter` documents as subscription
# destinations, each driven over the in-process callback
# (`OperationContext::callback`): an ingested log event a filter matches is delivered to
# the Kinesis data stream, Firehose delivery stream or Lambda function its
# `destinationArn` names. Only the generated clients are needed — the emulator supplies
# the transport.
aws-sdk-kinesis = { version = "1", default-features = false }
# Pinned: from 1.127.0 this client requires `aws-smithy-http` 0.64.3, which the
# workspace's signing stack does not resolve to; 1.126.0 is the newest release that builds
# against the `aws-smithy-http` this lock already holds.
aws-sdk-firehose = { version = "=1.126.0", default-features = false }
aws-sdk-lambda = { version = "1", default-features = false }
# `CreateExportTask` resolves the S3 bucket its `destination` names against the object
# store, over the same in-process callback, with the `HeadBucket` this client generates, and
# the task's worker writes the exported log data there with `PutObject`.
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
# A log group's `kmsKeyId` may only be associated when the KEY's own policy lets CloudWatch
# Logs use it for that group, which is read from KMS with the `GetKeyPolicy` this client
# generates, over the same in-process callback.
aws-sdk-kms = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
# `PutDeliverySource` resolves the resource its `resourceArn` names where the owning service
# holds it; for a CloudFront distribution that is the `GetDistribution` this client generates,
# driven over the same in-process callback.
aws-sdk-cloudfront = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
# `CreateImportTask` imports from a CloudTrail Lake event data store, so it resolves the
# source its `importSourceArn` names where CloudTrail holds it, with the `GetEventDataStore`
# this client generates, over the same in-process callback.
aws-sdk-cloudtrail = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
# A syslog configuration ingests through a VPC endpoint, and VPC endpoints are Amazon EC2's
# records: the `vpcEndpointId` a `PutSyslogConfiguration` carries is resolved against that
# service over the same in-process callback, with the `DescribeVpcEndpoints` this client
# generates, so this service keeps no second reading of which endpoints the account has
# (`state::syslog_vpc_endpoint`).
aws-sdk-ec2 = { version = "1", default-features = false }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
# Decodes one `application/vnd.amazon.eventstream` frame, so the live-tail suite reads
# `StartLiveTail`'s response the way an SDK's event-stream decoder does.
aws-smithy-eventstream = "0.60"
# The CloudWatch metric store an ingested log event publishes into, so a test can read
# back the datapoints this service's metric filters extracted. Already a dependency of
# `src/`; an integration test reaches it only through this list.
service-com-amazonaws-cloudwatch-graniteserviceversion20100801 = { workspace = true }
# A subscription filter's Kinesis destination is a REAL stream of the Kinesis emulator, so
# the fan-out suite mounts that service beside this one on the same engine and reads the
# delivered records back off the stream.
service-com-amazonaws-kinesis-kinesis-20131202 = { workspace = true }
# The KEY POLICY a log group's `kmsKeyId` is judged against is one KMS itself holds, so the
# suite about that gate mounts KMS beside this service on the same engine and creates the
# key through it.
service-com-amazonaws-kms-trentservice = { workspace = true }
# An export task's objects are written to a REAL bucket of the object store, so the suite
# about them mounts Amazon S3 beside this service on the same engine and reads the objects
# back through it.
service-com-amazonaws-s3-amazons3 = { workspace = true }
# An import task's SOURCE is a REAL event data store of the CloudTrail emulator, so the suite
# about creating one mounts CloudTrail beside this service on the same engine and creates,
# and deletes, the source through it.
service-com-amazonaws-cloudtrail-cloudtrail-20131101 = { workspace = true }
# A subscription filter's LAMBDA destination is authorised by the function's own resource
# policy, so the suite about that gate mounts AWS Lambda beside this service on the same engine
# and writes the permission through Lambda's OWN `AddPermission`.
service-com-amazonaws-lambda-awsgirapiservice = { workspace = true }
# The VPC endpoint a syslog configuration ingests through is one Amazon EC2 holds, so the
# suite about that gate mounts EC2 beside this service on the same engine and creates every
# endpoint a case names through EC2's OWN API rather than writing one into a store by hand.
service-com-amazonaws-ec2-amazonec2 = { workspace = true }

[lints]
workspace = true
