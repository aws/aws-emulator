[package]
name = "service-com-amazonaws-apigatewayv2-apigatewayv2"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
# The tree's shared service helpers: the ONE caller-supplied-ARN parse
# (`arn::parse_of`), the ONE derived-id mixer (`stable_hex_id`) and the ONE reading of a
# data-plane connection whose encryption is negotiated in band (`in_band_tls`).
service-common = { path = "../common" }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true, features = ["io-util", "sync", "time"] }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
# Hex, for the opaque pagination tokens the paginated readers mint and verify.
hex = { workspace = true }
tracing = { workspace = true }
# The AWS SDK for EC2, driven over the in-process callback
# (`OperationContext::callback`): the subnets a `CreateVpcLink` places a VPC link's network
# interfaces in are EC2's resources, so `src/state/ec2_subnets.rs` asks EC2 what the
# account has rather than deciding it here. Only the generated client is needed — the
# emulator supplies the transport.
aws-sdk-ec2 = { version = "1", default-features = false }
# The AWS SDK for Lambda, driven over the same in-process callback: an `AWS_PROXY` route
# and a `REQUEST` authorizer are answered by the function they name, which lives in the
# Lambda service, so `src/service/invoke/` asks Lambda to run it rather than deciding the
# answer here.
aws-sdk-lambda = { version = "1", default-features = false }
# The AWS SDK for EventBridge, Amazon SQS and Step Functions, driven over the same in-process
# callback: an HTTP api route whose integration names a first-class `IntegrationSubtype`
# performs that AWS service action, which lives in the service that owns it, so
# `src/service/invoke/` calls it there rather than deciding the answer here.
aws-sdk-eventbridge = { version = "1", default-features = false }
aws-sdk-sqs = { version = "1", default-features = false }
aws-sdk-sfn = { version = "1", default-features = false }
# Base64, for the one encoding an HTTP api's proxy event states a payload in when it is not
# text (`isBase64Encoded`), in both directions.
base64 = "0.22"
# The RFC 6455 WebSocket protocol, server side: a WEBSOCKET api's data plane completes the
# opening handshake and frames every message with this maintained implementation over the
# core-owned socket (`src/service/websocket/transport.rs`) rather than with anything
# hand-written. `handshake` only — this crate serves the SERVER half and opens no connection
# of its own, and the core owns TLS.
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
# The `Stream`/`Sink` halves of that socket, so a frame arriving and a frame pushed to the
# connection are awaited together.
futures-util = { version = "0.3", default-features = false }
# The HTTP/1 request parser (the one that WebSocket implementation reads a handshake with):
# a WEBSOCKET api's socket reads the opening handshake's own head before the handshake is
# completed, because the decision it needs — the `$connect` route's integration and the
# authorizer in front of it — is awaited.
httparse = "1"
# The HTTP/1.1 server a WEBSOCKET api's socket answers every request on it that is NOT an
# opening handshake with: that socket is the api's whole `ApiEndpoint`, where the
# `@connections` management API is published too, so an ordinary request made there is
# served by this emulator's own front door (`src/service/websocket/endpoint_http.rs`).
# `hyper-util` carries the tokio IO and timer adapters for it, `http-body-util` the bounded
# body reader and the one-shot body.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
# Matches an `IntegrationResponseKey` written as a regular expression (`/2\d\d/`), which is
# how a WebSocket integration's responses are selected by the status a call produced.
regex = "1"
# The URL reader two caller-supplied values of this control plane are held to: a CORS
# configuration's allowed ORIGIN (`Cors$AllowOrigins`, the `scheme://host[:port]` RFC 6454
# serializes) and a JWT authorizer's ISSUER (the https URL an OpenID discovery document is
# published under). Both are URLs a caller sends, so they are read by this maintained parser
# rather than by splitting the text here.
url = "2"
# The ONE renderer of an API Gateway mapping template ("a map of Velocity templates",
# `Integration$RequestTemplates`): a WEBSOCKET api's MOCK integration carries the same
# `TemplateMap` values the REST data plane renders, so this crate drives that renderer
# rather than keeping a second copy of the language's rules
# (`service::mapping_template::rendered_without_directives`).
service-com-amazonaws-apigateway-backplanecontrolservice = { workspace = true }
# The WebSocket CONNECTION REGISTRY the `@connections` management API serves: a connection
# this api's socket carries is registered there with the channel that makes a
# `PostToConnection` a real delivery, which is the seam that crate's state documents for the
# data plane of the api that owns the connection.
service-com-amazonaws-apigatewaymanagementapi-apigatewaymanagementapi = { workspace = true }
# The two stores the authorization gate reads (`src/service/authorization.rs`): the operations
# whose model declares `AccessDeniedException` decide whether IAM lets the caller perform the
# action, and the SESSION a credential speaks for lives in STS's store while the POLICIES in
# force on that principal live in IAM's. Only their `state` accessors are used; the DECISION
# itself is `service-common`'s one shared evaluation.
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
service-com-amazonaws-sts-awssecuritytokenservicev20110615 = { workspace = true }
# The CloudWatch METRIC STORE the series a stage publishes land in (`src/service/metrics.rs`,
# which owns the namespace and the one appender; the per-request series of an HTTP api's stage
# are `src/service/invoke/request_metrics.rs` and the per-call series of a WEBSOCKET api's
# stage are `src/service/websocket/transport.rs`): the counters and measurements of the calls a
# deployed stage answered go into the one store `ListMetrics` and `GetMetricStatistics` read, so
# a metric has one home. They never travel over `PutMetricData`, which refuses a publish into a
# namespace the services own.
service-com-amazonaws-cloudwatch-graniteserviceversion20100801 = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
# The client half of the test harness's WebSocket conversation: a case dials the api's
# announced socket over TCP (`tokio/net`) and waits a bounded time for a frame
# (`tokio/time`).
tokio = { workspace = true, features = ["net", "time"] }
# The EC2 service, mounted beside this one in the test harness: that a VPC link can only
# be created in subnets of one VPC the account really has is driven end to end with the
# owner of subnets on the same engine. DEV-ONLY: this crate depends on no other service's
# crate outside its tests.
service-com-amazonaws-ec2-amazonec2 = { workspace = true }
aws-sdk-ec2 = { version = "1", default-features = false }
# The AWS Lambda service, mounted beside this one in the test harness: an `AWS_PROXY`
# route's answer is the answer of a function that service holds and runs, so the data plane
# is driven end to end with the owner of functions on the same engine. DEV-ONLY.
service-com-amazonaws-lambda-awsgirapiservice = { workspace = true }
# Writes the .zip deployment package the test uploads, the way a caller uploads one.
zip = { version = "9", default-features = false, features = ["deflate"] }
# Amazon Cognito user pools, mounted beside this one in the test harness: the tokens a JWT
# authorizer accepts are minted by that service, so the scope gate is driven end to end with
# the pool that issued the token rather than with a token written in a test. DEV-ONLY.
service-com-amazonaws-cognitoidentityprovider-awscognitoidentityproviderservice = { workspace = true }
# EventBridge, Amazon SQS, IAM and the token service, mounted beside this one in the test
# harness: a route whose integration names a first-class service action is driven end to end
# against the services that OWN that action and the role it is performed under. DEV-ONLY.
service-com-amazonaws-eventbridge-awsevents = { workspace = true }
service-com-amazonaws-sqs-amazonsqs = { workspace = true }
# Step Functions, mounted beside this one in the test harness: a route whose integration names
# a first-class Step Functions subtype starts a run of a state machine THAT service holds, and
# `tests/all/http_api_step_functions_subtype.rs` reads the execution back through its own
# `DescribeExecution`. DEV-ONLY.
service-com-amazonaws-sfn-awsstepfunctions = { workspace = true }
# The XML reader the service-action suite reads a first-class subtype route's answer with:
# the answer of a QUERY api is that api's own `{Action}Response` envelope, so the test parses
# it the way a client's XML reader does rather than by slicing the body. DEV-ONLY.
quick-xml = "0.41"
# CloudWatch Logs, mounted beside this one in the test harness: the access-log record a stage
# writes lands in a log group that service holds, and `tests/all/http_api_access_logging.rs`
# reads the delivery back through its own `FilterLogEvents`. DEV-ONLY.
service-com-amazonaws-cloudwatchlogs-logs-20140328 = { workspace = true }
# Percent-encodes the `ConnectionId` a test addresses a `@connections` operation by, the way
# an SDK client encodes a path label: a minted id is base64, whose alphabet carries `/` and
# `+`. DEV-ONLY.
percent-encoding = "2"

[lints]
workspace = true
