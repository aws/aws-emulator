[package]
name = "service-com-amazonaws-databrew-awsgluedatabrew"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
# Writes a JSON output record in the table's own column order, which a `serde_json` map
# does not keep.
serde = { workspace = true }
tracing = { workspace = true }
# Encodes/decodes the opaque pagination tokens ListDatasets/ListJobRuns hand out.
hex = { workspace = true }
# The Amazon S3 client a recipe job run reads its dataset through and writes its output
# with, over the in-process callback into this same emulator (no network client feature:
# the transport is the emulator's own, so no socket is opened and no host is resolved).
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
# Reads a dataset's comma-separated input and writes a recipe job's CSV output; a
# library computing over data in this process, with no native or build-time code.
csv = "1.3"
# `iam_role`: the shared reading of a caller-supplied role ARN against the account's IAM
# records and the trust policy the stored role carries. `s3_client`: the one construction
# of the in-process Amazon S3 client a job run reads and writes objects through.
service-common = { path = "../common" }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
# Percent-encodes the query-protocol fields the IAM fixture below carries.
percent-encoding = "2.3"
# Amazon S3 and IAM, mounted beside databrew on one engine so a job run reads the object
# a test staged with `PutObject` and resolves the role a test created with `CreateRole`.
service-com-amazonaws-s3-amazons3 = { workspace = true }
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }

[lints]
workspace = true
