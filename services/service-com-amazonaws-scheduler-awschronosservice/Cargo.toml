[package]
name = "service-com-amazonaws-scheduler-awschronosservice"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
# `time`: the invocation clock waits between its passes with it rather than
# parking a worker thread, and it drives the tests' wait past a group deletion's
# due instant; `rt` is the handle it spawns that one task onto
# (`state::invocation`).
tokio = { workspace = true, features = ["rt", "time"] }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# URL-safe opaque encoding for the `ListSchedules` page token.
hex = { workspace = true }
# The AWS SDK for IAM, driven over the in-process callback
# (`OperationContext::callback`): `CreateSchedule`/`UpdateSchedule` verify a
# target's execution role with `GetRole` before persisting a schedule. Only the
# generated client is needed — the emulator supplies the transport, so the SDK's
# own HTTPS stack and runtime are left out.
aws-sdk-iam = { version = "1", default-features = false }
# `iam_trust_policy`: the one reading of an IAM trust policy — including the decode of
# the URL-encoded form IAM reports a document in — shared with every other service that
# resolves a caller-supplied execution role; `iam_authorization`: the one evaluation of
# policy documents behind the `iam:PassRole` a request naming a `Target.RoleArn` charges
# (`state::pass_role`).
service-common = { path = "../common" }
# The IAM service's OWN state, read through the shared engine: the identity a request's
# access key id speaks for, and the identity-based policies in force on it, which is what
# the `iam:PassRole` gate decides a pass of a target's role against (`state::pass_role`).
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
# The CloudWatch service's OWN state, written through the shared engine: the counts this
# service publishes about its own invocations live in the very store `ListMetrics` and
# `GetMetricStatistics` read, because a metric in an `AWS/` namespace is never published
# over `PutMetricData` (`state::schedule_metrics`).
service-com-amazonaws-cloudwatch-graniteserviceversion20100801 = { workspace = true }
# The `cron(...)` and `at(...)` halves of a `ScheduleExpression` are read by
# maintained parsers rather than by a hand-written grammar; `chrono` is what the
# cron parser is written in, and `chrono-tz` carries the IANA database a
# `ScheduleExpressionTimezone` has to name a zone of.
cron = "0.15"
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = { version = "0.10", default-features = false, features = ["std"] }
# The clients a schedule's occurrence reaches its target through, driven over the
# same in-process callback (`state::invocation`): an SQS queue (`SendMessage`), an
# SNS topic (`Publish`), a Lambda function (`Invoke`) and a Step Functions state
# machine (`StartExecution`). Only the generated clients are needed — the
# emulator supplies the transport, so the SDK's own HTTPS stack and runtime are
# left out.
aws-sdk-sqs = { version = "1", default-features = false }
aws-sdk-sns = { version = "1", default-features = false }
aws-sdk-lambda = { version = "1", default-features = false }
aws-sdk-sfn = { version = "1", default-features = false }
# The client an occurrence of a schedule whose target is an EVENT BUS publishes through
# (`events:PutEvents`), built by the one shared construction of that hop
# (`service_common::eventbridge_client`); the generated types spell the entry such a
# publication carries.
aws-sdk-eventbridge = { version = "1", default-features = false }
# The engine the modelled `@pattern` of `EventBridgeParameters$Source` is matched with:
# that expression is written with look-around, which the request boundary's own regex
# engine cannot compile, so the constraint is applied by this one over the model's own
# text (`state::event_bridge_target`), as the sibling service crates in the same position
# do.
fancy-regex = "0.16"
# The tree's ONE statement of how an AWS API call is made in process — which service an
# SDK service id names, its endpoint, signing name and protocol, and how an operation's
# input is bound to a request — which AWS Step Functions' AWS SDK integration family
# owns (`state::integration`). A schedule's UNIVERSAL target names a service and an
# operation the same way, so it resolves and makes the call there rather than restating
# those facts (`state::universal_target`).
service-com-amazonaws-sfn-awsstepfunctions = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# The one integration-test target is rooted at tests/all/main.rs, which declares one module
# per suite file under tests/all/ rather than listing them by hand.
automod = { workspace = true }
sha2 = { workspace = true }
# The services a schedule's target lives in are mounted beside this one on a
# single engine in the invocation suite, because an invocation is asserted where a
# client sees it: on the queue the schedule's target names, and against the
# execution role IAM holds.
service-com-amazonaws-sqs-amazonsqs = { workspace = true }
# Lambda, mounted beside this one on that same engine: a schedule whose target is a
# FUNCTION is asserted where the function sees it — in the asynchronous invocation Lambda
# holds for it, which is what carries the payload the occurrence handed over.
service-com-amazonaws-lambda-awsgirapiservice = { workspace = true }
# Amazon RDS, mounted beside this one on that same engine: a schedule whose UNIVERSAL
# target names one of its operations is asserted where that service holds the effect —
# the status of the DB instance the call acts on — and a call its execution role withholds
# is asserted on the schedule's dead-letter queue.
service-com-amazonaws-rds-amazonrdsv19 = { workspace = true }
# The token service, mounted beside this one so a suite can present the credential of an
# assumed ROLE session — the identity a least-privilege policy is attached to — rather
# than only a long-term key.
service-com-amazonaws-sts-awssecuritytokenservicev20110615 = { workspace = true }
# Amazon EventBridge, mounted beside this one on that same engine: a schedule whose
# target is an event BUS is asserted where a client observes it — on the rule that bus
# routes the published event to, and on that rule's own target.
service-com-amazonaws-eventbridge-awsevents = { workspace = true }
# A deployment package is a .zip archive: the suite that asserts a function target's own
# failure is not a delivery failure uploads a handler that RAISES, and writes that archive
# in memory the way a caller uploads one.
zip = { version = "9", default-features = false, features = ["deflate"] }
# ...carried base64, as the `FunctionCode$ZipFile` member a create states its code in.
base64 = "0.22"
# AWS KMS, mounted beside this one on that same engine: the customer managed key a write
# states is resolved against the very records `CreateKey` and `CreateAlias` wrote, which
# is what a suite needs in order to tell a key this account holds from one it does not.
service-com-amazonaws-kms-trentservice = { workspace = true }

[lints]
workspace = true
