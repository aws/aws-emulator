[package]
name = "service-com-amazonaws-pcs-awsparallelcomputingservice"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Encodes/decodes the opaque `nextToken` a paginated list hands back.
hex = { workspace = true }
# The AWS SDK for IAM, driven over the in-process callback
# (`OperationContext::callback`): `CreateComputeNodeGroup` resolves the instance profile
# its `iamInstanceProfileArn` references with `GetInstanceProfile` before it resolves
# anything of its own. Only the generated client is needed — the emulator supplies the
# transport, so the SDK's own HTTPS stack and runtime are left out.
aws-sdk-iam = { version = "1", default-features = false }
# The AWS SDK for EC2, driven over the same in-process callback: the account's subnets are
# EC2's resources, so a create that places a cluster's control-plane ENI or a compute node
# group's instances in caller-named subnets resolves them against EC2
# (`src/state/ec2_subnets.rs`) before it mints anything. Only the generated client is
# needed — the emulator supplies the transport.
aws-sdk-ec2 = { version = "1", default-features = false }
# The tree's shared IAM-ARN reading, in-process IAM client and `@pattern` rendering.
service-common = { path = "../common" }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
# `tokio::time::sleep` lets a test wait out a lifecycle transition the clock owes.
tokio = { workspace = true, features = ["time"] }
# The owner of the resources this service RESOLVES, mounted beside it in the test
# harness: Amazon EC2 holds the account's subnets, so the subnet resolution a create
# performs can only be driven end to end with EC2 on the same engine. DEV-ONLY: this
# crate depends on no other service's crate outside its tests.
service-com-amazonaws-ec2-amazonec2 = { workspace = true }

[lints]
workspace = true
