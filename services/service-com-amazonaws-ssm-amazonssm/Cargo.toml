[package]
name = "service-com-amazonaws-ssm-amazonssm"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# `PutParameter`'s AllowedPattern is a regular expression the value must satisfy.
# The floor matches the version the vendored framework pins, so the tree resolves one.
regex = "1.12"
# `arn::parse_of`: the one parse a service reads a caller-supplied resource ARN with,
# which `DescribeDocument`'s `DocumentARN` name may be.
service-common = { path = "../common" }
# A `SecureString`'s value is sealed under a key the KMS service holds: whether a read may
# have it decrypted for its caller is that key's own policy decision, read through KMS's
# own state accessors rather than from a second copy of them here.
service-com-amazonaws-kms-trentservice = { workspace = true }
# The image catalog Amazon EC2 publishes: the AWS-published parameters of the `/aws`
# hierarchy resolve to the ids of the images that service holds, which is the one place
# this emulator records which AMI a public parameter names.
service-com-amazonaws-ec2-amazonec2 = { workspace = true }
# The secrets Secrets Manager holds: a read of the reserved `/aws/reference/secretsmanager`
# hierarchy is a read of that service's own secret — its authorization gate, its versions'
# staging labels and its envelope — rather than of any parameter this service stores
# (`state::secretsmanager_reference`).
service-com-amazonaws-secretsmanager-secretsmanager = { workspace = true }
# `CreateDocument`'s content is "in JSON or YAML format", and the document's schema
# version, description and parameters are read out of it. yaml-rust2 is a pure-Rust
# YAML 1.2 implementation, and YAML 1.2 is a superset of JSON, so one parser reads
# either spelling of the same document.
yaml-rust2 = { version = "0.10", default-features = false }
# `DocumentDescription$Hash` is "the Sha256 … hash created by the system when the
# document was created", rendered hex.
sha2 = { workspace = true }
hex = { workspace = true }
# Whether the caller's identity-based policies allow a just-in-time node access call is
# decided from the documents IAM holds for that principal and the session STS resolves the
# request's access key id to, read through those services' own state accessors rather than
# from a second copy of them here (`state::identity_authorization`).
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
service-com-amazonaws-sts-awssecuritytokenservicev20110615 = { workspace = true }
# A maintenance window's `Schedule` is "a cron or rate expression", so the instants it
# opens at are read by this maintained cron grammar rather than by a hand-written one.
cron = "0.15"
# `chrono` is what that parser is written in, and what reads the ISO-8601 Extended instants
# a window states its activation and its one-time schedule with.
chrono = { version = "0.4", default-features = false, features = ["std"] }
# A window's schedule is evaluated "in Internet Assigned Numbers Authority (IANA) format"
# time zone, whose database this crate carries.
chrono-tz = { version = "0.10", default-features = false, features = ["std"] }
# The `aws:changeInstanceState` step of an Automation runbook brings the instances it names
# to the desired state by calling Amazon EC2 itself, whose awsQuery answers are XML
# documents; roxmltree is the pure-Rust XML reader this tree already uses for them.
roxmltree = "0.20"
# An awsQuery request's parameters are a form body, so each one is percent-encoded the way
# an AWS SDK sends it and the SigV4 canonical request assumes.
percent-encoding = "2"

[build-dependencies]
emulator-core-build-support = { workspace = true }

[lints]
workspace = true
