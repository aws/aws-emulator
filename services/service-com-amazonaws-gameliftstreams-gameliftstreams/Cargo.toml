[package]
name = "service-com-amazonaws-gameliftstreams-gameliftstreams"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# The tree's shared readings this service needs: the one in-process Amazon S3 client the
# content of an application is sized through, and the one framing of a response that
# carries no content.
service-common = { path = "../common" }
# The AWS SDK for Amazon S3, driven over the in-process callback
# (`OperationContext::callback`): `CreateApplication` sizes the content at
# `ApplicationSourceUri` by listing it in THIS emulator's own object store
# (`state::content`). Only the generated client is needed — the emulator supplies the
# transport, so the SDK's own HTTPS stack and runtime are left out.
aws-sdk-s3 = { version = "1", default-features = false }
# The files of a stream session are exported as ONE compressed archive, written with the
# zip implementation this workspace already reads and writes archives with.
zip = { version = "9", default-features = false, features = ["deflate"] }
# The generated name of an exported archive carries the UTC calendar stamp of the export,
# which this renders.
chrono = { version = "0.4", default-features = false, features = ["std"] }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# One integration-test target rooted at `tests/all/main.rs`: every `tests/all/<name>.rs`
# is declared as a suite of it by this macro.
automod = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
# The content an application is created from lives in a bucket of this emulator's own
# object store, so the suite that drives the application read path mounts Amazon S3
# beside this service on ONE engine: the bytes `StorageBytes` reports are the bytes of
# real objects, staged through Amazon S3's own API.
service-com-amazonaws-s3-amazons3 = { workspace = true }

[lints]
workspace = true
