[package]
name = "service-com-amazonaws-osis-amazonopensearchingestionservice"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Content-derived identifiers: the pipeline-id segment of an ingestion endpoint host and
# the id of the VPC interface endpoint a VPC-attached pipeline gets are digests of the
# pipeline's own ARN, so they are stable across reads and unique per pipeline.
sha2 = { workspace = true }
# Opaque pagination cursors: hex-encode the internal list cursor so `NextToken` is a
# single-token string a client only ever echoes back.
hex = { workspace = true }
# A blueprint's configuration document is held as the YAML its record carries; this is the
# YAML reader that parses it so `GetPipelineBlueprint` can render the same document in the
# JSON format a caller may ask for. yaml-rust2 is the pure-Rust YAML 1.2 implementation the
# other services in this workspace read YAML with (no `unsafe`, no C bindings).
yaml-rust2 = { version = "0.10", default-features = false }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[lints]
workspace = true
