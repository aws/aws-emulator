[package]
name = "service-com-amazonaws-cloudfront-cloudfront2020-05-31"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true, features = ["sync", "time"] }
bytes = { workspace = true }
http = { workspace = true }
# Speaks HTTP/1.1 on the raw connection the core hands a distribution's EDGE listener, which
# is what makes the published `DomainName` an address a viewer dials with its own client
# (`src/state/edge_endpoint.rs`). `hyper-util` carries the tokio IO and timer adapters for
# it, `http-body-util` the bounded body reader and the one-shot body.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
serde_json = { workspace = true }
tracing = { workspace = true }
# `iam_authorization`: the ONE evaluation of the resource policy an origin states its grant
# to the CloudFront service principal in; `in_process_sigv4`: the ONE signature an
# in-process call to another emulated service carries; `s3_bucket_name`: whether a host
# label names a bucket; `arn`: the account an ARN belongs to;
# `service_principal_calls`: the directory of the calls this service makes AS the CloudFront
# service principal, which the service serving one reads; `in_band_tls` and
# `data_plane_addressing`: the ONE reading of a data-plane connection whose encryption is
# negotiated in band and of the `host:port` a published endpoint carries, which a
# distribution's edge listener is announced and served through.
service-common = { path = "../common" }
# The CloudWatch store the EDGE publishes the per-distribution metrics of the viewer
# requests it serves to (the `AWS/CloudFront` namespace, `service::edge_metrics`).
# CloudWatch refuses a `PutMetricData` into a reserved `AWS/` namespace, so a service's own
# metrics never travel over that API; this writes the very store `ListMetrics`,
# `GetMetricStatistics` and the alarm evaluation read.
service-com-amazonaws-cloudwatch-graniteserviceversion20100801 = { workspace = true }
# The WAFv2 web ACL a distribution's configuration puts in front of it, and the ONE
# evaluation of its rule tree (`service::web_acl`): a viewer request the web ACL does not
# let through is answered 403 at the edge, with no origin request made. It also holds the one
# reading of the ADDRESS a viewer request came from, which a real-time log record reports.
service-com-amazonaws-wafv2-awswaf-20190729 = { workspace = true }
# The Kinesis data stream a cache behaviour's real-time log configuration delivers each served
# viewer request's log record to (`service::edge::realtime_logs`), written over the emulator's
# own in-process transport. Only the generated client is needed — the emulator supplies the
# transport.
aws-sdk-kinesis = { version = "1", default-features = false }
# Percent-encodes the three characters a tab-delimited, single-line real-time log record's
# framing owns, so no field value can carry one.
percent-encoding = "2"

# `rquickjs` is the QuickJS JavaScript engine, embedded in this process, which is what RUNS a
# CloudFront function: `TestFunction` answers with "the function's result (the modified event
# object)", the lines the function logged and the error it raised, and all three are produced by
# the caller's OWN code, so that code is executed rather than interpreted by hand
# (`state::function_runtime`).
# It is an EXECUTION SUBSTRATE, so the confinement and the bounds of one run are stated and
# enforced in that module: a fresh engine per run with the engine's own memory and stack
# ceilings, a wall-clock and a step budget spent by its interrupt handler, a latch the running
# code cannot reach, caps on what one run may report, a concurrency permit and a caller-wait
# ceiling, the run on a blocking thread, and ONE host function reachable from the engine (the
# console's writer). The `loader` feature is left OUT, so no module resolver is built at all
# and an `import` reaches nothing; `dyn-load` is left out too, so no host library can be
# loaded. QuickJS itself registers no filesystem, process, environment, network or thread API.
# It is also a NATIVE component: `rquickjs-sys` compiles the QuickJS C sources with `cc` inside
# this build, so nothing is fetched or started outside this process, and the C it compiles is
# the engine's own. 0.14 is the version this workspace's other services already run it at, and
# it carries no advisory.
rquickjs = "0.14"
# The account's S3 OBJECT a trust store's CA certificates bundle is: `CreateTrustStore`
# reads the bundle in the one object store this emulator holds, over the in-process
# callback, so the certificate count it reports comes from those bytes
# (`state::ca_certificates_bundle`). Only the generated client is needed — the emulator
# supplies the transport.
aws-sdk-s3 = { version = "1", default-features = false }
# Splits a CA certificates bundle into its PEM blocks, so the bundle's structure is read by
# the crate that owns the format rather than by scanning text.
pem = "3"
# Decodes the DER inside one `CERTIFICATE` PEM block as an X.509 certificate, so a trust
# store's `NumberOfCaCertificates` counts certificates a real parser accepted.
x509-cert = "0.2"
# The two content codings a cache behaviour's automatic compression serves an answer under
# (`service::edge::compression`): `brotli` produces the `br` bytes a viewer that negotiated
# Brotli receives, `flate2` the `gzip` ones. The bytes the edge serves are the encoders' own,
# so what a viewer decodes is what the origin sent.
brotli = "9"
flate2 = "1"

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
hex = { workspace = true }
# DECODES the `Data` of a record this suite reads back off a Kinesis data stream, which that
# API carries base64-encoded. TEST-ONLY.
base64 = "0.22"
# The Kinesis data stream the real-time log suite creates and polls, mounted on the same
# router: the record the edge delivers is read back through Kinesis itself. TEST-ONLY.
service-com-amazonaws-kinesis-kinesis-20131202 = { workspace = true }
# The IAM roles the real-time log suite hands its endpoints, mounted on the same router:
# whether a delivery role may put a record on its stream is IAM's decision. TEST-ONLY.
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
# DECODE the two content codings the edge compresses an answer under, so the edge suite reads
# the bytes it served and proves they really are that coding's rather than mislabelled.
brotli = "9"
flate2 = "1"
# Generates the real self-signed CA certificates the trust store suite stages as a bundle,
# so the certificate count it expects back comes from certificates a parser produced rather
# than from the code under test. TEST-ONLY.
rcgen = "0.13"
# The object store the trust store suite stages that bundle in: the suite mounts the real
# emulated Amazon S3 on the same router, so the bundle `CreateTrustStore` reads is one a
# client really put there. TEST-ONLY.
service-com-amazonaws-s3-amazons3 = { workspace = true }
# The published-address suite DIALS the `DomainName` a distribution reports, in this
# process, exactly as a viewer handed that name does: tokio's socket and byte-stream halves
# carry the HTTP exchange on it.
tokio = { workspace = true, features = ["io-util", "net", "time"] }

[lints]
workspace = true
