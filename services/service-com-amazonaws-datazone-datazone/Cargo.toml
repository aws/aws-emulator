[package]
name = "service-com-amazonaws-datazone-datazone"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Renders a pagination cursor as an opaque, round-trippable token.
hex = { workspace = true }
# `data_plane_addressing`: the shared reading of how a client addresses a plane this
# emulator serves at its own endpoint, which a domain's published portal URL is built from.
service-common = { path = "../common" }
# Which principal the request's access key id speaks for — the session the token service
# minted it for, or the IAM user the account holds it for, the same record
# `sts:GetCallerIdentity` answers from — so what a caller OWNS in a domain is decided for the
# identity the caller reads as itself (`state::requesters`).
service-com-amazonaws-sts-awssecuritytokenservicev20110615 = { workspace = true }
# Escapes the stored strings written into the data portal page this service serves.
html-escape = "0.2"

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# Compiles every `tests/all/<name>.rs` as a suite of the single integration-test target,
# so a new suite is a new file and nothing has to be declared.
automod = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
# The account's own IAM records, mounted beside DataZone on one engine in
# `tests/all/domain_execution_role.rs`: a domain create resolves the roles it names against
# them, so the suite that drives that resolution has to serve IAM too.
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }

[lints]
workspace = true
