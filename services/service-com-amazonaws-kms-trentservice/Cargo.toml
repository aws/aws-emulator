[package]
name = "service-com-amazonaws-kms-trentservice"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# AES-256-GCM (and the OS CSPRNG) for the ciphertext envelope a SYMMETRIC_DEFAULT
# KMS key seals and opens; `ring` is already in this workspace's lock file.
ring = "0.17"
# RSA, NIST ECDSA, secp256k1 and Ed25519 key pair generation, the RSA-OAEP
# unwrapping of imported key material, and the DER encodings (PKCS#8, X.509
# SubjectPublicKeyInfo) a data key pair and a wrapping key are reported in;
# already in this workspace's lock file.
aws-lc-rs = "1"
# The SM2 curve of an SM2 data key pair, which aws-lc-rs does not expose.
sm2 = { version = "0.14", default-features = false, features = [
    "arithmetic",
    "pkcs8",
    "std",
] }
# The Elliptic Curve Cryptography Cofactor Diffie-Hellman primitive `DeriveSharedSecret`
# runs, over each NIST-standard curve a KEY_AGREEMENT KMS key pair can be on, together
# with the DER decoding (PKCS#8 private half, X.509 SubjectPublicKeyInfo public half) the
# two halves it runs over are held and submitted in: aws-lc-rs performs no agreement over
# a stored PKCS#8 private key.
p256 = { version = "0.14", default-features = false, features = [
    "arithmetic",
    "ecdh",
    "pkcs8",
    "std",
] }
p384 = { version = "0.14", default-features = false, features = [
    "arithmetic",
    "ecdh",
    "pkcs8",
    "std",
] }
p521 = { version = "0.14", default-features = false, features = [
    "arithmetic",
    "ecdh",
    "pkcs8",
    "std",
] }
# The curve-generic half of that stack: the one agreement primitive, run over whichever
# curve a key's spec names — including the SM2 curve, which `sm2` itself exposes no
# agreement for.
elliptic-curve = { version = "0.14", default-features = false, features = [
    "ecdh",
    "pkcs8",
    "std",
] }
# Ed25519ph, the PREHASHED Edwards25519 signature scheme of RFC 8032 Section 5.1, which
# aws-lc-rs does not expose; already in this workspace's lock file. `hazmat` is what lets
# the scheme be driven from the digest a caller submits, with the scheme's own hashing
# left as the standard defines it.
ed25519-dalek = { version = "2", default-features = false, features = [
    "digest",
    "hazmat",
    "pkcs8",
    "std",
] }
# KeyMaterialId (64 lowercase hex characters) and the opaque ListKeys marker.
sha2 = { workspace = true }
hex = { workspace = true }
# The X.509 `SubjectPublicKeyInfo` an ML-KEM encapsulation key is downloaded as: the
# algorithm identifier and the DER writer come from the maintained SPKI crate this
# workspace already encodes public keys with (it is in the lock file through `sm2`'s
# PKCS#8 support) rather than from a structure laid out here.
spki = { version = "0.8", features = ["alloc"] }
# The PKCS#8 `PrivateKeyInfo` an ML-KEM data key pair's private half is reported in, which
# `aws-lc-rs` exports no DER for: the structure comes from the maintained PKCS#8 crate
# beside the SPKI one above (both are in the lock file through `sm2`'s PKCS#8 support).
pkcs8 = { version = "0.11", features = ["alloc"] }
# Version-4 UUIDs: the form a KMS key id takes.
uuid = { version = "1", features = ["v4"] }
# `iam_authorization`: the shared evaluation of IAM policy documents against
# (action, resource, principal), which decides a key policy and the caller's identity
# policies here.
service-common = { path = "../common" }
# The IAM store holds the identity-based policies of the principal a request speaks for,
# and the STS store resolves which principal that is: this service reads both services'
# OWN state accessors rather than keeping a second copy of either fact.
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
service-com-amazonaws-sts-awssecuritytokenservicev20110615 = { workspace = true }
# The CloudHSM store holds the clusters of this account, which is what a CloudHSM custom
# key store is backed by: the cluster a key store names is resolved against that
# service's own state accessor rather than copied into this one.
service-com-amazonaws-cloudhsmv2-baldrapiservice = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# `tests/all/main.rs`: one `mod` per suite file under `tests/all/`, so a new suite is a
# new file and nothing declares it. DEV-ONLY.
automod = { workspace = true }
# The authorization suite makes the principals it calls as through IAM's and STS's own
# operations, so the documents it asserts on are the ones those services wrote.
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
service-com-amazonaws-sts-awssecuritytokenservicev20110615 = { workspace = true }
# The EC2 service, mounted beside this one where a row needs a CloudHSM cluster: CloudHSM
# places a cluster in the account's SUBNETS, which are EC2's resources, so the cluster
# those rows create can only be created in the subnets EC2 hands out. DEV-ONLY.
service-com-amazonaws-ec2-amazonec2 = { workspace = true }

[lints]
workspace = true
