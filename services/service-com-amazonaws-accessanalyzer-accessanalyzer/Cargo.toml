[package]
name = "service-com-amazonaws-accessanalyzer-accessanalyzer"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
# The emulator's own request-handling runtime; `time` is what holds a caller to the
# policy checks' deadline while they run on the blocking pool (see
# `ops::validate_policy`), and the generated crates use the rest for
# `#[tokio::main]` / `#[tokio::test]`.
tokio = { workspace = true, features = ["time"] }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Encodes a listing's continuation key as the opaque `nextToken` the pagination
# handlers hand out (and decodes it on resume).
hex = { workspace = true }
# Span-preserving JSON parser: `ValidatePolicy` reports every finding with the
# `Location` (JSON path + byte/line/column span) of the element it is about, which
# `serde_json` discards, so the policy document is parsed into an AST that keeps the
# source range of every value and object property.
jsonc-parser = "0.26"
# Mints an `accessPreviewId`: the 128 unguessable bits a version-4 UUID carries are
# taken from a digest over the process's entropy, a counter and the clock.
sha2 = { workspace = true }
# An external access analyzer reports findings for the account's own resources, so the
# analysis reads each resource-based policy out of the service that OWNS it: a role's
# trust policy from IAM, a bucket policy from S3, a queue's access policy from SQS.
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
service-com-amazonaws-s3-amazons3 = { workspace = true }
service-com-amazonaws-sqs-amazonsqs = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# Percent-encodes an ARN into the `{resourceArn}` httpLabel of the tagging operations,
# the way an SDK encodes a label value. Pinned here rather than referenced from the
# root `[workspace.dependencies]`, which this project does not allow editing.
percent-encoding = "2.3"

[lints]
workspace = true
