[package]
name = "service-com-amazonaws-memorydb-amazonmemorydb"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Derives the per-cluster endpoint label AWS generates randomly, so the address a
# create returns is the one every later describe returns.
sha2 = { workspace = true }
# Renders that digest as the hex label, rather than re-deriving the encoding here.
hex = { workspace = true }
# Resolves the VPC subnets a subnet group places a cluster in against the service that OWNS
# them: `DescribeSubnets` over the emulator's own in-process callback, which is where the
# VPC and the Availability Zone a stored subnet group reports come from
# (`state::subnet_placement`). No network client feature: the transport is the emulator's
# own.
aws-sdk-ec2 = { version = "1", default-features = false }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# The CBOR implementation the framework's own codec is built on, at the version that
# codec uses: the wire suite writes and reads the bodies of this service's Smithy RPC v2
# CBOR framing with it, so no second CBOR implementation enters the tree.
aws-smithy-cbor = "0.62.2"

[lints]
workspace = true
