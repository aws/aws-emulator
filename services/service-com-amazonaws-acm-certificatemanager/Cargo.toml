[package]
name = "service-com-amazonaws-acm-certificatemanager"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# The STS store, for the identity an access key id speaks for: the principal
# `sts:GetCallerIdentity` answers for the credentials a request signed with.
service-com-amazonaws-sts-awssecuritytokenservicev20110615 = { workspace = true }
# The IAM store, for the identity-based policy documents in force on that principal.
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
# The Route 53 store, for the DNS a public certificate's domain validation is proven in:
# whether the CNAME this service handed out is published in one of the account's public
# hosted zones is that service's fact, read through the shared engine, which needs the
# owning service's state TYPE.
service-com-amazonaws-route53-awsdnsv20130401 = { workspace = true }
# `iam_authorization`: the shared evaluation of those documents against an action on a
# resource, so every service that enforces authorization decides alike.
service-common = { path = "../common" }
# SHA-256, for the stable domain-validation labels and request fingerprints this
# service derives from a certificate's own id.
sha2 = { workspace = true }
# Hex encoding for those labels and for the opaque `NextToken`s this service's list
# operations issue.
hex = { workspace = true }
# Speaks HTTP/1.1 on the raw connection the core hands the socket an ACME endpoint's
# surface is published on, with the encoder's title-case option set so a field name reaches
# an ACME client in the canonical spelling RFC 8555 states it in. `hyper-util` carries the
# tokio IO and timer adapters for it, `http-body-util` the bounded body reader and the
# one-shot body.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
# Certificate ids: ACM certificate ARNs end in a v4 UUID.
uuid = { version = "1", features = ["v4"] }
# Reads the X.509 certificates `ImportCertificate` accepts: their names, validity,
# serial, algorithms and key-usage extensions.
x509-cert = "0.2"
# Reads the PEM framing and the PKCS#8 structure of the private key an import carries,
# so an encrypted or mismatched key is refused.
pkcs8 = { version = "0.10", features = ["pem", "std"] }
# The PKCS#1 RSA key structures, for the RSA key size an imported certificate's
# `KeyAlgorithm` is read from and for matching its private key.
pkcs1 = "0.7"
# The SEC1 elliptic-curve private key structure, for matching an EC private key with
# the certificate it was imported with.
sec1 = "0.7"

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
hex = { workspace = true }
# The CLIENT half of the ACME wire: the tests generate account key pairs and sign the JWS
# and the external-account-binding MAC an ACME client sends, with the same maintained
# cryptography library the service verifies them through — never with the code under test.
# TEST-ONLY.
ring = "0.17"
# RSA key GENERATION, which `ring` does not do, so one row of the account-key table can be
# an RSA key. TEST-ONLY.
aws-lc-rs = "1"
# Generates the real certificates and key pairs the import tests feed the service,
# independently of the DER this crate reads.
rcgen = "0.13"
# The API Gateway V2 service, so one test can drive the cross-service flow a client
# performs with an imported certificate: import it here, then build a regional custom
# domain on the ARN this service answered. TEST-ONLY — nothing in `src/` reaches it.
service-com-amazonaws-apigatewayv2-apigatewayv2 = { workspace = true }
# The Amazon EC2 service, so the DNS-validation tests can register the VPC a PRIVATE
# hosted zone is created with: which VPCs the account holds is that service's fact.
# TEST-ONLY — nothing in `src/` reaches it.
service-com-amazonaws-ec2-amazonec2 = { workspace = true }

[lints]
workspace = true
