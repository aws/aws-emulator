[package]
name = "service-com-amazonaws-sesv2-simpleemailservice-v2"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
service-common = { path = "../common" }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
# `time` and `sync` beyond the workspace's own feature set: evaluating a SAVED email
# template runs on a thread of its own and the request waits a bounded time for it
# (`state::template_language`), which is a timeout and a one-shot channel.
tokio = { workspace = true, features = ["time", "sync"] }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# The AWS SDK for Amazon SNS, driven over the in-process callback
# (`OperationContext::callback`): an event destination that publishes to an SNS topic is
# established only where that topic's own access policy does not refuse this service's
# publish, which is read from the topic itself (`state::event_publication`). Only the
# generated client is needed — the emulator supplies the transport, so the SDK's own HTTPS
# stack and runtime are left out.
aws-sdk-sns = { version = "1", default-features = false }
# The AWS SDK for Amazon Kinesis Data Firehose, driven over the same in-process callback:
# an event destination that names a Firehose stream receives each matching email event as
# a record put on that stream (`state::event_publication::firehose`). Only the generated
# client is needed — the emulator supplies the transport.
aws-sdk-firehose = { version = "1", default-features = false }
# The AWS SDK for Amazon EventBridge, driven over the same in-process callback: an event
# destination that names an event bus receives each matching email event as one event put
# on that bus (`state::event_publication::event_bridge`). Only the generated client is
# needed — the emulator supplies the transport.
aws-sdk-eventbridge = { version = "1", default-features = false }
# The CloudWatch store a configuration set's CloudWatch event destination counts an email
# event in (the `AWS/SES` namespace, `state::event_publication::cloudwatch`). CloudWatch
# refuses a `PutMetricData` into a reserved `AWS/` namespace, so a service's own metrics
# never travel over that API; this writes the very store
# `ListMetrics`/`GetMetricStatistics` read.
service-com-amazonaws-cloudwatch-graniteserviceversion20100801 = { workspace = true }
# `mailparse`: the ONE reading of an RFC 5322 / MIME message's header block — the
# headers a message sent as `Content.Raw` carried, which a published email event reports
# (`state::event_publication::notification`). The same crate the classic SES surface reads
# a raw message with.
mailparse = "0.16"
# `handlebars`: the ONE evaluator of the template language a SAVED email template is
# written in — the expressions, the conditional blocks and the iteration blocks a stored
# template may carry, which `TestRenderEmailTemplate` previews
# (`state::template_language`). The language is not re-implemented here: the engine parses
# and evaluates it.
#
# It is an EXECUTION SUBSTRATE — it evaluates text a caller stored — so what it is allowed
# to do is stated here and bounded in `state::template_language`: NO feature of the crate
# is enabled beyond its (empty) default set, which keeps `script_helper`/`rhai` (a second,
# scripting language), `dir_source`/`walkdir` (templates read from the host filesystem) and
# `rust-embed` out of the build, and the registry it runs on has no helper, no partial and
# no template source registered, so a template reaches no host file, no network and no
# interpreter other than this one. Its own tree is pure Rust and compiles no C
# (`derive_builder`, `pest`, `num-order`, `thiserror`, `log`, `serde`, `serde_json`),
# nothing in it ran at build time beyond the proc macros `pest_derive` and
# `derive_builder_macro`, and no advisory stands against the locked version. What a render
# may cost is capped there, each cap applied where the cost arises: before the engine's
# parse, the tags a part writes and the parentheses it carries (the parse costs more than
# linearly in its tags, and nests on its parentheses); off the engine's own parse tree
# rather than off the text, how deeply blocks nest, how many block bodies the data could
# reach, and a refusal of the partials and decorators that would let a template re-enter
# itself; while the message is written, the bytes one part may produce; and around the
# whole of it, a thread of its own with a stack of its own, a wall-clock deadline, and a
# cap on how many renders may be under way at once.
handlebars = "6"
# `base64`: the ONE encoder of the RFC 2047 "encoded word" form a rendered subject line
# goes into a MIME header as when it is not printable US-ASCII
# (`ops::test_render_email_template`). The same codec `mailparse` decodes one with.
base64 = "0.22"
# `csv`: the ONE writer of the comma-separated form of an export job's file
# (`state::export_file`), so the quoting of a cell that needs it is the codec's rule and
# not re-derived here. The same crate the other emulated services that publish a CSV
# artifact write theirs with.
csv = "1.3"

[build-dependencies]
emulator-core-build-support = { workspace = true }

# The scaffold's dev-dependency block, as generated for every service crate.
[dev-dependencies]
sha2 = { workspace = true }
hex = { workspace = true }
# SNS is mounted beside this service on one engine in the event-destination
# authorization suite, because the topic an event destination names is created and given
# its access policy through the SNS API the handler reads it through.
service-com-amazonaws-sns-amazonsimplenotificationservice = { workspace = true }
# IAM is mounted beside this service on one engine in the Firehose event-destination role
# suite, because the role an event destination names is created and given its trust policy
# through the IAM API the handler reads it through.
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
# The AWS SDK for IAM, used by that suite's setup to create those roles over the same
# in-process hop the handler asks IAM about them through.
aws-sdk-iam = { version = "1", default-features = false }
# `percent-encoding`: the ONE encoder of a query-string component in this crate's suites —
# a page cursor a listing refuses is sent on the query string exactly as a client sends it,
# including its `+`, `/`, `=` and `!`.
percent-encoding = "2.3"
# EventBridge and Amazon SQS are mounted beside this service on one engine in the
# EventBridge event-destination suite: the email events a send publishes are put on that
# service's bus, and a rule's queue target is where a client reads the whole envelope back.
service-com-amazonaws-eventbridge-awsevents = { workspace = true }
service-com-amazonaws-sqs-amazonsqs = { workspace = true }
# The whole pipeline a client wires over email events — SES publishes onto the bus, a rule
# invokes its Lambda target, and the RUNNING handler relays what it was handed onto a queue
# — is asserted end to end, so Lambda and the token service that mints the handler's role
# session are mounted beside this service on one engine too.
service-com-amazonaws-lambda-awsgirapiservice = { workspace = true }
service-com-amazonaws-sts-awssecuritytokenservicev20110615 = { workspace = true }
# The deployment package that suite uploads is a .zip archive it writes in memory.
zip = { version = "9", default-features = false, features = ["deflate"] }

[lints]
workspace = true
