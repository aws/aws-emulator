[package]
name = "service-com-amazonaws-lexmodelsv2-lexmodelbuildingservicev2"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
# The shared request-claim rule for a SigV4 signing name several services share.
service-common = { path = "../common" }
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Hex, for encoding the opaque `nextToken` a listing hands back.
hex = { workspace = true }
# The zip archive `CreateExport` assembles for a bot or bot locale export.
zip = { version = "9", default-features = false, features = ["deflate"] }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
# `zip` reads back the archive an export assembled, as a client that downloaded it does.
zip = { version = "9", default-features = false, features = ["deflate"] }
# `time` is enabled for the tests only: they wait past a status transition's due instant.
tokio = { workspace = true, features = ["time"] }

[lints]
workspace = true
