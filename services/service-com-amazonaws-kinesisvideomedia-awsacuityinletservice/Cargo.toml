[package]
name = "service-com-amazonaws-kinesisvideomedia-awsacuityinletservice"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# The Kinesis Video Streams control plane's own store: `CreateStream` is what creates
# the streams this data plane reads, so a stream's existence and its ARN are read from
# that state in the shared engine rather than registered a second time here.
service-com-amazonaws-kinesisvideo-kinesisvideo-20170930 = { workspace = true }
# The archive read plane's own store: a fragment the ingest plane takes is readable both
# as a chunk of the live stream (`GetMedia`, this crate) and as an archived fragment
# (`ListFragments`, `GetMediaForFragmentList`), so one ingest writes both views of it.
service-com-amazonaws-kinesisvideoarchivedmedia-awsacuityreader = { workspace = true }
# `request_path` / `nth_path_segment`: the shared readers of a request URI's path, which
# the ingest plane's claim is made on; `iam_authorization` / `iam_role`: the ONE shared
# evaluation of IAM policy documents and the ONE wording of an authorization refusal, which
# this plane's gate decides with (`src/service/authorization.rs`).
service-common = { path = "../common" }
# The two stores that gate reads: the SESSION a credential speaks for lives in STS's store
# while the POLICIES in force on that principal live in IAM's. Only their `state`
# accessors are used; the DECISION itself is `service-common`'s one shared evaluation.
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
service-com-amazonaws-sts-awssecuritytokenservicev20110615 = { workspace = true }
# Reads the Matroska container a producer submits to the ingest plane: its EBML element
# tree, the Clusters that become fragments and the frames each one carries.
webm-iterable = "0.7"

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
hex = { workspace = true }
# IAM and the token service, mounted beside this one in the authorization suite's harness:
# the policies a media call is authorized against are IAM's and the identity a credential
# speaks for is STS's, so the gate is driven end to end against the services that own them.
# They are also normal dependencies of this crate (the gate reads their stores); this entry
# only states that the harness mounts them.
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
service-com-amazonaws-sts-awssecuritytokenservicev20110615 = { workspace = true }
# One case dials the address `GetDataEndpoint` announces, in THIS process, as a producer
# handed that address does: tokio's socket and byte-stream halves carry the HTTP exchange
# on the transport the announced scheme names. `time`: the suites wait for a stream to
# become readable by looking again in a poll loop, which needs a timer between looks.
tokio = { workspace = true, features = ["io-util", "net", "time"] }

[lints]
workspace = true
