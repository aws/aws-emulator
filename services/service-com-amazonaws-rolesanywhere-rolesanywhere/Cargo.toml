[package]
name = "service-com-amazonaws-rolesanywhere-rolesanywhere"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Mints the modelled 36-character `Uuid` resource ids.
sha2 = { workspace = true }
# Hex codec for the minted ids, the opaque list `nextToken`, and the hex signature the
# native session plane's authorization header carries.
hex = { workspace = true }
# Reads the end-entity certificate a native `CreateSession` presents and the CA bundle a
# trust anchor holds. DER/ASN.1 and PEM are parsed by this crate, never by hand.
x509-cert = { version = "0.2", features = ["pem"] }
# Verifies the certificate's chain signature and the request's own X.509 signature: the
# one cryptography library this workspace verifies signatures with.
ring = "0.17"
# The sessions this plane vends are minted in — and resolved from — the token service's
# own session registry, through its own mint, and the role comes from IAM through its
# reader there, so a vended credential speaks for its role everywhere.
service-com-amazonaws-sts-awssecuritytokenservicev20110615 = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
hex = { workspace = true }
# Writes the CA and end-entity certificates the native session suite presents, so the
# bytes under test are built by something other than the code under test.
rcgen = "0.13"
# Generates the RSA key pair `rcgen`'s backend cannot, and signs with it, so the suite
# covers the RSA scheme beside the elliptic-curve one.
aws-lc-rs = "1"
# Seeds the role a vended session is a session of, as `iam:CreateRole` records it.
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }

[lints]
workspace = true
