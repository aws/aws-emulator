[package]
name = "service-com-amazonaws-ec2-amazonec2"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
# `state::volume_notifications` publishes a volume's create outcome when that outcome falls
# due, from a bounded task that resumes then, so this service's tokio needs the timer driver and
# the semaphore that caps those tasks on top of the workspace's features.
tokio = { workspace = true, features = ["sync", "time"] }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Opaque pagination cursors: hex makes a `NextToken` this service did not mint
# detectable, which is what lets a paginating describe refuse a malformed one.
hex = { workspace = true }
# JPEG codec for the instance console screen `GetConsoleScreenshot` reports: the
# operation documents its image as a JPG, so the bytes have to be one.
jpeg-encoder = "0.6"
# The 8x8 monochrome console font that screen's text is drawn with.
font8x8 = "0.3"
# `GetConsoleScreenshotResult$ImageData` carries the image as base64 text, and the body of
# the armoured public key file an import may carry is base64 too.
base64 = "0.22"
# The zlib stream a UEFI variable store travels in: "a base64 encoded and zlib compressed
# binary value" is what `GetInstanceUefiData` reports a store as, so the bytes have to be a
# real zlib stream. Pure Rust, like the other codecs here.
flate2 = "1"
# The 2048-bit RSA key pair `CreateKeyPair` generates: the operation hands the caller the
# private half, so the key has to be a real key. The NitroTPM endorsement key
# `GetInstanceTpmEkPub` reports comes from the same generator, in both key types it publishes.
aws-lc-rs = "1"
# The PKCS#1 `RSAPrivateKey` an RSA key pair's PEM private key is ("an unencrypted PEM
# encoded PKCS#1 private key"), read out of the PKCS#8 `aws-lc-rs` encodes a key as; its
# `pkcs8` feature carries the `rsaEncryption` algorithm identifier an imported RSA public
# key's DER `SubjectPublicKeyInfo` is written under.
pkcs1 = { version = "0.7", features = ["pem", "pkcs8"] }
# Reads that PKCS#8 structure, whose `privateKey` IS the PKCS#1 one.
pkcs8 = "0.10"
# The `SubjectPublicKeyInfo` an imported RSA public key's fingerprint is taken over
# (RFC 5280).
spki = { version = "0.7", default-features = false, features = ["alloc"] }
# The SHA-1 digest an RSA key pair's fingerprint is (`KeyPair$KeyFingerprint`).
sha1 = "0.10"
# The MD5 digest an IMPORTED RSA key pair's fingerprint is instead ("the MD5 public key
# fingerprint as specified in section 4 of RFC4716", `KeyPairInfo$KeyFingerprint`).
md-5 = "0.10"
# The OpenSSH key formats: an Ed25519 key pair, the PEM private key and the one-line public
# key OpenSSH writes for one, the base64 SHA-256 fingerprint it prints for it, and the
# public key an `ImportKeyPair` carries.
ssh-key = { version = "0.6", default-features = false, features = ["alloc", "ed25519", "getrandom"] }
# Reads the 32 bytes of an IMPORTED ED25519 public key as a point on that curve: the key
# formats carry those bytes without deciding whether they encode a key at all, so this is what
# tells a key an import can take from a key body that was mangled on its way here.
ed25519-dalek = "2"
# The SSH wire encoding of a key's own components, which the PuTTY private key file a
# `ppk` key format asks for is built out of.
ssh-encoding = { version = "0.2", features = ["alloc"] }
# The keyed digest that file's integrity line carries.
hmac = "0.12"
# The civil-calendar arithmetic the Athena integration template's daily partitions are laid
# out on: the days a partition range covers, and their year/month/day prefixes.
chrono = { version = "0.4", default-features = false, features = ["std"] }
# The `#cloud-config` user data an instance's guest runs at boot is YAML, and its `bootcmd`
# and `runcmd` are what the boot performs; yaml-rust2 is the pure-Rust YAML 1.2
# implementation the other services that read caller-supplied YAML use.
yaml-rust2 = { version = "0.10", default-features = false }
# The MIME multipart archive a user data may arrive as: its header block and its parts carry
# one document each, and reading a MIME message is what `mailparse` does — the same reading
# the services that read an RFC 5322 message use, rather than a second header parser here.
mailparse = "0.16"
# A cloud-config command written as an ARGUMENT VECTOR is run without a shell, so the words
# are quoted back into the one command line that stands for that vector rather than joined by
# hand; shell-words is the maintained POSIX word quoter.
shell-words = "1.1"
# The bytes a guest's own RANDOM DEVICE answers (`state::guest_disk_io`): a script that
# generates a payload to write through a block device reads them from `/dev/urandom`, so they
# come from the maintained generator every other service of this workspace draws random bytes
# from rather than from a sequence written here.
rand = "0.9"
# The `application/x-www-form-urlencoded` parameter list an ec2Query request's body is,
# read by the authorization gate to learn the resources the request addresses.
form_urlencoded = "1"
# The shared XML rendering of a floating-point member, which AWS writes as a decimal
# carrying a fractional part where Rust's own rendering drops it, and the ONE
# evaluation of IAM policy documents the authorization gate decides a request with.
service-common = { path = "../common" }
# The EBS DIRECT APIs and EC2 describe ONE snapshot resource: a snapshot `ebs:StartSnapshot`
# minted is read back through `ec2:DescribeSnapshots`, so this service reads THAT service's
# own state accessor rather than keeping a second copy of its snapshots.
service-com-amazonaws-ebs-ebs = { workspace = true }
# A Recycle Bin retention rule is the `rbin` service's resource: whether a deleted EBS
# resource is retained rather than permanently deleted is decided by THAT service's rules, so
# this service reads its own state accessor rather than keeping a second copy of them.
service-com-amazonaws-rbin-amazonrecyclebin = { workspace = true }
# The IAM store holds the identity-based policies of the principal a request speaks
# for, and the STS store resolves which principal that is: the authorization gate
# reads both services' OWN state accessors rather than keeping a second copy of
# either fact.
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
service-com-amazonaws-sts-awssecuritytokenservicev20110615 = { workspace = true }
# A certificate is ACM's resource: `CreateClientVpnEndpoint` resolves the server and client
# root certificates it is given against that service's own `DescribeCertificate`, over the
# emulator's in-process callback, rather than keeping a second copy of them.
aws-sdk-acm = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
# `state::volume_encryption`: the AWS KMS client an encrypted EBS volume's data key is asked
# for, over the in-process callback into this same emulator — the key's state and the
# permissions on it are KMS's own to judge, so a volume under a key that will not produce a
# data key is withdrawn rather than created.
aws-sdk-kms = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
# `state::ssm_image_aliases`: the AWS Systems Manager client an `ImageId` of the
# `resolve:ssm:` form is resolved through, over the in-process callback into this same
# emulator — the parameter such a value names is Parameter Store's own resource, so the launch
# that turns it into an AMI id asks that service rather than keeping a second copy of it.
aws-sdk-ssm = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
# `state::volume_notifications`: the EventBridge client an EBS volume's create outcome is
# published through, over the in-process callback into this same emulator — the bus the event
# reaches a client's rules on is that service's own. No network client feature is enabled: the
# transport is the emulator's own.
aws-sdk-eventbridge = { version = "1", default-features = false }
# `state::instance_telemetry`: the AWS/EC2 series a running instance publishes about itself, and
# `state::nat_gateway_metrics`: the `AWS/NATGateway` traffic metrics a NAT gateway publishes. A
# metric has ONE home — the metric store that OWNS it, the one CloudWatch's own `ListMetrics`,
# `GetMetricStatistics` and alarm evaluation read — so both append their datapoints through that
# service's own state accessor rather than keeping a second copy of the series beside it.
service-com-amazonaws-cloudwatch-graniteserviceversion20100801 = { workspace = true }
# `state::capacity_reservation_resource_groups`: the Resource Groups client the groups a Capacity
# Reservation has been added to are read from, over the in-process callback into this same
# emulator — a resource group and the membership in it are that service's resources, so
# `GetGroupsForCapacityReservation` asks it rather than keeping a second copy. No network client
# feature is enabled: the transport is the emulator's own.
aws-sdk-resourcegroups = { version = "1", default-features = false }
# `state::flow_log_s3_delivery`: the Amazon S3 client a flow log's destination bucket policy is
# amended through, over the in-process callback into this same emulator — the permissions the log
# delivery service needs to write a flow log's records are Amazon S3's own resource. No network
# client feature is enabled: the transport is the emulator's own.
aws-sdk-s3 = { version = "1", default-features = false }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# Declares one module per `tests/all/<name>.rs` from `tests/all/main.rs`, so this crate's one
# integration-test target picks each suite up from its own file.
automod = { workspace = true }
sha2 = { workspace = true }
# The import tests build the public key material they send and read the base64 digest an
# ED25519 import's fingerprint carries.
base64 = "0.22"
# The import tests compute the expected MD5 fingerprint of an imported RSA key over a DER
# `SubjectPublicKeyInfo` they write by hand, so the value is cross-checked against the
# standard rather than against the handler's own encoder.
md-5 = "0.10"
# The integration tests wait out a clock-owed transition with `tokio::time::sleep`,
# which needs the timer driver on top of the workspace's tokio features.
tokio = { workspace = true, features = ["time"] }
# Reads the ec2Query XML responses the integration tests assert on.
roxmltree = "0.20"
# Decoder used only by the tests, to prove the console screenshot really decodes
# as a JPEG of the screen geometry the handler reports.
zune-jpeg = "0.4"
# The ACM service, so the Client VPN tests can create the certificate an endpoint presents
# through the service that OWNS certificates, and read the refusal for one it does not hold.
# TEST-ONLY — `src/` reaches that service over the in-process callback instead.
service-com-amazonaws-acm-certificatemanager = { workspace = true }
# The flow-log delivery suite mounts the service that OWNS a destination bucket beside this one
# on a single engine — exactly as the assembled emulator does — because a create for an S3
# destination amends that bucket's policy by calling it in process.
service-com-amazonaws-s3-amazons3 = { workspace = true }
# The destination-existence suite mounts the OTHER two services that own a flow-log destination
# beside this one on a single engine, for the same reason: a create resolves the delivery stream
# it was pointed at against Amazon Data Firehose, and reads a log group back from CloudWatch
# Logs. TEST-ONLY — `src/` reaches both over the in-process callback instead.
service-com-amazonaws-firehose-firehose-20150804 = { workspace = true }
service-com-amazonaws-cloudwatchlogs-logs-20140328 = { workspace = true }
# The KMS service, so the encrypted-volume suite can create, disable and schedule deletion of a
# real key through the service that OWNS keys and watch what EC2 does with a volume under it.
# TEST-ONLY — `src/` reaches that service over the in-process callback instead.
service-com-amazonaws-kms-trentservice = { workspace = true }
# The EventBridge and Amazon SQS services, so the volume-notification suite can read the event a
# volume's create outcome is published as off the queue a real rule on the real default bus
# delivered it to, rather than from this crate's own state.
# TEST-ONLY — `src/` publishes over the in-process callback instead.
service-com-amazonaws-eventbridge-awsevents = { workspace = true }
service-com-amazonaws-sqs-amazonsqs = { workspace = true }
# The Resource Groups service, so the Capacity Reservation group suite can create a group and add
# a reservation to it through the service that OWNS groups and memberships, and watch what
# `GetGroupsForCapacityReservation` reports off it.
# TEST-ONLY — `src/` reaches that service over the in-process callback instead.
service-com-amazonaws-resourcegroups-ardi = { workspace = true }
# Builds the real certificate, chain and key the Client VPN export suite imports into ACM, so
# the material the exported configuration file embeds is a certificate something other than the
# code under test produced. TEST-ONLY.
rcgen = "0.13"

[lints]
workspace = true
