[package]
name = "service-com-amazonaws-kafka-kafka"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Reads a submitted `server.properties` body the way a Java properties file is read
# (ISO-8859-1 bytes, `name=value`/`name:value`/whitespace separators, comments,
# continued lines, escapes), which is the format an MSK configuration IS: the
# configuration writers validate the properties a body declares
# (`src/state/server_properties.rs`) rather than re-implementing that grammar.
java-properties = "2.0"
# Matches a replication flow's TopicsToReplicate / TopicsToExclude patterns, which
# the model documents as regular expressions, against a source cluster's topics.
regex = "1.13"
# The AWS SDK for EC2, driven over the in-process callback
# (`OperationContext::callback`): the account's subnets are EC2's resources, so every
# create that places a resource in a client VPC resolves the subnets it is given against
# EC2 (`src/state/network.rs`) before it mints anything. Only the generated client is
# needed — the emulator supplies the transport.
aws-sdk-ec2 = { version = "1", default-features = false }
# The AWS SDK for Secrets Manager, driven over the same in-process callback: a
# cluster's SASL/SCRAM credentials live in Secrets Manager secrets, so whether one of
# them can be associated at all is resolved against Secrets Manager's own
# `DescribeSecret` (`src/state/scram_secret_admission.rs`) rather than assumed. Only
# the generated client is needed — the emulator supplies the transport.
aws-sdk-secretsmanager = { version = "1", default-features = false }
# `arn::region_label`: the ONE reading of a caller-supplied Region as a Region LABEL,
# which is what the endpoint the EC2 call above is made at is built from;
# `iam_authorization`: the shared evaluation of IAM policy documents against
# (action, resource), which this service's authorization gate runs; `iam_role`: the one
# reading of an IAM role ARN, and the one in-process question about whether a role
# PASSED to a service can be assumed, which the replicator's service-execution role is
# resolved through.
service-common = { path = "../common" }
# The IAM store holds the identity-based policies of the principal a request speaks
# for, and the STS store resolves which principal that is: the authorization gate
# (`src/state/identity_authorization.rs`) reads both services' OWN state accessors
# rather than keeping a second copy of either fact.
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
service-com-amazonaws-sts-awssecuritytokenservicev20110615 = { workspace = true }
# Which `KmsKeyId` names a key of the secret's own and which names the Amazon Web
# Services managed Secrets Manager key is Secrets Manager's own rule, published by its
# state module (`envelope::customer_managed_key`): the SCRAM-secret admission reads it
# from there rather than keeping a second copy of that reading.
service-com-amazonaws-secretsmanager-secretsmanager = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[lints]
workspace = true
