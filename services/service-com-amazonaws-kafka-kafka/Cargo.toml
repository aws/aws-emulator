[package]
name = "service-com-amazonaws-kafka-kafka"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true, features = ["io-util", "net"] }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Reads a submitted `server.properties` body the way a Java properties file is read
# (ISO-8859-1 bytes, `name=value`/`name:value`/whitespace separators, comments,
# continued lines, escapes), which is the format an MSK configuration IS: the
# configuration writers validate the properties a body declares
# (`src/state/server_properties.rs`) rather than re-implementing that grammar.
java-properties = "2.0"
# Matches a replication flow's TopicsToReplicate / TopicsToExclude patterns, which
# the model documents as regular expressions, against a source cluster's topics.
regex = "1.13"
# Percent-encodes one non-greedy `@httpLabel` path segment, which is how a cluster
# ARN travels in a topic call's URI: the data-plane authorization refusal quotes the
# resource as the request carried it (`src/state/authorization.rs`), so the encoding
# comes from the crate that owns it rather than a second encoder of this crate's own.
percent-encoding = "2.3"
# Encodes and decodes the Apache Kafka wire protocol (request/response frames, their
# per-API versions and the older record formats), which is what the cluster's broker
# endpoint SPEAKS (`src/state/broker_plane/`): the messages are the protocol's, so they
# are read with the protocol's own implementation rather than hand-rolled. NO compression
# codec is taken from it: a batch's codec is the caller's choice, so each one is read
# through the bounded decode in `src/state/broker_plane/codecs.rs` instead, and this
# crate's own decoder then reads only an uncompressed batch.
kafka-protocol = { version = "0.18", default-features = false, features = ["broker", "client"] }
# The CRC-32C a record batch states over itself, which a broker checks before it appends
# a batch and states over the batch it answers a fetch with (Apache Kafka record batch).
crc32c = "0.6"
# Renders the instant a BROKER LOG LINE carries in Apache Kafka's own log4j layout
# (`%d` — `yyyy-MM-dd HH:mm:ss,SSS` in UTC) and the day segments the delivered log
# object's key sits under (`src/state/broker_logs.rs`): the calendar conversion comes
# from the maintained library rather than from arithmetic of this crate's own.
chrono = { version = "0.4", default-features = false, features = ["std"] }
# The four codecs a Kafka record batch may travel in, which a producer names in the batch
# it sends (`src/state/broker_plane/codecs.rs`). Capability class: LIBRARIES computing over
# a buffer in process — each is PURE RUST, so this endpoint links no native compression
# library and nothing here compiles C at build time: `flate2` (over `miniz_oxide`) reads
# and writes the gzip stream, `lz4_flex` the LZ4 frame, `ruzstd` the Zstandard frame, and
# `snap` the raw snappy blocks Kafka's snappy framing carries. Each decode is handed
# caller-chosen bytes, so each runs under a byte budget the record layer spends across one
# payload and refuses past it rather than holding what a codec expands to.
flate2 = "1"
lz4_flex = "0.14"
ruzstd = "0.9"
snap = "1"
# The SASL/SCRAM-SHA-512 exchange a Kafka client completes against that endpoint:
# PBKDF2-HMAC-SHA-512 over the credential, and the HMAC/hash the proof and the server
# signature are computed with (RFC 5802).
hmac = "0.13"
sha2 = "0.11"
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
# The salt and the server nonce of that exchange, which RFC 5802 requires to be
# unpredictable per connection.
rand = "0.9"
# The AWS SDK for EC2, driven over the in-process callback
# (`OperationContext::callback`): the account's subnets are EC2's resources, so every
# create that places a resource in a client VPC resolves the subnets it is given against
# EC2 (`src/state/network.rs`) before it mints anything. Only the generated client is
# needed — the emulator supplies the transport.
aws-sdk-ec2 = { version = "1", default-features = false }
# The AWS SDK for Secrets Manager, driven over the same in-process callback: a
# cluster's SASL/SCRAM credentials live in Secrets Manager secrets, so whether one of
# them can be associated at all is resolved against Secrets Manager's own
# `DescribeSecret` (`src/state/scram_secret_admission.rs`) rather than assumed. Only
# the generated client is needed — the emulator supplies the transport.
aws-sdk-secretsmanager = { version = "1", default-features = false }
# `arn::region_label`: the ONE reading of a caller-supplied Region as a Region LABEL,
# which is what the endpoint the EC2 call above is made at is built from;
# `iam_authorization`: the shared evaluation of IAM policy documents against
# (action, resource), which this service's authorization gate runs; `iam_policy`: the
# ONE reading of the IAM JSON policy language's grammar, which the cluster-policy attach
# validates its document against (`src/state/cluster_policy.rs`); `json_document::minified`:
# the ONE canonicalization of a JSON document a service stores and reports back, which is
# the form a stored cluster policy is kept in; `iam_role`: the one reading of an IAM role
# ARN, and the one in-process question about whether a role PASSED to a service can be
# assumed, which the replicator's service-execution role is resolved through.
service-common = { path = "../common" }
# The IAM store holds the identity-based policies of the principal a request speaks
# for, and the STS store resolves which principal that is: the authorization gate
# (`src/state/identity_authorization.rs`) reads both services' OWN state accessors
# rather than keeping a second copy of either fact.
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
service-com-amazonaws-sts-awssecuritytokenservicev20110615 = { workspace = true }
# Which `KmsKeyId` names a key of the secret's own and which names the Amazon Web
# Services managed Secrets Manager key is Secrets Manager's own rule, published by its
# state module (`envelope::customer_managed_key`): the SCRAM-secret admission reads it
# from there rather than keeping a second copy of that reading.
service-com-amazonaws-secretsmanager-secretsmanager = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# Declares one module per `tests/all/<name>.rs` from `tests/all/main.rs`, so this crate's one
# integration-test target picks each suite up from its own file.
automod = { workspace = true }
# The data-plane suite drives a real Apache Kafka client against a cluster's own socket
# in ONE process: `rustls` / `tokio-rustls` run the client side of the TLS the encrypted
# access paths are served over, which the core terminates. Both are the versions this
# workspace already builds.
rustls = { workspace = true }
tokio-rustls = "0.26"
# A SASL/SCRAM secret names a customer managed key, and Secrets Manager seals the value it
# stores under that key by asking KMS: the suite that drives a credential sealed that way
# mounts the service that OWNS the key beside this one, on the same engine, and mints the
# key through its own `CreateKey`.
service-com-amazonaws-kms-trentservice = { workspace = true }
# The CRC-32 Apache Kafka's older message formats checksum every message with, which the
# data-plane suite frames those formats with: the same crate this crate's record layer takes
# it from, so the suite's framing and the broker's agree by construction rather than by a
# second implementation.
flate2 = "1"

[lints]
workspace = true
