[package]
name = "service-com-amazonaws-invoicing-invoicing"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Encodes/decodes the opaque `NextToken` this service's paginated operations hand out,
# and renders the `@idempotent` request digest in `crate::state`.
hex = { workspace = true }
# `crate::state::idempotent_request_digest`: the maintained digest an `@idempotent`
# replay key mixes the request it is a record OF through, rather than one written here.
sha2 = { workspace = true }
# The calendar `ListInvoiceSummaries`' documented temporal rules are stated in: a
# maintained proleptic Gregorian calendar, rather than month arithmetic written here.
chrono = { version = "0.4", default-features = false, features = ["std"] }
# `service-common` carries `page_tokens`: the one secret a store authenticates a value it
# hands out and takes back under, which is what makes a document address `GetInvoicePDF`
# minted one no caller could have assembled.
service-common = { path = "../common" }
# `crate::state::draw_portal_validation_code`: the uniform draw the procurement-portal
# validation code a submission has to match comes from — the maintained generator crate's
# own range draw over a cryptographically secure generator seeded from the operating
# system, rather than sampling written here.
rand = "0.9"
# Writes the PDF invoice documents this service's document plane serves, so a document a
# `GetInvoicePDF` URL leads to is produced by a PDF writer rather than hand-assembled
# bytes.
pdf-writer = "0.13"

[build-dependencies]
emulator-core-build-support = { workspace = true }

[lints]
workspace = true
