[package]
name = "service-com-amazonaws-resourcegroupstaggingapi-resourcegroupstaggingapi-20170126"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Digests the request's filters into the opaque pagination token, so a token is
# only accepted back by the projection it was cut from.
sha2 = { workspace = true }
# Renders that digest as the hex half of the pagination token's body.
hex = { workspace = true }
# Writes that body as the one opaque run of characters a `PaginationToken` is,
# and reads a presented token back.
base64 = "0.22"
# The services that OWN the resources this API tags: a tag written here is
# written to the owning service's own tag set, and an ARN that service holds no
# resource for is reported with ITS not-found code. Reached through the shared
# engine, which needs the owning service's state TYPE. See `src/state/owners.rs`.
service-com-amazonaws-apigateway-backplanecontrolservice = { workspace = true }
# AWS HealthScribe / health-agent (connecthealth): a Domain, and the Subscriptions under
# it, carry the tag set this API reads and writes for the `health-agent` namespace.
service-com-amazonaws-connecthealth-connecthealth = { workspace = true }
service-com-amazonaws-sqs-amazonsqs = { workspace = true }
service-com-amazonaws-ecs-amazonec2containerservicev20141113 = { workspace = true }
service-com-amazonaws-elasticloadbalancingv2-elasticloadbalancing-v10 = { workspace = true }
service-com-amazonaws-eventbridge-awsevents = { workspace = true }
service-com-amazonaws-glue-awsglue = { workspace = true }
service-com-amazonaws-kms-trentservice = { workspace = true }
service-com-amazonaws-lambda-awsgirapiservice = { workspace = true }
service-com-amazonaws-secretsmanager-secretsmanager = { workspace = true }
service-com-amazonaws-sfn-awsstepfunctions = { workspace = true }
service-com-amazonaws-sns-amazonsimplenotificationservice = { workspace = true }
# The shared constraint-refusal renderings: the collecting walk that reports what
# the request held at the member a clause is about, and the restoring of a clause
# stated at a COLLECTION from it. See `src/service/submitted_collections.rs`.
service-common = { path = "../common" }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# Amazon EC2 Auto Scaling owns the Auto Scaling group an ECS capacity provider binds onto,
# and ECS resolves that reference against this service's records, so the propagation suite
# creates the group through its OWN API before creating the provider it tags.
service-com-amazonaws-autoscaling-autoscaling-2011-01-01 = { workspace = true }

[lints]
workspace = true
