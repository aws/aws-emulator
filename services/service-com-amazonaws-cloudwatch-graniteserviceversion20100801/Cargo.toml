[package]
name = "service-com-amazonaws-cloudwatch-graniteserviceversion20100801"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
# The alarm clock (`state::alarm_actions::drive_alarm_clock`) waits for the instant an
# evaluation becomes due, so this crate needs tokio's timer as well as its runtime and
# macros: the feature is declared here rather than relied on from another crate's resolution.
tokio = { workspace = true, features = ["time"] }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Opaque pagination cursors: hex makes a token this service did not mint detectable,
# which is what lets DescribeAlarms refuse a malformed NextToken.
hex = { workspace = true }
# Whether a `NextToken` is an opaque blob AT ALL is answered by the maintained base64 codec
# (`state::reads_as_a_page_token`), which is what lets a paginated read tell a value that is no
# token from a token it did not mint; the widget-image suite decodes the `MetricWidgetImage`
# blob off this service's JSON wire with the same codec.
base64 = "0.22"
# `arn`: the ONE parse of a caller-supplied resource ARN, shared with every other service —
# an alarm action's ARN (and the Region and account of the alarm's own ARN) is read through
# it rather than split here.
service-common = { path = "../common" }
# The AWS SDK for SNS, driven over the in-process callback
# (`OperationContext::callback`): an alarm state transition executes its SNS topic actions
# with `Publish` (`state::alarm_actions::settle_alarms`). Only the generated client is
# needed — the emulator supplies the transport, so the SDK's own HTTPS stack and runtime are
# left out.
aws-sdk-sns = { version = "1", default-features = false }
# The AWS SDK for EC2, driven over the same in-process callback: an alarm's EC2 INSTANCE action
# (`arn:aws:automate:region:ec2:stop|terminate|reboot|recover`) is that EC2 operation performed
# on the instance the alarm watches (`state::alarm_actions::ec2_instance_actions`). Only the
# generated client is needed — the emulator supplies the transport.
aws-sdk-ec2 = { version = "1", default-features = false }
# The AWS SDK for AWS Lambda, driven over the same in-process callback: an alarm's LAMBDA
# function action is an invocation of the function its ARN names, decided by that function's own
# resource-based policy (`state::alarm_actions::lambda_actions`). Only the generated client is
# needed — the emulator supplies the transport.
aws-sdk-lambda = { version = "1", default-features = false }
# The AWS SDK for Amazon EventBridge, driven over the same in-process callback: every alarm
# state transition publishes a state-change event onto the account's default event bus
# (`state::alarm_actions::state_change_events`), through the shared client construction in
# `service-common`. Only the generated client is needed — the emulator supplies the transport.
aws-sdk-eventbridge = { version = "1", default-features = false }
# The AWS SDK for Amazon Data Firehose, driven over the same in-process callback: a running
# metric stream exports its records into the delivery stream its `FirehoseArn` names with
# `PutRecord` (`state::metric_stream_export`). Pinned to the release the other producers of
# Firehose records in this workspace are pinned to, so one version of the client is locked.
# Only the generated client is needed — the emulator supplies the transport.
aws-sdk-firehose = { version = "=1.126.0", default-features = false }
# GetMetricData's cursor carries a fixed-size digest of the request it was minted for, so a
# token replayed against a different request is refused at constant token size.
sha2 = { workspace = true }
# `state::metric_widget::render`: the graph `GetMetricWidgetImage` answers with IS a data plot,
# so the maintained plotting library rasterises it (its lines, columns and markers) instead of
# a second rasteriser being written here. Only the in-memory bitmap backend is taken: no file
# or SVG output, and no system font lookup.
plotters = { version = "0.3", default-features = false, features = ["bitmap_backend"] }
# The bitmap that backend draws into is encoded as the PNG the `MetricWidgetImage` blob
# carries by the maintained encoder.
png = "0.17"
# `state::metric_widget::render::lettering`: a graph's axis labels are the series' own numbers,
# so the glyphs they are written in come from the maintained 8x8 bitmap font rather than from a
# hand-drawn glyph table here. Only its glyph data is taken — the plotting library's own text
# support needs a font file this emulator does not ship.
font8x8 = "0.3"

# `state::alarm_mute_rules`: an alarm mute rule's schedule is a cron expression
# (`Schedule$Expression`), so the maintained cron grammar reads the instants its windows open at
# rather than a second parser being written here.
cron = "0.15"
# The calendar arithmetic those windows need: the local instant an `at` expression names, and the
# moment it happens at in the schedule's own time zone. `now` is taken as well as `std`: the mute
# rule suites state the instants their rows mean relative to the clock they run on.
chrono = { version = "0.4", default-features = false, features = ["std", "now"] }
# The time zone a schedule is evaluated in (`Schedule$Timezone`), resolved against the IANA
# database rather than a hand-written offset table.
chrono-tz = { version = "0.10", default-features = false, features = ["std"] }
# `state::metric_stream_export::open_telemetry`: the records a metric stream whose `OutputFormat`
# is `opentelemetry1.0` or `opentelemetry0.7` exports are OpenTelemetry metrics messages in
# protobuf, so the maintained protobuf codec encodes and frames them. Its derive is a proc macro,
# so the message declarations here are encoded by generated code rather than by a hand-written
# serializer; the codec parses and writes nothing else.
prost = "0.14"

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# The OpenTelemetry protocol's own message definitions, used ONLY by the unit test that decodes
# an exported `opentelemetry1.0` record with them: that is what holds the records this crate
# renders (`state::metric_stream_export::open_telemetry`) to the published field numbers and wire
# types, instead of reading them back with the same declarations that wrote them. Only the
# generated messages are taken (no transport, no SDK pipeline).
opentelemetry-proto = { version = "0.33", default-features = false, features = [
    "gen-tonic-messages",
    "metrics",
] }
# SNS is mounted beside CloudWatch on one engine in the alarm-action tests, because an
# alarm's action is an SNS topic and a notification is asserted where a client sees it: on
# the topic's subscription.
service-com-amazonaws-sns-amazonsimplenotificationservice = { workspace = true }
# SQS is mounted with them, because the subscriber of the alarm's topic is a queue and that
# is where the delivered notification is read.
service-com-amazonaws-sqs-amazonsqs = { workspace = true }
# EC2 is mounted with them for the alarm-action suites that drive an EC2 INSTANCE action: the
# action is an operation on an instance, so what it did is asserted on the instance EC2 itself
# reports.
service-com-amazonaws-ec2-amazonec2 = { workspace = true }
# Amazon Data Firehose is mounted beside CloudWatch on one engine in the metric-stream
# delivery suite, because a metric stream's destination is a Firehose delivery stream and the
# exported records are asserted where a client sees them: in that stream's own destination.
service-com-amazonaws-firehose-firehose-20150804 = { workspace = true }
# Amazon S3 is mounted with it, because the Firehose destination the exported records land in
# is an S3 bucket and that is where a consumer reads them.
service-com-amazonaws-s3-amazons3 = { workspace = true }
# The destination reads of that suite go through Amazon S3's own restXml wire, so its listings
# are read with the same XML reader that service's tests use.
quick-xml = "0.41"
# EventBridge is mounted beside CloudWatch on one engine in the state-change-event suite,
# because every alarm transition publishes an event onto the default bus and the event is
# asserted where a client sees it: on the queue a matching rule targets.
service-com-amazonaws-eventbridge-awsevents = { workspace = true }
# AWS Lambda is mounted beside it in the Lambda-alarm-action suite, because such an action
# INVOKES a function and what the invocation did is asserted where a client sees it.
service-com-amazonaws-lambda-awsgirapiservice = { workspace = true }
# CloudWatch Logs is mounted with them, because a function's run is observed in its own log
# group — the place a client reads what a handler printed.
service-com-amazonaws-cloudwatchlogs-logs-20140328 = { workspace = true }
# The deployment package that suite uploads is a .zip archive it writes in memory.
zip = { version = "9", default-features = false, features = ["deflate"] }

[lints]
workspace = true
