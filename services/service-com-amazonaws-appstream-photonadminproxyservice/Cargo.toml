[package]
name = "service-com-amazonaws-appstream-photonadminproxyservice"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
# Hex codec for the opaque pagination cursor a Describe's `NextToken` carries.
hex = { workspace = true }
# The shared reading of a caller-supplied IAM role ARN, and the in-process hop IAM is
# asked about it over.
service-common = { path = "../common" }
# Digest behind the unique identifier the usage-report log bucket's name carries.
sha2 = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# Percent-decoder for the tests that read back a path this emulator signed into a URL.
percent-encoding = "2.3"

[build-dependencies]
emulator-core-build-support = { workspace = true }

[lints]
workspace = true
