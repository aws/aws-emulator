[package]
name = "service-com-amazonaws-appstream-photonadminproxyservice"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
# Hex codec for the opaque pagination cursor a Describe's `NextToken` carries.
hex = { workspace = true }
# The shared reading of a caller-supplied IAM role ARN, and the in-process hop IAM is
# asked about it over.
service-common = { path = "../common" }
# Digest behind the unique identifier the usage-report log bucket's name carries.
sha2 = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# The AWS SDK for EC2, driven over the in-process callback
# (`OperationContext::callback`): the interface VPC endpoint a stack's `AccessEndpoints`
# entry references is EC2's resource, so `src/state/vpc_access_endpoints.rs` asks EC2 what
# the account has rather than deciding it here. Only the generated client is needed — the
# emulator supplies the transport.
aws-sdk-ec2 = { version = "1", default-features = false }

[dev-dependencies]
# Percent-decoder for the tests that read back a path this emulator signed into a URL.
percent-encoding = "2.3"
# The EC2 service, mounted beside this one in the test harness: that a stack can only
# reference an interface VPC endpoint the account really has, for the AppStream streaming
# service, is driven end to end with the owner of VPC endpoints on the same engine.
# DEV-ONLY: this crate depends on no other service's crate outside its tests.
service-com-amazonaws-ec2-amazonec2 = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[lints]
workspace = true
