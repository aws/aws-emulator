[package]
name = "service-com-amazonaws-secretsmanager-secretsmanager"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# A secret value is stored enveloped under the secret's KMS key: this is the KMS
# client the seal and open calls go out over the in-process callback with.
aws-sdk-kms = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
# AES-256-GCM (and the OS CSPRNG for its nonce) for the envelope a secret value is
# sealed in under the data key KMS wrapped, and the SHA-256 an idempotent replay
# compares a value by; already in this workspace's lock file.
ring = "0.17"
# Secret version ids are UUIDs (SecretVersionIdType, len 32..64), and the six
# random characters that end a secret's ARN are drawn from a random UUID too.
uuid = { version = "1", features = ["v4"] }
# Hex-encodes a pagination cursor (ListSecrets, ListSecretVersionIds) into an
# opaque NextToken.
hex = { workspace = true }
# The STS store, for the identity an access key id speaks for: the principal
# `sts:GetCallerIdentity` answers for the credentials a request signed with.
service-com-amazonaws-sts-awssecuritytokenservicev20110615 = { workspace = true }
# The IAM store, for the identity-based policy documents in force on that principal.
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
# `iam_authorization`: the shared evaluation of those documents against an action on a
# resource, so every service that enforces authorization decides alike. `iam_role` and
# `arn`: which IAM entity a principal ARN names, and whether a `SecretId` is an ARN.
service-common = { path = "../common" }
# The KMS store, for the judgement a secret's own key makes about the caller a seal or an
# open is performed for: `kms:GenerateDataKey` on a write and `kms:Decrypt` on a read are
# KMS's own decisions, taken where the key policy and the grants on the key live.
service-com-amazonaws-kms-trentservice = { workspace = true }
# The Lambda client a rotation drives its rotation function over, in process through the
# emulator's own callback.
aws-sdk-lambda = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
# Evaluates the cron() rotation schedule a secret stores: the occurrences it names on the
# calendar, which is what the next rotation of such a secret is due at.
cron = "0.15"
# The UTC calendar those occurrences are counted on ("Secrets Manager rotation schedules use
# UTC time zone"), which is also the clock type the cron evaluator reads.
chrono = { version = "0.4", default-features = false, features = ["std"] }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
# Renders a policy document through `serde_json` with one indent after another, which is
# how the reported-form suite states the whitespacings a caller's renderer produces.
serde = { workspace = true }
# The seeded generator the version-id invariant suite draws its write sequences
# from, so the rule is checked over generated input rather than one table of rows.
rand = "0.9"
# SecretBinary is a blob, which awsJson1_1 carries base64-encoded on the wire.
base64 = "0.22"
# The rotation suite mounts Lambda beside this service on one engine, exactly as the
# assembled router mounts them, so the rotation function a rotation drives is a real
# function running its own deployment package.
service-com-amazonaws-lambda-awsgirapiservice = { workspace = true }
# The bucket that rotation function writes its backup copies to, mounted beside this service
# on one engine: the side effect a client watches a rotation by is asserted where a client
# reads it, through Amazon S3's own API.
service-com-amazonaws-s3-amazons3 = { workspace = true }
# That deployment package is a .zip archive the suite writes in memory, the way a caller
# uploads one.
zip = { version = "9", default-features = false, features = ["deflate"] }

[lints]
workspace = true
