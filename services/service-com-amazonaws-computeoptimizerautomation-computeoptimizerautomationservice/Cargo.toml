[package]
name = "service-com-amazonaws-computeoptimizerautomation-computeoptimizerautomationservice"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
# The principal an authorization refusal names is the identity STS reports for
# the credential the request signed with, so it is resolved from the STS store
# (see `state::caller_identity_arn`) rather than invented here: one credential
# must have one principal across this service and `sts:GetCallerIdentity`.
service-com-amazonaws-sts-awssecuritytokenservicev20110615 = { workspace = true }
# The organization root, the OUs under it and the node each member account sits under
# are records the Organizations control plane owns, and an organization enrollment
# configuration is resolved through that hierarchy (see
# `state::OrganizationHierarchy`), so this service reads it from that service's store
# rather than keeping a second copy of the organization.
service-com-amazonaws-organizations-awsorganizationsv20161128 = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# `addressed_resource`: the shared pre-dispatch read of the string a request names the
# resource it acts on by, and the gate that decides which request names none — the same
# read in every service whose authorization of a caller-supplied resource comes before the
# modelled walk, so this service parameterises it rather than keeping a second copy.
service-common = { path = "../common" }
# Minting a `ruleId` (16 chars of `[0-9A-Za-z]`) and fingerprinting a request for
# the client-token ledger are both digests; `hex` renders them.
sha2 = { workspace = true }
hex = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# Declares one module per `tests/all/<name>.rs`, so the crate's single integration-test
# target picks up a new suite without a hand-written `mod` line.
automod = { workspace = true }
# Encodes the rpcv2Cbor request a CBOR client of this service sends, and decodes
# the error envelope it is answered in, so a test can assert the refusal this
# service serves over each protocol the model declares.
aws-smithy-cbor = "0.62.2"

[lints]
workspace = true
