[package]
name = "service-com-amazonaws-wafv2-awswaf-20190729"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# SHA-256 over OS-seeded randomness, the clock and a counter, hex-rendered: the
# UUIDv4-shaped `EntityId` and `LockToken` values WAFv2 mints (`state::new_uuid`).
sha2 = { workspace = true }
hex = { workspace = true }
# The regular expressions a `Regex$RegexString` carries, matched with the maintained
# crate rather than a hand-written matcher: its automaton does not backtrack, so a
# caller-stored pattern cannot blow up the time one request's evaluation takes.
regex = "1.13"
# CIDR containment for an `IPSet`'s `Addresses`, the same version the sibling
# elasticloadbalancingv2/ses services declare it at: one parse of a CIDR range and one
# definition of which addresses it holds.
ipnet = "2"
# Percent-decoding a query argument's value and the `URL_DECODE` text transformation —
# the encoding itself is the crate's, as the sibling s3/apigateway suites do it, rather
# than another hand-written copy of RFC 3986.
percent-encoding = "2"
# The `BASE64_DECODE` text transformation, through the maintained coder every other
# service in this tree decodes base64 with (ec2, lambda, secretsmanager).
base64 = "0.22"
# The authenticated encryption an `APIKey` value is: the key WAFv2 answers is an
# encrypted token over the key's own definition, sealed with the maintained AEAD
# implementation rather than a hand-rolled one (`state::api_keys`). Only the cipher
# and the allocating interface, so the crate pulls in no random-number backend of its
# own — the key and the nonce come from this crate's own entropy source.
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
# The `HTML_ENTITY_DECODE` text transformation: the maintained decoder for HTML character
# references, so a named, decimal or hexadecimal reference is decoded the way a browser
# decodes it rather than by a hand-written table.
html-escape = "0.2"
# The CloudWatch store the DATA plane publishes its per-dimension counters to (the
# `AWS/WAFV2` namespace, `service::metrics`): what a `VisibilityConfig` with
# `CloudWatchMetricsEnabled` asks WAF to send. CloudWatch refuses a `PutMetricData` into
# a reserved `AWS/` namespace, so a service's own metrics never travel over that API;
# this writes the very store `ListMetrics`, `GetMetricStatistics` and the alarm
# evaluation read.
service-com-amazonaws-cloudwatch-graniteserviceversion20100801 = { workspace = true }
# Exact decimal arithmetic over a `MonetizationAmountValue`, which the model carries
# as a string: a revenue total is a sum of money, so it is added as the decimal each
# amount spells rather than through a binary float (`state::monetization_amount`).
# The same crate the sibling dynamodb service reads a numeric attribute with.
bigdecimal = "0.4"
# `cloudwatch_logs`: the one reading of a log group's ARN this tree holds, which is how a
# web ACL's logging destination naming a log group is resolved, and the in-process
# CloudWatch Logs client the record of a decided request is delivered through
# (`service::logs`). `s3_client`: the in-process Amazon S3 client the same record is
# delivered through when the destination names a bucket, and `arn`: the one reading of a
# resource ARN that tells which kind of destination the configuration named.
service-common = { path = "../common" }
# `service::logs::delivered_objects`: a WAF log file delivered into a destination bucket IS
# a gzip stream, so it is written with the maintained DEFLATE implementation this workspace
# already compresses a vended log file with rather than by laying the framing out here.
flate2 = "1"
# ... and the UTC calendar fields that object's key is laid out by (the year, month, day,
# hour and minute of its prefix and the minute in its name), from the maintained calendar
# crate rather than by slicing a rendered timestamp.
chrono = { version = "0.4", default-features = false, features = ["std"] }
# The Amazon S3 request types the delivery above builds (the object's body stream), from the
# SDK the shared client is constructed from. Only the generated client is needed: the
# emulator supplies the transport, so the SDK's own HTTPS stack is left out.
aws-sdk-s3 = { version = "1", default-features = false }
# `service::logs::delivered_streams`: the in-process Amazon Data Firehose client the same
# record is handed to when the destination names a delivery stream, pinned at the version
# every other service that delivers into a stream (cognito-idp, logs, cloudwatch) declares.
aws-sdk-firehose = { version = "=1.126.0", default-features = false }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# `tests/all/logging_destination_delivery.rs` asserts where a web ACL's log records really
# ARRIVE, so each destination is created through the wire of the service that OWNS it and
# each delivered record is read back through that service's own reader: CloudWatch Logs for
# a log group, Amazon S3 for a bucket, Amazon Data Firehose for a delivery stream. The
# request the records are about is one the web ACL in front of an Amazon Cognito user pool
# decides — a user pool is one of the resource kinds `AssociateWebACL` takes — and that
# service takes this one as a normal dependency (it asks this crate for the decision), so
# the cycle closes through a dev-dependency, which Cargo allows. DEV-ONLY.
service-com-amazonaws-cognitoidentityprovider-awscognitoidentityproviderservice = { workspace = true }
service-com-amazonaws-cloudwatchlogs-logs-20140328 = { workspace = true }
service-com-amazonaws-firehose-firehose-20150804 = { workspace = true }
service-com-amazonaws-s3-amazons3 = { workspace = true }

[lints]
workspace = true
