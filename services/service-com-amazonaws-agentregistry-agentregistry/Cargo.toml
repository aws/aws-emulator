[package]
name = "service-com-amazonaws-agentregistry-agentregistry"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Hex codec for the opaque `nextToken` ListDiscoverableRegistryRecords mints.
hex = { workspace = true }
# SHA-256, for the digest of the search a SearchDiscoverableRegistryRecords pagination
# token belongs to.
sha2 = { workspace = true }
# String similarity (Sørensen–Dice), for how close a record's text is to a search query.
strsim = "0.11"
# The STS store, for the identity an access key id speaks for: the principal
# `sts:GetCallerIdentity` answers for the credentials a request signed with.
service-com-amazonaws-sts-awssecuritytokenservicev20110615 = { workspace = true }
# The IAM store, for the identity-based policy documents in force on that principal.
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
# The Agent Registry CONTROL plane, which owns every registry and registry record:
# this service binds no operation that creates one, so its discovery reads report that
# store rather than a second copy of it.
service-com-amazonaws-agentregistrycontrol-agentregistrycontrol = { workspace = true }
# The shared home for how a service states the framework's constraint refusal;
# `iam_authorization`, the shared evaluation of those documents against an action on a
# resource; and `iam_role`, which IAM entity a principal ARN names.
service-common = { path = "../common" }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# `time` is for the discovery suite's poll loops past a clock-owed transition; the
# workspace tokio feature set covers only `#[tokio::test]` itself.
tokio = { workspace = true, features = ["time"] }

[lints]
workspace = true
