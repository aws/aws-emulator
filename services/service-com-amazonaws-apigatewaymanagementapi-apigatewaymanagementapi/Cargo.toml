[package]
name = "service-com-amazonaws-apigatewaymanagementapi-apigatewaymanagementapi"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
# The tree's shared helpers: the cell naming who judges the `@connections` ENDPOINT a
# request was addressed through (`execute_api_connections_endpoint`), which the service
# that owns apis and stages installs its own reading into.
service-common = { path = "../common" }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Base64, for the ONE shape a `ConnectionId` has: API Gateway mints one as base64 of 11
# bytes, so `src/state.rs` decodes a caller's id with this maintained implementation rather
# than with a hand-written alphabet or length rule.
base64 = "0.22"
# Every `@connections` call is authorized by IAM — the caller needs
# `execute-api:ManageConnections` on the stage it addressed
# (`src/service/manage_connections_authorization.rs`) — so the decision reads the principal
# the request's access key id speaks for from the token service's own session registry and
# the policies in force on it from the IAM store, each over the shared engine, which needs
# the owning service's state TYPE.
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
service-com-amazonaws-sts-awssecuritytokenservicev20110615 = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
hex = { workspace = true }

[lints]
workspace = true
