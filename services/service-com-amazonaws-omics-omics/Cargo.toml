[package]
name = "service-com-amazonaws-omics-omics"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# `date_time_json`: the restJson1 codec that carries a `@timestampFormat("date-time")`
# timestamp as an RFC 3339 string, which every timestamp member of this model declares.
service-common = { path = "../common" }
# SHA-256 over a workflow definition, and the entropy behind each resource's UUID; the
# SHA-256/SHA-512 ETag families a sequence store can be created with.
sha2 = { workspace = true }
# Hex for the `WorkflowDigest`, the UUID groups and the opaque page tokens.
hex = { workspace = true }
# `md-5`: the MD5 digest of an ingested read set file, and the `MD5up` ETag family a
# sequence store ingests read sets under by default.
md-5 = "0.10"
# `flate2`: an ingested FASTQ read set file is a gzip stream, so the sequence records the
# read and base counts are taken from are behind a gzip frame.
flate2 = "1"
# `noodles-fastq`: the FASTQ record reader the ingested file's reads and bases are counted
# with, so no FASTQ parser is hand-written here.
noodles-fastq = "0.24"

[dev-dependencies]
# `automod::dir!`: declares every `tests/all/<suite>.rs` as a module of the single
# integration-test target, so a new suite needs no declaration of its own.
automod = { workspace = true }
# Percent-encoding for the `@httpLabel` and `@httpQuery` values this crate's tagging
# suite puts in a request path, so no test hand-rolls RFC 3986 escaping.
percent-encoding = "2.3"

[build-dependencies]
emulator-core-build-support = { workspace = true }

[lints]
workspace = true
