[package]
name = "service-com-amazonaws-networkmonitor-networkmonitor"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
# `service-common` carries two readers this crate needs.
# `aws_validation_refusal`: the shared wording of a boundary constraint refusal, so
# this service does not carry its own copy of how AWS states one.
# `arn`: the ONE statement of what an ARN is — `region_label` for the Region grammar,
# applied to the caller-supplied signing region before it reaches the AUTHORITY of the
# endpoint the in-process EC2 read is addressed at (`src/state.rs`, `ec2_client`), and
# `parse_of` for the six fields of the subnet ARN a probe's `sourceArn` names
# (`src/state.rs`, `subnet_id_of`).
# `iam_authorization`: the shared evaluation of IAM policy documents against an action
# on a resource, so this service's authorization gate (`src/service/authorization.rs`)
# reads a document exactly as every other service does.
# `iam_role`: which IAM entity a principal ARN names.
service-common = { path = "../common" }
# The STS store, for the identity an access key id speaks for: the principal
# `sts:GetCallerIdentity` answers for the credentials a request signed with.
service-com-amazonaws-sts-awssecuritytokenservicev20110615 = { workspace = true }
# The IAM store, for the identity-based policy documents in force on that principal.
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Opaque, URL-safe encoding for the `ListMonitors` pagination cursors this
# service vends.
hex = { workspace = true }
# The AWS SDK for EC2, driven over the in-process callback
# (`OperationContext::callback`): a probe's source is a VPC SUBNET, which is EC2's
# resource, so every `sourceArn` a write names is resolved against EC2
# (`src/state.rs`, `resolve_source_subnet`) rather than assumed from its shape.
# Only the generated client is needed — the emulator supplies the transport.
aws-sdk-ec2 = { version = "1", default-features = false }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
# The Amazon EC2 service, mounted BESIDE this one in
# `tests/all/probe_source_subnet_resolution.rs`: the subnets a probe's `sourceArn`
# resolves against are that service's resources, so the suite creates them through
# its own API over the in-process callback. DEV-ONLY: `src/` names no other
# service's crate, it reaches EC2 through the SDK client above.
service-com-amazonaws-ec2-amazonec2 = { workspace = true }

[lints]
workspace = true
