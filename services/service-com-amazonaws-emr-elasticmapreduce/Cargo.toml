[package]
name = "service-com-amazonaws-emr-elasticmapreduce"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
# `sync` and `time` on top of the workspace features: a notebook execution's own run
# happens on a thread of its own and reports back over a oneshot channel, waited for no
# longer than the run's bounds allow (`state::notebook_run`).
tokio = { workspace = true, features = ["sync", "time"] }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# The AWS SDK for IAM, driven over the in-process callback
# (`OperationContext::callback`): `RunJobFlow` resolves `JobFlowRole` to an EC2
# instance profile with `GetInstanceProfile` before launching a cluster. Only the
# generated client is needed — the emulator supplies the transport, so the SDK's
# own HTTPS stack and runtime are left out.
aws-sdk-iam = { version = "1", default-features = false }
# The AWS SDK for EC2, driven over the same in-process callback: `CreateStudio` resolves
# the VpcId, SubnetIds and security groups a Studio is wired to against the service that
# owns them before allocating one. Only the generated client is needed.
aws-sdk-ec2 = { version = "1", default-features = false }
# The tree's one ARN parse, for reading a `JobFlowRole` given as an ARN.
service-common = { path = "../common" }
# The IAM Identity Center identity store a Studio session mapping's user or group lives
# in, read through the same shared engine: a mapping names "the user or group" by its GUID
# or by its name, and the member the request did not carry is resolved against the
# identities `CreateUser`/`CreateGroup` wrote rather than derived here.
service-com-amazonaws-identitystore-awsidentitystore = { workspace = true }
# A cluster configured with the AWS Glue Data Catalog as its Hive metastore resolves the
# tables a step's work names in that catalog, so the step runner reads the ONE Glue Data
# Catalog store this emulator holds rather than keeping a second copy of it here.
service-com-amazonaws-glue-awsglue = { workspace = true }
# `sqlparser`: the SQL statement a step's command submits is read off that command by
# PARSING it with the maintained parser this workspace already uses for caller-supplied
# SQL; the `visitor` feature is what provides `ast::visit_relations`, the walk that
# reports every table a statement names.
sqlparser = { version = "0.59", features = ["visitor"] }
# `shell-words`: a step's command may arrive as one argument holding a whole command line
# (`bash -c '…'`), which is lexed with the POSIX shell's own word rules rather than split
# by hand — and the words of a step's own argument list are rendered BACK into one command
# line with the same crate's quoter, so the session that answers for it reads exactly those
# words (`state::step_command_status`).
shell-words = "1"
# The AWS SDK for EventBridge, driven over the in-process callback
# (`OperationContext::callback`): every state a step moves into is published onto the
# account's default event bus (`state::step_events`), and so is every state a CLUSTER moves
# into (`state::cluster_events`). Only the generated client is needed —
# the emulator supplies the transport, so the SDK's own HTTPS stack and runtime are left out.
aws-sdk-eventbridge = { version = "1", default-features = false }
# `state::step_events`: the UTC calendar date and minute a published step event's own message
# names the transition by, from the maintained calendar crate rather than by slicing a
# rendered timestamp.
chrono = { version = "0.4", default-features = false, features = ["std"] }
# A notebook execution's notebook is an object in Amazon S3 ("the Amazon S3 location that
# the notebook execution input is stored in"), and `StartNotebookExecution` FOLLOWS that
# reference: the object is read with a `GetObject` driven over the in-process callback
# (`state::notebook_run`), so the cells that run are the ones `PutObject` wrote. Only the
# generated client is needed — the emulator supplies the transport.
aws-sdk-s3 = { version = "1", default-features = false }
# The notebook a headless execution names has to RUN for the execution to reach the status
# its own cells answered, and so does the Spark application a `spark-submit` step submits:
# both are caller-supplied Python. They are run in the CONTAINED interpreter this workspace
# already holds for exactly that (`state::execution::python` of the crate below): one
# interpreter per run, built with its host-reaching surface compiled out, its native modules
# narrowed to an allow-list, and the deadline, step, memory, recursion and output bounds
# enforced in host code the caller's code cannot reach. No second execution substrate is
# introduced here — this crate adds no engine dependency of its own and runs both through
# that one (`state::notebook_run`, `state::spark_step_run`). The Spark surface those
# applications compute through is ordinary Python this crate supplies on their import path
# (`state::spark_runtime`), and the only thing outside the interpreter it reaches is this
# emulator's own object store, over the in-process callback the runtime gives a guest's AWS
# SDK.
service-com-amazonaws-lambda-awsgirapiservice = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
hex = { workspace = true }
# A step's state changes are published onto the account's default EventBridge bus and routed
# from there, so the suite that asserts them mounts EventBridge and Amazon SQS beside Amazon
# EMR on ONE engine and reads each event back off the queue a rule delivered it to — the
# same path a client's own rule takes.
service-com-amazonaws-eventbridge-awsevents = { workspace = true }
service-com-amazonaws-sqs-amazonsqs = { workspace = true }
# A notebook execution's notebook is an object in Amazon S3, and a submitted Spark
# application's file is too, so the suites that assert either RUNS write it through Amazon
# S3's own `CreateBucket`/`PutObject` and read what it wrote back with `GetObject`, with that
# service mounted beside Amazon EMR on ONE engine: the code that runs is the code a client
# put in the bucket, and the output is a real object.
service-com-amazonaws-s3-amazons3 = { workspace = true }
# A cluster's Availability Zone is the zone of the subnet its launch placed it in, which is
# Amazon EC2's resource: the suite that asserts the resolved placement creates the VPC and
# the subnet through Amazon EC2 itself, mounted on the same engine.
service-com-amazonaws-ec2-amazonec2 = { workspace = true }

[lints]
workspace = true
