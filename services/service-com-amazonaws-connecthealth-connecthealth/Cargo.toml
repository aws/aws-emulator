[package]
name = "service-com-amazonaws-connecthealth-connecthealth"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
# The `vnd.amazon.eventstream` framing, the request reader and the routing seam the
# hand-authored `StartMedicalScribeListeningSession` needs, plus the shared request-path
# reader that routes it.
service-common = { path = "../common" }
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# SHA-256 over a sequence number and the clock: the id-minting digest behind every
# `domainId` / `subscriptionId` this service hands out.
sha2 = { workspace = true }
# Hex codec for those ids and for the opaque `nextToken` pagination cursor.
hex = { workspace = true }
# Runs the modelled `@pattern` of `S3Uri` for the one member this service judges in its
# handler rather than at the request boundary (`crate::state::output_location_within_shape`).
regex = "1.13"
# Decodes one `application/vnd.amazon.eventstream` frame: the input stream of
# `StartMedicalScribeListeningSession` arrives as those frames, and the shared seam reads
# only the response direction.
aws-smithy-eventstream = "0.60"

[build-dependencies]
emulator-core-build-support = { workspace = true }

[lints]
workspace = true
