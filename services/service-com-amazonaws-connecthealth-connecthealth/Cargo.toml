[package]
name = "service-com-amazonaws-connecthealth-connecthealth"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
# The `vnd.amazon.eventstream` framing, the request reader and the routing seam the
# hand-authored `StartMedicalScribeListeningSession` needs, plus the shared request-path
# reader that routes it.
service-common = { path = "../common" }
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
# Renders the document-processing report a completed patient insights job states in
# `statusDetails` through a serialized struct, so its members travel in the order the
# recorded document carries them (`src/state/insights_run.rs`).
serde = { workspace = true }
tracing = { workspace = true }
# SHA-256 over a sequence number and the clock: the id-minting digest behind every
# `domainId` / `subscriptionId` this service hands out.
sha2 = { workspace = true }
# Hex codec for those ids and for the opaque `nextToken` pagination cursor.
hex = { workspace = true }
# Runs the modelled `@pattern` of `S3Uri` for the one member this service judges in its
# handler rather than at the request boundary (`crate::state::output_location_within_shape`).
regex = "1.13"
# Decodes one `application/vnd.amazon.eventstream` frame: the input stream of
# `StartMedicalScribeListeningSession` arrives as those frames, and the shared seam reads
# only the response direction.
aws-smithy-eventstream = "0.60"
# The in-process Amazon S3 client a completed patient insights job writes its summary
# object through (built once in `service-common::s3_client`): only the types the write
# itself takes are named here. The emulator supplies the transport, so the SDK's own HTTPS
# stack is left out and this client can reach nothing off this process.
aws-sdk-s3 = { version = "1", default-features = false }
# Reads the `fhirEndpoint` URL a `StartPatientInsightsJob` names with a maintained URL
# parser rather than splitting a caller-supplied URI by hand
# (`src/state/insights_run.rs`).
url = "2"
# Percent-encodes the patient identifier a FHIR interaction addresses, so no value a
# caller supplies can carry a separator of the URI it sits in.
percent-encoding = "2"

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# Recomputes the CRC32 of the bytes Amazon S3 served, so the output-delivery suite can
# assert the checksum a read of the summary object reports really describes those bytes
# rather than only being present.
crc32fast = "1"
# The object store a completed patient insights job writes its summary into, and the FHIR
# data store its patient is resolved against: both are mounted BESIDE this service on one
# engine in the patient-insights suite, exactly as the assembled router mounts them, so
# what the job read and what it wrote are answered by the services that OWN them.
# DEV-ONLY: this crate depends on no other service's crate outside its tests.
service-com-amazonaws-s3-amazons3 = { workspace = true }
service-com-amazonaws-healthlake-healthlake = { workspace = true }

[lints]
workspace = true
