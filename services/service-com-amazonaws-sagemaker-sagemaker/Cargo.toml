[package]
name = "service-com-amazonaws-sagemaker-sagemaker"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
# The shared request-claim rule for a SigV4 signing name several services share.
service-common = { path = "../common" }
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Hex codec for the opaque NextToken (the page boundary, encoded) this service's
# listings mint, and for rendering the hex id a lineage entity's ARN carries.
hex = { workspace = true }
# Digest behind `state::mint_opaque_resource_id`, the one scheme every server-generated
# id in this service is minted with (cluster/compute-quota/scheduler-config ids, EC2
# instance ids, node logical ids, presigned-URL grant tokens).
sha2 = { workspace = true }
# RFC 3986 percent-encoding, for the authorization token a presigned MLflow URL carries
# in a query parameter (the minted secret's alphabet includes `+` and `/`).
percent-encoding = "2"
# The Amazon S3 client a training job's run reads its input channels through and writes its
# model artifact with, over the in-process callback into this same emulator (no network
# client feature: the transport is the emulator's own, so no socket is opened and no host is
# resolved).
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
# The AWS SDK for CloudWatch Logs, driven over the same in-process callback: a notebook
# instance's lifecycle-configuration hook publishes what its script wrote to the log group
# and stream the hook's own model doc names (`state::notebook_hook_logs`), through that
# service's own API, so what a client reads back with `GetLogEvents` is what the log service
# stored.
aws-sdk-cloudwatchlogs = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
# `base64`: the codec the hook script's `Content` is carried in ("a base64-encoded string
# that contains a shell script", `NotebookInstanceLifecycleHook$Content`), decoded with the
# maintained codec rather than by hand.
base64 = "0.22"
# Reads the comma-separated records a training channel carries; a library computing over data
# in this process, with no native or build-time code.
csv = "1.3"
# The `model.tar.gz` a finished training run writes under `OutputDataConfig.S3OutputPath`:
# the archive format `ModelArtifacts` documents, written with the maintained tar writer and
# gzip codec rather than laid out here.
tar = "0.4"
flate2 = "1"
# The maintained regex engine, so a container image path is matched against the PUBLISHED
# image-reference grammar's own expression rather than a hand-rolled walk over its characters
# (`state::container_image`).
regex = "1.13"
# The model card PDF a `CreateModelCardExportJob` writes under its `S3OutputPath`: the
# document is laid out by the maintained PDF writer rather than by hand, so the object the
# export leaves in Amazon S3 is a file a PDF reader opens.
pdf-writer = "0.13"
# The account's own IAM and STS records, read to decide WHO a request speaks for and what
# that principal may do: the lineage reads are authorized against the identity-based policies
# IAM holds for it (`service::authorization`). Both stores live on the same shared engine, so
# they are read through their own service's accessors rather than copied here.
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
service-com-amazonaws-sts-awssecuritytokenservicev20110615 = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# Amazon S3, mounted beside SageMaker on one engine by the training-run suite: a run reads
# the channel objects a test staged with `PutObject` and writes its model artifact where
# `GetObject` then reads it back.
service-com-amazonaws-s3-amazons3 = { workspace = true }
# CloudWatch Logs, mounted beside SageMaker on one engine by the notebook lifecycle-hook
# suite: the hook publishes what its script wrote through that service's own API, and the
# suite reads it back with `GetLogEvents`.
service-com-amazonaws-cloudwatchlogs-logs-20140328 = { workspace = true }

[lints]
workspace = true
