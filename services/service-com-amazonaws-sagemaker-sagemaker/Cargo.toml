[package]
name = "service-com-amazonaws-sagemaker-sagemaker"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
# The shared request-claim rule for a SigV4 signing name several services share.
service-common = { path = "../common" }
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true, features = ["sync", "time"] }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Hex codec for the opaque NextToken (the page boundary, encoded) this service's
# listings mint, and for rendering the hex id a lineage entity's ARN carries.
hex = { workspace = true }
# Digest behind `state::mint_opaque_resource_id`, the one scheme every server-generated
# id in this service is minted with (cluster/compute-quota/scheduler-config ids, EC2
# instance ids, node logical ids).
sha2 = { workspace = true }
# RFC 3986 percent-encoding, for the path segments and the authorization token a presigned
# session address carries (the minted secret's alphabet includes `+` and `/`).
percent-encoding = "2"
# The Amazon S3 client a training job's run reads its input channels through and writes its
# model artifact with, over the in-process callback into this same emulator (no network
# client feature: the transport is the emulator's own, so no socket is opened and no host is
# resolved).
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
# The AWS SDK for CloudWatch Logs, driven over the same in-process callback: a notebook
# instance's lifecycle-configuration hook publishes what its script wrote to the log group
# and stream the hook's own model doc names (`state::notebook_hook_logs`), through that
# service's own API, so what a client reads back with `GetLogEvents` is what the log service
# stored.
aws-sdk-cloudwatchlogs = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
# The AWS SDK for EC2, driven over the same in-process callback: the VPC, subnets and
# security groups a Studio domain is placed in are EC2's resources, so
# `state::domain_network` asks the service that owns them which VPC holds each one rather
# than deciding it here (no network client feature: the transport is the emulator's own).
aws-sdk-ec2 = { version = "1", default-features = false, features = ["behavior-version-latest"] }
# `base64`: the codec the hook script's `Content` is carried in ("a base64-encoded string
# that contains a shell script", `NotebookInstanceLifecycleHook$Content`), decoded with the
# maintained codec rather than by hand.
base64 = "0.22"
# Reads the comma-separated records a training channel carries; a library computing over data
# in this process, with no native or build-time code.
csv = "1.3"
# The calendar reading of an instant, for the hour folder an endpoint's data-capture object is
# laid out under (`state::data_capture`): the date components come from the maintained calendar
# rather than from arithmetic over epoch seconds here.
chrono = { version = "0.4", default-features = false, features = ["std"] }
# The `model.tar.gz` a finished training run writes under `OutputDataConfig.S3OutputPath`:
# the archive format `ModelArtifacts` documents, written with the maintained tar writer and
# gzip codec rather than laid out here.
tar = "0.4"
flate2 = "1"
# `shell-words`: the maintained POSIX word quoter, so the argument vector a job's container
# declares reaches the shared shell session as ONE command line with each word still one word
# (`state::container_run`), rather than being joined by hand.
shell-words = "1.1"
# The maintained regex engine, so a container image path is matched against the PUBLISHED
# image-reference grammar's own expression rather than a hand-rolled walk over its characters
# (`state::container_image`).
regex = "1.13"
# The model card PDF a `CreateModelCardExportJob` writes under its `S3OutputPath`: the
# document is laid out by the maintained PDF writer rather than by hand, so the object the
# export leaves in Amazon S3 is a file a PDF reader opens.
pdf-writer = "0.13"
# The account's own IAM and STS records, read to decide WHO a request speaks for and what
# that principal may do: the lineage reads are authorized against the identity-based policies
# IAM holds for it (`service::authorization`). Both stores live on the same shared engine, so
# they are read through their own service's accessors rather than copied here.
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
service-com-amazonaws-sts-awssecuritytokenservicev20110615 = { workspace = true }
# The Amazon ECR registry, read to resolve the DIGEST of the container image a registration
# references (`state::image_digest`): the image and its manifest digest belong to that
# registry, whose store lives on the same shared engine, so the digest a reader reports is
# the one `PutImage` minted rather than a value computed here.
service-com-amazonaws-ecr-amazonec2containerregistry-v20150921 = { workspace = true }
# The CONTAINED Python interpreter the caller-supplied PYTHON this service runs is executed by:
# the INFERENCE CODE a model artifact carries — the handler script a framework inference container
# takes out of the artifact's `code` directory (`state::inference_script`) — and the PROGRAM a
# training or processing job's container declares when its `ContainerEntrypoint` names the
# interpreter the SageMaker images provide (`state::container_python`). Both reach it through the
# Lambda service crate, which is where this workspace's ONE embedded Python execution substrate
# lives (`state::execution::python`). Reused rather than stood up a second time here, so a
# caller's own code runs under exactly the containment and the bounds that engine already
# enforces, and this crate adds no execution surface of its own: it supplies the modules, the
# event, the in-memory files the code reads and writes, and the run's ceilings and nothing else.
#
# Capability class: an execution substrate. What it re-opens is answered by that engine and by
# this crate's own module docs — the interpreter is built with the engine crate's host-reaching
# features compiled out, its native modules are an allow-list that leaves every socket,
# subprocess, memory-map and host-library module unregistered, the operating-system modules a
# script can import are the workspace's own in-memory ones, and every bound (wall clock, steps,
# memory, recursion, output size) lives in host code no script can reach. It brings no
# build-time code of its own beyond the generated service scaffolding every service crate here
# builds.
service-com-amazonaws-lambda-awsgirapiservice = { workspace = true }
# The account's own Service Quotas: how many instances this account may run across all of its
# HyperPod clusters is an ADJUSTABLE account-level quota, so `BatchAddClusterNodes` reads the
# value in force out of the store `GetServiceQuota` answers from and
# `RequestServiceQuotaIncrease` writes an approved increase into
# (`state::cluster_instance_entitlement`).
service-com-amazonaws-servicequotas-servicequotasv20190624 = { workspace = true }
# The account's own KMS records: an Amazon S3 object a job's work reads may be SEALED under a
# KMS key, and whether the job's execution role may perform that object's `kms:Decrypt` is
# decided by the service that HOLDS the key, its policy and its grants
# (`state::object_key_access`) rather than re-decided here. That store lives on the same shared
# engine, so it is read through its own service's accessors.
service-com-amazonaws-kms-trentservice = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# Declares one module per `tests/all/<name>.rs` for the crate's single test target, so a
# new suite is picked up by being a file rather than by a hand-kept `mod` list.
automod = { workspace = true }
# Amazon S3, mounted beside SageMaker on one engine by the training-run suite: a run reads
# the channel objects a test staged with `PutObject` and writes its model artifact where
# `GetObject` then reads it back.
service-com-amazonaws-s3-amazons3 = { workspace = true }
# CloudWatch Logs, mounted beside SageMaker on one engine by the notebook lifecycle-hook
# suite: the hook publishes what its script wrote through that service's own API, and the
# suite reads it back with `GetLogEvents`.
service-com-amazonaws-cloudwatchlogs-logs-20140328 = { workspace = true }
# Amazon EC2, mounted beside SageMaker on one engine by the domain-network suite: a VPC, its
# subnets and its security groups are EC2's resources, minted through that service's own API
# exactly where `CreateDomain` resolves the placement it is given.
service-com-amazonaws-ec2-amazonec2 = { workspace = true }
# Amazon SQS, mounted beside SageMaker on one engine by the pipeline-callback suite: a
# callback step's whole work is the message it hands the caller's own queue, so the suite
# creates that queue through SQS's own API and reads the message back off it.
service-com-amazonaws-sqs-amazonsqs = { workspace = true }

[lints]
workspace = true
