[package]
name = "service-com-amazonaws-bedrockagent-amazonbedrockagentbuildtimelambda"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
# The shared request-claim rule for a SigV4 signing name several services share.
service-common = { path = "../common" }
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
# `time` is for the integration test's wait over `PREPARE_SPAN`; `macros`/`rt` come from the workspace entry.
tokio = { workspace = true, features = ["time"] }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# The S3 Vectors store a knowledge base binds to: this service resolves the vector
# bucket and index its `storageConfiguration` names in the service that OWNS them, and
# writes the ingested vectors there.
service-com-amazonaws-s3vectors-s3vectors = { workspace = true }
# The object store an S3 data source is crawled from: an ingestion job enumerates the
# objects under the configured bucket and prefix in the service that owns them.
service-com-amazonaws-s3-amazons3 = { workspace = true }
# The published foundation-model catalog, which is what says whether the ARN a
# knowledge base names as its embedding model is an embedding model at all.
service-com-amazonaws-bedrock-amazonbedrockcontrolplaneservice = { workspace = true }
# The account's IAM records: a knowledge base ACTS AS the role its `roleArn` names, so the
# role's trust policy is resolved against the records `iam:CreateRole` wrote
# (`src/state/service_role.rs`).
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
# The OpenSearch Serverless collection an `OPENSEARCH_SERVERLESS` storage configuration
# names: whether the knowledge base's role may reach the vector index is decided by that
# collection's own data access policies, in the service that owns them
# (`src/state/opensearch_serverless_store.rs`).
service-com-amazonaws-opensearchserverless-opensearchserverless = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
hex = { workspace = true }

[lints]
workspace = true
