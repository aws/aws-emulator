[package]
name = "service-com-amazonaws-s3-amazons3"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
# The shared ARN parse: a notification destination's stored ARN is read for the Region it
# names and the queue it addresses through the one parse every service reads an ARN with.
service-common = { path = "../common" }
# The KMS store holds the key an SSE-KMS object was encrypted under, its key policy and
# the authorization decision over it: a read that serves such an object's bytes asks that
# service's own `kms:Decrypt` gate rather than keeping a second copy of either
# (`state::sse_kms`).
service-com-amazonaws-kms-trentservice = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
# The clock a delivery task is bounded by: `tokio::time::timeout` abandons one request's
# object-event fan-out past `state::notifications::DELIVERY_DEADLINE`.
tokio = { workspace = true, features = ["time"] }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# An object's ETag and the `Content-MD5` request header are both the MD5 digest of the
# payload, so storing or checking either needs a real MD5 implementation.
md-5 = "0.10"
# Renders that digest as the lowercase hex an ETag carries.
hex = { workspace = true }
# An object version id is the SHA-256 of the bucket, the key and the store's mint
# sequence, rendered as a URL-safe Base64 token (`state::mint_version_id`), and SHA-512 is
# one of the checksum algorithms an object may be stored with (`state::checksum_digest`).
sha2 = { workspace = true }
# The five checksum algorithms S3 publishes for an object (`CRC32`, `CRC32C`, `CRC64NVME`,
# `SHA1`, `SHA256`), computed by the AWS SDK's own implementation of them rather than by
# anything hand-rolled here (`state::checksum_digest`).
aws-smithy-checksums = "0.65"
# The three `XXHASH` checksum algorithms the model's `ChecksumAlgorithm` also names, which
# no other crate in this workspace implements (`state::checksum_digest`).
xxhash-rust = { version = "0.8", features = ["xxh64", "xxh3"] }
# Renders an instant as the calendar date S3's `<ArgumentValue>` reports a refused
# timestamp as (`state::refused_timestamp_text`), weekday and month names included.
chrono = { version = "0.4", default-features = false, features = ["std"] }
# The zone that rendering names: a real zone, so the abbreviation is the one the instant
# falls in rather than a fixed offset spelled by hand.
chrono-tz = { version = "0.10", default-features = false, features = ["std"] }
# `encoding-type=url` asks a listing to percent-encode the key-name elements of its
# response ("non-ASCII characters that are used in an object's key name will be
# percent-encoded according to UTF-8 code values" — the `EncodingType` enum's own
# documentation), which is exactly RFC 3986 percent-encoding over a chosen character set.
percent-encoding = "2"
# Normalizes the ONE member this service's model marks `@xmlAttribute` between the
# attribute the API publishes and the element the framework's XML codec binds
# (`src/service/wire.rs`), rather than editing XML documents as strings.
quick-xml = "0.41"
# The payload of a BROWSER-FORM upload is a `multipart/form-data` document
# (`src/service/post_object.rs`), read with a maintained parser for that media type rather
# than by slicing the body by hand.
multer = "3.1"
# The one-chunk stream that parser reads the already-buffered request body from.
futures-util = { version = "0.3", default-features = false }
# The policy a browser-form upload carries is "a UTF-8 and base64-encoded document written
# in JSON" (`src/service/post_object.rs`), so decoding it needs that codec.
base64 = "0.22"
# And verifying the signature of that policy is the SigV4 key derivation, which is a chain
# of HMAC-SHA256 over the secret of the credential the form named.
hmac = "0.12"
# The hash the OTHER presigned presentation signs with: the query-credential form's signature
# is "the HMAC-SHA1 of the UTF-8 encoding of the StringToSign, base64-encoded"
# (`src/service/legacy_query_credential.rs`).
sha1 = "0.10"
# The ARN pattern S3 publishes for a Lambda notification destination is a REGULAR
# EXPRESSION, quoted verbatim in the refusal of a value that does not satisfy it
# (`state::CLOUD_FUNCTION_ARN_PATTERN`), so the pattern as published is also what judges a
# value rather than a second hand-written reading of it.
regex = "1.13"
# The AWS SDKs for the four destinations a bucket's event notification configuration
# publishes to, driven over the in-process callback (`OperationContext::callback`): an
# object event becomes a `PutEvents` onto the default event bus, a `SendMessage`, a
# `Publish` or an asynchronous `Invoke` (`state::notifications`). Only the generated
# clients are needed — the emulator supplies the transport, so the SDKs' own HTTPS stacks
# and runtimes are left out.
aws-sdk-eventbridge = { version = "1", default-features = false }
aws-sdk-sqs = { version = "1", default-features = false }
aws-sdk-sns = { version = "1", default-features = false }
aws-sdk-lambda = { version = "1", default-features = false }
# WHO a signed request speaks for: STS's own resolution of an access key id to the session or
# the IAM user it was minted for, and its view of the IAM store that holds that principal's
# identity-based policies — the same records `sts:GetCallerIdentity` and `iam:PutUserPolicy`
# answer from, so this service authorizes a request against the documents really in force
# (`service::request_authorization`).
service-com-amazonaws-sts-awssecuritytokenservicev20110615 = { workspace = true }
# The CloudWatch metric store is where a bucket's `AWS/S3` request metrics live: the datapoints
# a served request contributes are appended to that service's own series — the ones
# `GetMetricStatistics` and the alarm evaluation read — rather than to a second copy of them
# (`service::request_metrics`).
service-com-amazonaws-cloudwatch-graniteserviceversion20100801 = { workspace = true }
# The CloudFront store is the only record of an ORIGIN ACCESS IDENTITY, which is one of the
# identities a bucket policy grants to: `PutBucketPolicy` resolves a principal spelled as one
# against that service's own identities, over the shared engine, rather than taking the ARN
# text on trust or keeping a second copy of the identities
# (`service::policy_principals`). CloudFront takes this crate as a DEV-dependency only (its
# own suites mount Amazon S3 beside it), so the cycle closes through a dev-dependency, which
# Cargo allows.
service-com-amazonaws-cloudfront-cloudfront2020-05-31 = { workspace = true }
# The S3 Tables store owns the tables an S3 Metadata configuration is provisioned into: the
# managed table bucket, the namespace of the general purpose bucket they belong to and the
# journal, inventory and annotation tables themselves are written into that service's own
# records, so its reads resolve them and its `DeleteTable`/`DeleteNamespace` remove them
# (`state::metadata_table_provisioning`).
service-com-amazonaws-s3tables-s3tablebuckets = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# `automod`: the integration-test target's root (`tests/all/main.rs`) declares one module per
# `tests/all/<name>.rs`, so a new suite is a new file and nothing lists it.
automod = { workspace = true }
# The RFC 3986 encoder a suite puts a continuation token on a query parameter with, the same
# crate the service's own listings percent-encode with above.
percent-encoding = "2"
# The SigV4 key schedule a BROWSER-FORM upload's policy is signed under: the form-upload
# suite signs its policy with the SDK signer's own derivation rather than carrying a second
# copy of it.
aws-sigv4 = { workspace = true }
# `quick-xml` above is also what the tests read a restXml body with.
# EventBridge, SQS and Lambda are mounted beside S3 in the event-notification test:
# without them there is nowhere for an object event to be delivered, and what that suite
# asserts is the message each destination really received.
service-com-amazonaws-eventbridge-awsevents = { workspace = true }
service-com-amazonaws-sqs-amazonsqs = { workspace = true }
service-com-amazonaws-lambda-awsgirapiservice = { workspace = true }
# The SSE-KMS read suite makes the principals its key policies name through IAM's and STS's
# own operations (`CreateRole` + `PutRolePolicy` + `AssumeRole`), so the role sessions and
# the documents the decision reads are the ones those services wrote; the
# identity-authorization suite makes its callers' users, access keys and policies the same
# way, so what it authorizes against is the records `iam:PutUserPolicy` really wrote.
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
service-com-amazonaws-sts-awssecuritytokenservicev20110615 = { workspace = true }
# A deployment package the notification-delivery suite uploads is a .zip archive it writes
# in memory, so the function a bucket's notification configuration arms really holds the
# handler that runs on the object event.
zip = { version = "9", default-features = false, features = ["deflate"] }
# The credential-scoped authorization suite enrols a virtual MFA device the way its holder
# does, which means computing the one-time pass code that device emits — the HMAC-SHA-1 of its
# time step (RFC 6238) over the base32 seed the create answered with. `hmac` and `sha1` are
# already dependencies above; this is what the test needs beside them.
data-encoding = "2"

[lints]
workspace = true
