[package]
name = "service-com-amazonaws-bedrockagentruntime-amazonbedrockagentruntimeservice"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
# The shared request-claim rule for a SigV4 signing name several services share, and the
# one evaluation of an IAM identity-based policy this service authorizes a caller with.
service-common = { path = "../common" }
# The caller's identity, from the same registry `sts:GetCallerIdentity` answers from, and
# the identity-based policies the account holds for it. Read-only: this service writes
# neither store.
service-com-amazonaws-sts-awssecuritytokenservicev20110615 = { workspace = true }
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
# The knowledge bases, data sources and the vector store binding a retrieval reads, from
# the plane that OWNS them, and the vector index their ingestions wrote. Read-only: this
# service writes no part of either.
service-com-amazonaws-bedrockagent-amazonbedrockagentbuildtimelambda = { workspace = true }
service-com-amazonaws-s3vectors-s3vectors = { workspace = true }
# The objects a knowledge base's documents were ingested from, from the service that owns
# them: `GetDocumentContent` reports the content type and the length of the one it hands a
# caller a URL for. Read-only.
service-com-amazonaws-s3-amazons3 = { workspace = true }
# The base-model catalogue a prompt optimization resolves its `targetModelId` against, and
# the one sentence this emulator answers an inference surface with, from the Bedrock
# Runtime data plane that owns both. Read-only: this service writes no part of it.
service-com-amazonaws-bedrockruntime-amazonbedrockfrontendservice = { workspace = true }
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
# `time` is for the retrieval test's wait over the ingestion spans the Bedrock Agent
# plane's clock owes; `macros`/`rt` come from the workspace entry.
tokio = { workspace = true, features = ["time"] }
bytes = { workspace = true }
http = { workspace = true }
# Renders the authenticator a content address carries (`state::document_content`) as the
# hex the address spells it in.
hex = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
# Decodes one `application/vnd.amazon.eventstream` frame, so the prompt-optimization suite
# reads the response stream back the way an SDK's decoder does.
aws-smithy-eventstream = "0.60"
# Decodes the base64 a `@blob` member travels as on the restJson1 wire, so the streaming
# suite reads an agent response chunk's bytes back the way an SDK does.
base64 = "0.22"

[lints]
workspace = true
