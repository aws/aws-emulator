[package]
name = "service-com-amazonaws-ssoadmin-swbexternalservice"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Hex-encodes pagination cursors, so a `NextToken` stays inside the model's
# `^[-a-zA-Z0-9+=/_]*$` pattern while still carrying the ARN it resumes from.
hex = { workspace = true }
# Hashes the (process, clock, counter) triple this service's minted identifiers are
# derived from: the `RequestId` of an assignment operation (the model's `UUId` shape)
# and the `ps-` suffix of a permission-set ARN.
sha2 = { workspace = true }
# `service-common` carries this tree's ONE reading of an ISO 8601 duration string
# (`iso8601_span`), which is how a permission set's `SessionDuration` is measured against
# the window the service bounds it to.
service-common = { path = "../common" }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# `rand`: the generator the property-based instance-projection suite draws its accounts
# from (`tests/all/listed_instance_state_generated_accounts.rs`) — the instance count, each
# instance's lifecycle value, name, kind and Region, and the page size the enumeration asks
# for. Test-only: nothing in `src/` draws random values.
rand = "0.9"

[lints]
workspace = true
