[package]
name = "service-com-amazonaws-cognitoidentity-awscognitoidentityservice"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Renders the GUID half of an `IdentityPoolId` / `IdentityId` and the opaque
# pagination token of a listing as hex.
hex = { workspace = true }
# Mixes the material a minted GUID is built from.
sha2 = { workspace = true }
# Matches a value against a modelled `@pattern` the way AWS's constraint layer reads it:
# compiled with Unicode mode off, so `\w` and `\s` stand for ASCII characters alone
# (`crate::state::pool_configuration`).
regex = "1.13"
# `iam_authorization`: the shared evaluation of IAM policy documents against
# (action, resource), which this service's authorization gate runs and which the resolved
# role's trust policy is read with; also the account's management-event log a vend and the
# assume behind it are recorded in.
service-common = { path = "../common" }
# The IAM store holds the identity-based policies of the principal a request speaks for and
# the roles a vend assumes, and the STS store resolves which principal a request is and
# holds the sessions a vend mints: this service reads both services' OWN state accessors
# rather than keeping a second copy of either fact.
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
service-com-amazonaws-sts-awssecuritytokenservicev20110615 = { workspace = true }
# A `Logins` entry made under a user pool's provider name presents that POOL's id token, and
# the pool decides which issuers it publishes — it is served on every endpoint its callers
# reach it at — so the user-pool service's OWN reading of that is called here rather than a
# second copy of the issuer form being kept beside it.
service-com-amazonaws-cognitoidentityprovider-awscognitoidentityproviderservice = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
hex = { workspace = true }
# The authorization suite makes the principals it calls as through IAM's and STS's own
# operations, so the policies it asserts on are the ones those services wrote; the vend
# suites seed the roles a vend assumes as `iam:CreateRole` writes them.
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
service-com-amazonaws-sts-awssecuritytokenservicev20110615 = { workspace = true }

[lints]
workspace = true
