[package]
name = "service-com-amazonaws-bedrockruntime-amazonbedrockfrontendservice"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
# The shared request-claim rule for a SigV4 signing name several services share,
# and the `vnd.amazon.eventstream` framing seam the two streaming operations use.
service-common = { path = "../common" }
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
# `time` beyond the workspace's own features: `InvokeGuardrailChecks` bounds the wait
# for its (blocking-pool) check evaluation with `tokio::time::timeout`.
tokio = { workspace = true, features = ["time"] }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Encodes and decodes one `application/vnd.amazon.eventstream` frame: the two
# streaming operations add Bedrock's `p` padding member to each frame's payload,
# which the protocol's own serializer cannot write (it is not a modelled member).
aws-smithy-eventstream = "0.60"
# Mints the 12-character async-invoke id embedded in an `invocationArn`.
sha2 = { workspace = true }
# Encodes the opaque `ListAsyncInvokes` page token.
hex = { workspace = true }

# The CloudWatch metric store an inference publishes its token volume into
# (`state::invocation_metrics`): the datapoints go into the store `PutMetricData` writes
# and `GetMetricStatistics` / `ListMetrics` read, which is reached through the shared
# engine and needs the owning service's state TYPE.
service-com-amazonaws-cloudwatch-graniteserviceversion20100801 = { workspace = true }

# The Amazon S3 object store a finished asynchronous invocation writes its output into
# (`state::async_invoke_output`): the object goes into the store `PutObject` writes and
# `GetObject` / `ListObjectsV2` read, so a client reads an invocation's output through
# Amazon S3's own operations. Reached through the shared engine, which needs the owning
# service's state TYPE.
service-com-amazonaws-s3-amazons3 = { workspace = true }

# The PII recognizer behind the sensitive-information guardrail check
# (`state::guardrail_checks`): this emulator already has ONE rule set placing every
# PII entity type, the one Comprehend's `DetectPiiEntities` answers from
# (`ops::contains_pii_entities::detect_pii_spans`), so the check reads it rather than
# growing a second copy of the same 30-odd published forms.
service-com-amazonaws-comprehend-comprehend-20171127 = { workspace = true }
# Toxicity engine behind the content-filter guardrail check: an English
# profanity/abuse analyser that classifies a string into categories (offensive,
# mean, sexual) each at a mild/moderate/severe level. The same engine this
# emulator's Comprehend toxicity analysis runs.
rustrict = "0.7"
# Regular-expression engine behind the prompt-attack rules in
# `state::guardrail_checks`: it matches each published attack form over the
# submitted messages in linear time, so no message can make one request backtrack.
# The account-enforced guardrail's word policy (`state::enforced_guardrail`) matches
# with it too: every word the policy blocks goes into ONE pattern, so a request's
# text is scanned once in linear time however many words are configured.
regex = "1.12"

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
hex = { workspace = true }

[lints]
workspace = true
