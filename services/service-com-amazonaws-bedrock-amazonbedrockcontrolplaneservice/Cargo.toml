[package]
name = "service-com-amazonaws-bedrock-amazonbedrockcontrolplaneservice"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
# The shared request-claim rule for a SigV4 signing name several services share.
service-common = { path = "../common" }
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# The digest an Automated Reasoning policy's `definitionHash` is, and its hex rendering.
sha2 = { workspace = true }
hex = { workspace = true }
# The Amazon S3 client a batch inference job reads its input records with and writes its
# result records with, over the in-process callback into this same emulator (no network
# client feature is enabled: the transport is the emulator's own).
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
# The Bedrock Runtime emulator's inference path: a batch inference job invokes the model
# over every record of its input through the very functions that service's `InvokeModel`
# and `Converse` handlers answer from, so a batch record and a synchronous call carrying
# the same body are served by ONE inference rather than by two that could drift.
service-com-amazonaws-bedrockruntime-amazonbedrockfrontendservice = { workspace = true }
# The STS store, for the identity an access key id speaks for: the principal
# `sts:GetCallerIdentity` answers for the credentials a request signed with.
service-com-amazonaws-sts-awssecuritytokenservicev20110615 = { workspace = true }
# The IAM store, for the identity-based policy documents in force on that principal, which
# is what the authorization gate in front of this service's handlers decides on.
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
# The Bedrock Data Automation build-time emulator: it binds the three tagging paths
# (`/tagResource`, `/untagResource`, `/listTagsForResource`) identically to this service, so
# a tagging request naming one of ITS resources is served out of its own model here (see
# `src/service/data_automation_tagging.rs`).
service-com-amazonaws-bedrockdataautomation-amazonbedrockkeystonebuildtimeservice = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# The execution suite mounts Amazon S3 beside this service on one engine: a batch
# inference job reads its input records out of the object store and writes its result
# records back into it, which is asserted end to end by staging the input through S3 and
# fetching the output back through it.
service-com-amazonaws-s3-amazons3 = { workspace = true }
# The CloudWatch Logs emulator, mounted beside this service so the log group a model
# invocation logging destination names is resolved against the service that OWNS it.
service-com-amazonaws-cloudwatchlogs-logs-20140328 = { workspace = true }
# The execution suite waits out the clock-owed span after which a submitted job has begun.
tokio = { workspace = true, features = ["time"] }

[lints]
workspace = true
