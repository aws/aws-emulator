[package]
name = "service-com-amazonaws-mediaconnect-mediaconnect"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# The AWS SDK for EC2, driven over the in-process callback
# (`OperationContext::callback`): a subnet and a security group are EC2's resources, so
# every request that places a MediaConnect elastic network interface in a client VPC
# resolves the ones it names against EC2 (`src/state/vpc_placement.rs`) before it stores
# anything. Only the generated client is needed — the emulator supplies the transport.
aws-sdk-ec2 = { version = "1", default-features = false }
# `arn::region_label`: the ONE reading of a caller-supplied Region as a Region LABEL,
# which is what the endpoint the EC2 call above is made at is built from.
service-common = { path = "../common" }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
hex = { workspace = true }
# The OWNER of the subnets and security groups a VPC placement names, mounted beside this
# service in the test harness: Amazon EC2 holds the account's network, so the resolution
# can only be driven end to end with it on the same engine.
# DEV-ONLY: this crate depends on no other service's crate outside its tests.
service-com-amazonaws-ec2-amazonec2 = { workspace = true }
# The OWNER of the roles a flow's VPC interfaces are created under, mounted the same way:
# `tests/all/vpc_interface_role_assumption.rs` creates each role with a real `CreateRole`,
# so the resolution under test answers out of IAM's own records.
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
# IAM's protocol is form-encoded, so that suite builds its `CreateRole` body with the one
# `application/x-www-form-urlencoded` serializer rather than a hand-rolled encoder.
form_urlencoded = "1"

[lints]
workspace = true
