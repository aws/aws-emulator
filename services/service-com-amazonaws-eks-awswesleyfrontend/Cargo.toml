[package]
name = "service-com-amazonaws-eks-awswesleyfrontend"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
# `time`: the cluster's Kubernetes API address bounds a handshake and a request with
# `tokio::time::timeout`, and the clock of its pods waits for the instant their next
# step falls due (`src/state/kubernetes_api.rs`).
tokio = { workspace = true, features = ["time"] }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Derives each cluster's stable 32-hex resource id (endpoint host, OIDC issuer)
# from its ARN, in `src/state.rs`.
sha2 = { workspace = true }
hex = { workspace = true }
# The AWS SDK for IAM, driven over the in-process callback
# (`OperationContext::callback`): `RegisterCluster` and `CreateCapability` verify
# with `GetRole` that the role they are given exists and lets the service
# principal that would use it assume it. Only the generated client is needed —
# the emulator supplies the transport.
aws-sdk-iam = { version = "1", default-features = false }
# The AWS SDK for EC2, over the same callback: `CreateCluster` and
# `CreateNodegroup` resolve the subnets they are given with `DescribeSubnets`
# before they provision anything, because the account's subnets are EC2's.
aws-sdk-ec2 = { version = "1", default-features = false }
# The AWS SDK for Auto Scaling, over the same callback: a managed node group's
# capacity IS an Amazon EC2 Auto Scaling group — "the resources associated with
# the node group, such as Auto Scaling groups" (`Nodegroup$resources`) — so
# `CreateNodegroup` creates that group in Auto Scaling and `DeleteNodegroup`
# releases it (`src/state/nodegroup_capacity.rs`).
aws-sdk-autoscaling = { version = "1", default-features = false }
# The AWS SDK for CloudWatch Logs, over the same callback: a cluster whose
# `logging` enables a control plane log type exports that type's logs to the
# cluster's own log group, which is CloudWatch Logs' resource to create and write
# (`src/state/control_plane_logs.rs`).
aws-sdk-cloudwatchlogs = { version = "1", default-features = false }
# The CloudWatch Logs service, which SERVES the calls the LOG ROUTER beside a pod
# on a cluster's Fargate capacity makes as the profile's Pod execution role:
# whether that role may create the group its `aws-logging` configuration names,
# whether it may create the stream the pod's output goes to, and whether it may
# put the records — which is what decides whether that output is delivered at all
# (`src/state/kubernetes_fargate_logging.rs` ->
# `…cloudwatchlogs…::state::log_stream_creation::DeliveryPlane`). The log group and
# the policies on the role are that service's and IAM's own records, held in their
# own stores in the shared engine, so each call is answered by the service that
# owns them rather than by a copy kept here. No cycle: that crate does not depend
# on this one.
service-com-amazonaws-cloudwatchlogs-logs-20140328 = { workspace = true }
# The session registry in the same shared engine, which is where
# `sts:GetCallerIdentity` answers from: `CreateCluster` files the cluster creator's
# bootstrap access entry under the IAM principal the request's own credential speaks
# for, so that principal is resolved through STS's OWN resolution rather than
# guessed (`src/state/cluster_creator_access.rs`).
service-com-amazonaws-sts-awssecuritytokenservicev20110615 = { workspace = true }
# The account's IAM records in that same shared engine: the authorization decision
# every request is judged by (`src/service/authorization.rs`) reads the
# identity-based policy documents and the permissions boundary in force on the
# principal the request's credential speaks for, through IAM's own accessors.
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
# `iam_trust_policy`: the one reading of an IAM trust policy — including the
# decode of the URL-encoded form IAM reports a document in — shared with every
# other service that resolves a caller-supplied role.
service-common = { path = "../common" }
# An add-on's `configurationValues` document is written in JSON or in YAML, and a
# document that is neither is refused, so the add-on write operations have to know
# whether a body parses as YAML at all. yaml-rust2 is the pure-Rust YAML 1.2
# implementation the other services that read caller-supplied YAML already use.
yaml-rust2 = { version = "0.10", default-features = false }
# A Kubernetes client may write the object it sends in the Kubernetes protobuf
# encoding rather than in JSON, so the served cluster API reads that encoding
# (`src/state/kubernetes_protobuf.rs`). `k8s-pb` carries the generated Kubernetes
# protobuf schema and `prost` is the codec behind it, so the field numbers and
# message shapes come from the schema rather than from this emulator.
k8s-pb = "0.9"
prost = "0.14"
# `ipnet`: the reading of an IPv4/IPv6 CIDR block and of whether one block contains
# another — the form of a `publicAccessCidrs` entry
# (`src/state/cluster_parameters.rs`), the private range, netmask bounds and
# VPC overlap of a cluster's service CIDR (`src/state/cluster_validation.rs`), and
# the walk that allocates a Service's `clusterIP` out of that block
# (`src/state/kubernetes_services.rs`), which are the same reading. The version the
# sibling services that read caller-supplied CIDRs declare it at.
ipnet = "2"
# A cluster's `certificateAuthority.data` is "the Base64-encoded certificate data
# required to communicate with your cluster", so this service issues a REAL
# self-signed X.509 certificate for every certificate authority it provisions
# (`src/state/certificate_material.rs`). rcgen is the generator this tree already
# uses for certificate material.
rcgen = "0.13"
# The validity window rcgen stamps on that certificate is the one the certificate
# authority record reports, so the two instants are converted from the record's
# `SystemTime`s into the date-time type rcgen takes.
time = { version = "0.3.55", default-features = false, features = ["std"] }
# The EKS Auth plane in the same shared engine: a cluster this service creates is
# registered there, its pod identity associations are programmed there, and the
# projected service account tokens its Kubernetes API server issues are minted
# there — that plane is what `AssumeRoleForPodIdentity` resolves a token against
# (`src/state/pod_identity_plane.rs`).
service-com-amazonaws-eksauth-eksauthfrontend = { workspace = true }
# A cluster's Kubernetes API server is reached over HTTP/1.1 on the core-owned
# listener the cluster publishes as its `endpoint`
# (`src/state/kubernetes_api.rs`), so the framing on that connection is the
# `hyper` server's rather than this emulator's. `hyper-util` carries the tokio IO
# and timer adapters for it, and `http-body-util` the bounded body read.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = { version = "0.1", default-features = false }
# That listener is handed the connection in the clear, so the TLS a client of the
# published endpoint dials is terminated here under a certificate the CLUSTER's own
# certificate authority issued — the one whose PEM `certificateAuthority.data`
# publishes, which is what lets a kubeconfig built from `DescribeCluster` verify the
# endpoint beside it. `tokio-rustls` drives that handshake on the core's connection.
rustls = { workspace = true }
tokio-rustls = "0.26"
# The account's Amazon EC2 records in that same shared engine: a cluster's pods
# are addressed out of the VPC its nodes run in — a pod's address is a secondary
# private address of its node's own elastic network interface — so the interface,
# the subnet and the address pool it comes out of are read and written where they
# live, through Amazon EC2's own writers (`src/state/kubernetes_pod_addressing.rs`).
service-com-amazonaws-ec2-amazonec2 = { workspace = true }
# The Amazon ECR registry in that same shared engine: a node's kubelet pulls the
# image a pod's container runs before it starts that container, and an image held
# in this account's private registry is pulled AS THE NODE'S IAM ROLE — so that
# registry decides the pull (the policies in force on the role, its own
# repository policy, the reference, and the image it holds) through its own
# in-process entry point (`src/state/kubernetes_image_pull.rs` ->
# `…ecr…::state::registry_pull::PullPlane`).
service-com-amazonaws-ecr-amazonec2containerregistry-v20150921 = { workspace = true }
# The Amazon ECR Public gallery in that same shared engine: one address of this
# emulator serves both registries it holds, so whether a reference carrying that
# address names the gallery rather than the private registry is the gallery's own
# answer (`src/state/kubernetes_image_pull.rs`).
service-com-amazonaws-ecrpublic-spencerfrontendservice = { workspace = true }
# `shell-words`: the maintained POSIX word quoter, so the argument vector a pod's
# container declares is handed to the shared shell session as ONE command line with
# each word still one word (`src/state/kubernetes_container_run.rs`).
shell-words = "1.1"

[dev-dependencies]
# The integration-test target is rooted at `tests/all/main.rs`, which declares one
# module per `tests/all/<name>.rs` through `automod`.
automod = { workspace = true }
# The clock-owed `CREATING` -> `ACTIVE` test waits with `tokio::time::sleep`, so
# this target declares tokio's `time` feature rather than inheriting it
# transitively from another crate's feature set. The Kubernetes API suite dials the
# published endpoint, so it declares the socket and stream features too.
tokio = { workspace = true, features = ["time", "net", "io-util"] }
# The certificate-authority suite decodes what a cluster reports as its
# `certificateAuthority.data` and reads the X.509 certificate inside it the way a
# TLS client would, rather than matching on its text.
x509-cert = "0.2"
# The Kubernetes API suite dials the address a cluster publishes as its `endpoint`
# the way a kubeconfig-built client does: over TLS, trusting nothing but the
# certificate authority the cluster published beside it. `tokio-rustls` runs the
# client side of that handshake and `tokio` reads the HTTP/1.1 exchange on it.
tokio-rustls = "0.26"
rustls = { workspace = true }
rustls-pemfile = "2"
# The suite that drives the served cluster API in the Kubernetes protobuf
# encoding writes its bodies the way a client configured for that encoding does:
# the object encoded against the generated Kubernetes schema (`k8s-pb`) inside the
# envelope that names its kind, both encoded with `prost`.
k8s-pb = "0.9"
prost = "0.14"

[build-dependencies]
emulator-core-build-support = { workspace = true }

[lints]
workspace = true
