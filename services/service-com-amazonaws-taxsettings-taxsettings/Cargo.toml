[package]
name = "service-com-amazonaws-taxsettings-taxsettings"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Which account is the organization's management account is established in AWS
# Organizations, so the organization-level write this service reserves to that
# account reads the standing from that control plane's store on the shared engine.
service-com-amazonaws-organizations-awsorganizationsv20161128 = { workspace = true }
# A tax-exemption submission opens an AWS Support case for the certificate it
# submits and answers that case's id, so the case is written to the store of the
# control plane that owns support cases, on the shared engine.
service-com-amazonaws-support-awssupport-20130415 = { workspace = true }
# Tax registration documents ARE objects: Amazon S3 owns the object store this
# service holds each submitted document in and downloads one into the bucket a
# `GetTaxRegistrationDocument` request names, so both go through that service's
# own store on the shared engine (`state::documents`).
service-com-amazonaws-s3-amazons3 = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
hex = { workspace = true }
# The objects a download writes are asserted where Amazon S3 holds them, through
# that service's OWN client over the emulator's in-process callback
# (`tests/all/tax_document_delivery`).
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }

[lints]
workspace = true
