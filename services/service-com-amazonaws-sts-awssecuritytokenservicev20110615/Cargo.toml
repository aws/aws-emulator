[package]
name = "service-com-amazonaws-sts-awssecuritytokenservicev20110615"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Stable AWS unique ids (AROA…/AIDA…) are derived from a SHA-256 digest of the
# thing they name, so a role keeps one id across calls; see `src/state.rs`.
sha2 = { workspace = true }
# The IAM store in the same shared engine: the account's roles (their `RoleId`, trust
# policy and `MaxSessionDuration`) and the access keys that name their owning IAM user.
# The IAM service's OWN accessor is called rather than copied, so STS resolves a role
# against the very records `iam:CreateRole` wrote.
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
# The tree's ONE evaluation of IAM policy documents against a request, which is how a
# role's trust policy is read here: two services handed the same document must not
# answer differently. `jwt::read` / `jwt::verify`: the ONE reading of a compact JWS and
# the RFC 7515 §5.2 signature check a presented web identity token is verified by.
service-common = { path = "../common" }
# The Amazon Cognito user pools in the same shared engine: a pool is an identity provider
# this emulator SERVES, so the key set its tokens are verified against is published in this
# process (`src/state/web_identity.rs`). That service's own accessor is called rather than
# copied, so a token is checked against the very key the pool's `jwks.json` endpoint serves.
service-com-amazonaws-cognitoidentityprovider-awscognitoidentityproviderservice = { workspace = true }
# The modelled character class a session tag's key and value must satisfy is a regular
# expression over Unicode properties, so it is matched with a maintained regex engine
# rather than by hand; see `src/state.rs`.
regex = "1.12"
# An encoded authorization message is read with a configured base64 decoder — the
# padding optional and the trailing bits of a partial final group discarded, the
# latitude the service that DECODES one has; see `src/state.rs`.
base64 = "0.22"
# A SAML 2.0 authentication response IS an XML document, so it is read with the maintained
# XML parser this workspace already reads SAML metadata with — and with the byte ranges it
# reports, which is what the signed content of an XML signature is taken from
# (`src/state/saml.rs`).
roxmltree = "0.20"
# The signature check over a SAML 2.0 authentication response: the digest and the
# RSASSA-PKCS1-v1_5 / ECDSA verification of W3C "XML Signature Syntax and Processing",
# through the ONE cryptography library this workspace verifies signatures with (the same one
# `service-common`'s JOSE reading uses). An in-process COMPUTATION over data: it opens no
# listener and reads nothing off the host.
ring = "0.17"
# ... and the X.509 certificate a provider's metadata publishes its verification key as,
# decoded by the maintained certificate crate rather than by walking DER here.
x509-cert = "0.2"

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
hex = { workspace = true }
# The SAML suite signs its own authentication responses, so it needs a real key pair and a
# real certificate to publish in the provider's metadata: `rcgen` mints both, as it does for
# every suite in this workspace that needs a certificate.
rcgen = "0.13"
# ... and the signature over the `SignedInfo` those responses carry is made with the same
# library the service verifies it with, so the test signs rather than replays a signature.
ring = "0.17"
# The MFA suite computes the one-time pass code a provisioned virtual MFA device emits — the
# HMAC-SHA-1 of its time step over its base32 seed (RFC 6238) — itself, so what a mint's
# challenge is decided against is the arithmetic the holder of the device does rather than the
# service's own implementation of it.
hmac = "0.12"
sha1 = "0.10"
data-encoding = "2"

[lints]
workspace = true
