[package]
name = "service-com-amazonaws-simpledbv2-simpledbv2"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
# `aws_validation_refusal`: the shared wording of a boundary constraint refusal on a
# JSON protocol, so this service carries no copy of its own of how AWS quotes a
# `@pattern` requirement (`src/service.rs`, `override_refusal`).
service-common = { path = "../common" }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Opaque `nextToken` encoding for ListExports' pagination cursor, and the hex
# rendering of a minted identifier.
hex = { workspace = true }
# The digest behind a minted export id / client token, and the digest of the
# `domainName` filter a ListExports page token carries.
sha2 = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# `form_urlencoded`: the ONE encoder of the `application/x-www-form-urlencoded` body a
# SimpleDB 2009-04-15 request carries, so the suite that drives that wire
# (`tests/all/simpledb_query_api.rs`) sends what a client sends rather than a form it
# encoded by hand.
form_urlencoded = "1"
# `roxmltree`: that same suite READS the XML documents this API answers with through a
# real XML parser, so an assertion sees the text a client's parser sees (entities
# resolved) rather than the bytes on the wire.
roxmltree = "0.20"

[lints]
workspace = true
