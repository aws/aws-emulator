[package]
name = "service-com-amazonaws-cloudcontrol-cloudapiservice"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
# The shared, authenticated continuation-token primitive every paginated read of
# this emulator mints its `NextToken` with.
service-common = { path = "../common" }
# Cloud Control API is a front end over the resource type's own provider, not an
# inventory of its own: an `AWS::Logs::LogGroup` lives in the CloudWatch Logs
# service's store, so this crate reads and writes it THERE.
service-com-amazonaws-cloudwatchlogs-logs-20140328 = { workspace = true }
# The same rule for `AWS::SQS::Queue`: a queue lives in the Amazon SQS service's store,
# whichever API created it, so this crate reads and writes it THERE.
service-com-amazonaws-sqs-amazonsqs = { workspace = true }
# And for `AWS::SNS::Topic`: a topic lives in the Amazon SNS service's store, which is
# also where the ARN its primary identifier is comes from.
service-com-amazonaws-sns-amazonsimplenotificationservice = { workspace = true }
# And for `AWS::S3::Bucket`: a bucket lives in the Amazon S3 service's store, so a bucket
# provisioned through this service is one that service's own API then serves objects in.
service-com-amazonaws-s3-amazons3 = { workspace = true }
# And for `AWS::IAM::ManagedPolicy`: a customer managed policy lives in the IAM service's
# store, which is also where the ARN its primary identifier is comes from.
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
# And for `AWS::StepFunctions::StateMachine`: a state machine lives in the Step Functions
# service's store, which is also where the ARN its primary identifier is comes from.
service-com-amazonaws-sfn-awsstepfunctions = { workspace = true }
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# `PatchDocument` is an RFC 6902 JSON Patch document: apply it with a real
# implementation of that RFC rather than walking the operations by hand.
# `default-features = false` drops the `diff` feature, which this service never asks for.
json-patch = { version = "4.2", default-features = false }
# Opaque pagination tokens are hex-encoded, so a token this store did not mint is
# detectable rather than silently decoded.
hex = { workspace = true }
# A `ClientToken`'s record holds a digest of the request it carried, so a reuse with
# different parameters is told from a retry without keeping the request bodies.
sha2 = { workspace = true }
# `RequestToken`s and server-assigned primary identifiers are UUIDs: mint them with a
# real UUID implementation rather than assembling the text by hand.
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# The test harness drives the services that OWN some resource types over their own
# `awsQuery` wire, whose form values are percent-encoded by this crate rather than by an
# encoder of ours.
percent-encoding = "2"

[lints]
workspace = true
