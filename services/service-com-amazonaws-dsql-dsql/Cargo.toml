[package]
name = "service-com-amazonaws-dsql-dsql"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Hashes the entropy half of a minted cluster identifier (a ULID).
sha2 = { workspace = true }
# Encodes the opaque `nextToken` cursor ListClusters pages with.
hex = { workspace = true }
# `kinesis_client` / `iam_role` / `kms_key` / `arn`: the shared in-process clients and
# readings this service resolves a caller-supplied reference through — the delivery service's
# own streams and this account's IAM records for a `CreateStream` target, the account's KMS
# keys for a cluster's `kmsEncryptionKey` — and the one reading of a caller-supplied ARN's
# Region. `sql_wire_planes` is the shared statement of a SQL-wire data plane the cluster
# endpoint is served on: the PostgreSQL wire, the confined in-process SQL engine and the
# listener the core opens for it. `iam_policy` is the one canonical LAYOUT an attached
# policy document is reported in, which `GetClusterPolicy` hands a stored document back in.
# `cluster_sql`: a statement a session sends is READ as Aurora DSQL's dialect — the construct
# this engine does not implement, and whether the statement references the standard catalog —
# with the maintained parser of the wire's own SQL dialect, at the version every other service
# in this workspace reads SQL with, rather than by a scan written here.
sqlparser = "0.59"
service-common = { path = "../common" }
# The instant an auth token was signed at and the one its lifetime runs out at, which the
# token writes in the ISO 8601 basic form a presigned AWS request carries.
chrono = { version = "0.4", default-features = false, features = ["std"] }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# One integration-test target rooted at `tests/all/main.rs`: `automod` declares a module per
# `tests/all/<suite>.rs`, so a new suite is a new file and nothing else.
automod = { workspace = true }
# `time` on top of the workspace features: the clock-settling tests await the due
# instant rather than blocking the runtime thread. `net`/`io-util` are the socket and
# stream traits the data-plane suite dials the cluster's PostgreSQL endpoint and speaks
# the wire over.
tokio = { workspace = true, features = ["io-util", "net", "time"] }
# The PostgreSQL client half the data-plane suite speaks: `rustls`/`tokio-rustls` run the
# client side of the in-band TLS upgrade the core's own upgrader answers.
tokio-rustls = "0.26"
rustls = { workspace = true }
# Amazon Kinesis and IAM, mounted beside Aurora DSQL on one engine so the stream-target
# suite resolves a `targetDefinition` against the very streams and roles a client created
# through those services' own APIs.
service-com-amazonaws-kinesis-kinesis-20131202 = { workspace = true }
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
# AWS KMS, mounted beside Aurora DSQL on the same terms, so the encryption-key suites
# resolve a `kmsEncryptionKey` against the very keys and aliases a client created through
# that service's own API.
service-com-amazonaws-kms-trentservice = { workspace = true }
# Percent-encodes the form fields the IAM query-protocol requests in that suite carry.
percent-encoding = "2.3"

[lints]
workspace = true
