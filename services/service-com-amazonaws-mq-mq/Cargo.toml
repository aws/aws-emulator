[package]
name = "service-com-amazonaws-mq-mq"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Digests the store's own mint sequence into a broker's `b-<128 bits>` BrokerId.
sha2 = { workspace = true }
# Parses and re-serializes the ActiveMQ XML configuration document a revision
# stores, so a revision reports the canonical form rather than the bytes sent.
quick-xml = "0.41"
# `service-common` carries the ONE reading of the address a client reaches this
# emulator at, which a broker's published endpoints name, and of the framing an
# answer that carries no content states (`service_common::no_content_responses`),
# which this service's tag mutations answer at.
service-common = { path = "../common" }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
hex = { workspace = true }

[lints]
workspace = true
