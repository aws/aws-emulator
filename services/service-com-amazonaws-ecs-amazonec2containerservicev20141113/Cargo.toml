[package]
name = "service-com-amazonaws-ecs-amazonec2containerservicev20141113"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
# The Elastic Load Balancing v2 service, for TWO reads of a target group a `loadBalancers`
# entry names: its `TargetType`, which decides whether that group can carry the tasks of the
# service's task definition (`crate::state::target_group_target_types`), and whether any load
# balancer forwards to it, which decides whether those tasks can be reached at all
# (`crate::state::unattached_target_groups`). The target group lives in that service's own
# store in the shared engine, so these are cross-service READS of it rather than a copy of a
# value the request carried. No cycle: that crate does not depend on this one.
service-com-amazonaws-elasticloadbalancingv2-elasticloadbalancing-v10 = { workspace = true }
# The CLASSIC Elastic Load Balancing service, for ONE read of the load balancer a
# `loadBalancers` entry's `loadBalancerName` names: whether the account holds one by that name
# in the Region the request was signed for, which decides whether the container instances this
# service's tasks run on could be registered with it at all
# (`crate::state::held_classic_load_balancer_names`). The load balancer lives in that
# service's own store in the shared engine, so this is a cross-service READ of it rather than
# a copy of a value the request carried. No cycle: that crate does not depend on this one.
service-com-amazonaws-elasticloadbalancing-elasticloadbalancing-v7 = { workspace = true }
# The Cloud Map (service discovery) service, for ONE read of the namespace a Service Connect
# request names: whether Cloud Map holds it, which decides whether a listing scoped to that
# namespace can be walked at all (`crate::state::cloud_map_holds_namespace`). The namespace
# is that service's resource, held in its own store in the shared engine, so this is a
# cross-service READ rather than a copy kept here. No cycle: that crate depends on no
# service crate.
service-com-amazonaws-servicediscovery-route53autonaming-v20170314 = { workspace = true }
# The Amazon EC2 service, for ONE read of the Amazon VPC networking a launch placed a task
# in: whether that placement has a path to the registry the task's images are fetched from,
# which decides whether the task can be launched at all (`crate::state::evaluate_image_pulls`).
# The subnets, route tables, NAT gateways and VPC endpoints it reads are that service's own
# resources, held in its own store in the shared engine, so this is a cross-service READ
# rather than a copy kept here. No cycle: that crate depends on no service crate.
service-com-amazonaws-ec2-amazonec2 = { workspace = true }
# The Amazon ECR service, which SERVES the image pull a launched task's containers need:
# whether the task's execution role may pull, whether the registry holds the image the
# reference names, and the upstream import a pull through cache rule makes on the first pull
# (`crate::state::evaluate_image_pulls` ->
# `…ecr…::state::registry_pull::serve_pull`). The repositories, images and cache rules are
# that service's own resources, held in its own store in the shared engine, so the pull is
# answered by the service that owns them rather than by a copy kept here. No cycle: that
# crate does not depend on this one.
service-com-amazonaws-ecr-amazonec2containerregistry-v20150921 = { workspace = true }
# IAM, for ONE read of the roles a launched task runs under — its execution role and its task
# role: whether the trust policy each carries lets this service's own service principal assume
# it, which decides whether Amazon ECS can act under the role and so launch the task at all
# (`crate::state::evaluate_launch_role_assumptions`). The role and its trust document are
# that service's own records, held in its own store in the shared engine, so this is a
# cross-service READ of them rather than a copy kept here. No cycle: that crate depends on no
# service crate.
# ALSO the account's identity-based policy documents and permissions boundaries: the
# authorization decision every mutating request is judged by
# (`src/service/authorization.rs`) reads them through IAM's own accessors.
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
# The session registry in that same shared engine, which is where `sts:GetCallerIdentity`
# answers from: the authorization decision resolves the principal a request's credential
# speaks for through STS's OWN resolution rather than guessing it
# (`src/service/authorization.rs`). No cycle: that crate does not depend on this one.
service-com-amazonaws-sts-awssecuritytokenservicev20110615 = { workspace = true }
# The Amazon EC2 Auto Scaling service, for ONE read of the Auto Scaling group a capacity
# provider's `autoScalingGroupProvider` names: whether the account holds that group, which
# decides whether the provider can be created at all
# (`crate::state::unresolved_auto_scaling_group_refusal`). The group is that service's own
# resource, held in its own store in the shared engine, so this is a cross-service READ
# rather than a copy kept here. No cycle: that crate does not depend on this one.
service-com-amazonaws-autoscaling-autoscaling-2011-01-01 = { workspace = true }
# The AWS Secrets Manager service, for the launch decision a container's `secrets` entries
# turn on: whether the task's EXECUTION role may retrieve the secret a `valueFrom` names, and
# whether that account holds a value to retrieve at all, which decides whether the task's
# containers can be launched (`crate::state::container_secrets`). The secret, the policies on
# it and its deletion state are that service's own records, held in its own store in the
# shared engine, so the decision is answered by the service that owns them rather than by a
# copy kept here. No cycle: that crate does not depend on this one.
service-com-amazonaws-secretsmanager-secretsmanager = { workspace = true }
# `eventbridge_client`: the ONE in-process EventBridge client an emulated service publishes
# an event through, so this crate configures no second copy of that hop. `iam_trust_policy`:
# the tree's ONE reading of a role's trust document, which the execution-role assume above is
# decided by.
service-common = { path = "../common" }
# The AWS SDK for EventBridge, driven over the in-process callback
# (`OperationContext::callback`): Amazon ECS publishes an `ECS Task State Change` event onto
# the account's default event bus as a task moves through its statuses
# (`state::task_events`). Only the generated client is needed — the emulator supplies the
# transport, so the SDK's own HTTPS stack is left out.
aws-sdk-eventbridge = { version = "1", default-features = false }
# The AWS SDK for CloudWatch Logs, driven over the same in-process callback: the `awslogs`
# log driver a container definition configures delivers that container's output to the log
# group it names, through that service's own API (`state::container_logs`), so what a client
# reads back with `GetLogEvents` is what the log service stored.
aws-sdk-cloudwatchlogs = { version = "1", default-features = false }
# The AWS SDK for Secrets Manager, driven over the same in-process callback: a container's
# `secrets` entry is read through that service's own `GetSecretValue` before the container's
# program starts (`state::container_secrets`), so the value injected into a container is the
# one a client reads back from the service that holds it.
aws-sdk-secretsmanager = { version = "1", default-features = false }
# `brush-parser`: the POSIX/bash TOKENIZER AND GRAMMAR a container's `command` is read with
# (`state::container_shell`). The PARSER only: it is a library that computes over data in
# process — it builds a syntax tree and runs nothing, opens nothing and reaches nothing — so
# what EXECUTES a container's program is this crate's own session, whose catalog of
# session-local utilities (output, status, variables, signal handlers, waits), bounds and
# fail-closed default are stated in that module. Its EXECUTING half, `brush-core`, is
# deliberately NOT taken: an engine resolves a command against the host's `PATH`, starts a
# host process for it and opens the host files a redirection names, with no seam to confine
# any of that, so taking it would hand a caller's task definition the host. It compiles no C
# and the tree it locks carries no advisory (it is already in this workspace's lock file, for
# `service-com-amazonaws-codebuild-codebuild-20161006`, which reads a buildspec's command
# lines with it); its `peg` dependency is a procedural macro, so that part of it runs on the
# BUILDER's machine at build time, as every macro in this workspace does.
brush-parser = { version = "0.4", default-features = false }
# `base64`: the user data of an EC2 instance is base64 ("user data must be base64-encoded",
# `RunInstancesRequest$UserData`), and the cluster an instance was launched into is read out
# of it (`state::ec2_capacity`), so the stored text is decoded with the one base64 codec this
# workspace already locks.
base64 = "0.22"
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
# `time`: the clock pump that publishes a task's transitions as they fall due waits for the
# earliest due instant the store holds (`state::task_events::drive_task_clock`), and a
# container's program waits for the seconds a `sleep` in it names
# (`state::container_shell`). `rt`: both of those, and each container's run, are in-process
# tasks spawned onto the runtime serving the request.
tokio = { workspace = true, features = ["time", "rt"] }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
hex = { workspace = true }
# EventBridge and Amazon SQS are mounted beside Amazon ECS on one engine in the integration
# tests, because this service publishes an `ECS Task State Change` event onto the default
# event bus as a task moves and a rule on that bus delivers it to an SQS queue: without them
# mounted there is nothing for the publication to reach.
service-com-amazonaws-eventbridge-awsevents = { workspace = true }
service-com-amazonaws-sqs-amazonsqs = { workspace = true }
# CloudWatch Logs is mounted beside Amazon ECS on one engine for the same reason: the
# `awslogs` log driver delivers a container's output to that service, and the suite reads it
# back with that service's own `GetLogEvents`.
service-com-amazonaws-cloudwatchlogs-logs-20140328 = { workspace = true }
# `percent-encoding`: RFC 3986 percent-encoding for the `application/x-www-form-urlencoded`
# body the test harness posts to Amazon EC2 Auto Scaling's awsQuery endpoint, so the group a
# capacity provider binds onto is created through that service's own API — and to IAM's, so a
# task execution role and its policies are created through IAM's own API.
percent-encoding = "2.3"
# IAM is also MOUNTED beside Amazon ECS on one engine in the integration tests that drive a
# launch: the execution role whose trust policy and policies those launches are decided
# against is created through IAM's own API rather than written into its store. The crate
# itself is a dependency above, for the trust-policy read the launch makes.

[lints]
workspace = true
