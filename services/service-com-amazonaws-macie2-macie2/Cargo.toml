[package]
name = "service-com-amazonaws-macie2-macie2"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Hex, to render the opaque ListCustomDataIdentifiers nextToken from the page
# cursor and to read it back.
hex = { workspace = true }
# Regular expressions, to decide whether a custom data identifier's `regex`
# member is a pattern this service can run before it is stored.
regex = "1.13"
# `service-common` carries this tree's ONE rendering of 16 service-produced bytes
# as the text of a UUID, which is the form a custom data identifier's id takes.
service-common = { path = "../common" }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }

[lints]
workspace = true
