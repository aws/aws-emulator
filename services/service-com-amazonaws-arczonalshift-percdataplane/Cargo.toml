[package]
name = "service-com-amazonaws-arczonalshift-percdataplane"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
# `service-common` carries the ONE shared store this service reads: ARC models no
# operation that registers a managed resource — the service that OWNS the resource turns
# zonal-shift integration on for it — so which resources are registered lives in
# `arc_managed_resources`, written by that service and read here.
service-common = { path = "../common" }
# `chrono` reads the calendar dates and times of day a practice run configuration is
# written in (`blockedDates`, `allowedWindows`, `blockedWindows`), so a value of the
# modelled shape that names no real date or clock time is refused.
chrono = { version = "0.4", default-features = false, features = ["std"] }
# A practice run is blocked while one of the Amazon CloudWatch alarms its practice run
# configuration names is in the ALARM state, and those alarms live in the CloudWatch
# emulator's own alarm store: their state is read through the shared engine, which needs
# the owning service's state TYPE (`state::practice_run_shifts`).
service-com-amazonaws-cloudwatch-graniteserviceversion20100801 = { workspace = true }
# Mixes the per-process counter and seed the UUID-shaped `zonalShiftId` ARC issues is laid
# out from (`state::shift_ids`), so the counter cannot be read back out of an id.
sha2 = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
hex = { workspace = true }
# Declares one suite module per `tests/all/<name>.rs` file, so the integration-test
# target rooted at `tests/all/main.rs` needs no hand-written declaration list.
automod = { workspace = true }

[lints]
workspace = true
